−Φ(1.833) ≈ 1−0.9664 = 3.36%", "結論：偏移1.5σ後不良率從0.08%劇增至約3.36%（增加約42倍）"], "ans": "居中良率≈99.92%；偏移後上方不良率≈3.36%（增加約42倍）"}, {"n": 97, "ch": "製程改善 Cpk 提升計算", "q": "改善前：μ=82, σ=3.5, USL=92, LSL=74。σ降低25%後（σ_new=2.625），μ不變。計算改善前後 Cpk 及提升百分比。", "given": "μ=82, USL=92, LSL=74；改善前σ=3.5，改善後σ=2.625", "steps": ["改善前：CPU=(92−82)/10.5=0.952；CPL=(82−74)/10.5=0.762", "改善前 Cpk = min(0.952, 0.762) = 0.762", "改善後：CPU=(92−82)/7.875=1.270；CPL=(82−74)/7.875=1.016", "改善後 Cpk = min(1.270, 1.016) = 1.016", "提升% = (1.016−0.762)/0.762×100% ≈ 33.3%"], "ans": "改善前Cpk=0.762，改善後Cpk=1.016，提升33.3%"}, {"n": 98, "ch": "X̄-s 管制圖計算", "q": "n=10（B₃=0.284, B₄=1.716, A₃=0.975），5組：X̄: 24.5,25.1,24.8,25.3,24.9；s: 0.52,0.61,0.48,0.55,0.58。計算管制界限。", "given": "n=10, B₃=0.284, B₄=1.716, A₃=0.975；5組數據", "steps": ["X̄̄ = (24.5+25.1+24.8+25.3+24.9)/5 = 124.6/5 = 24.92", "s̄ = (0.52+0.61+0.48+0.55+0.58)/5 = 0.548", "UCL_X̄ = 24.92+0.975×0.548=25.45；LCL_X̄=24.39", "UCL_s = 1.716×0.548=0.940；LCL_s=0.284×0.548=0.156"], "ans": "UCL_X̄=25.45, LCL_X̄=24.39；UCL_s=0.940, LCL_s=0.156"}, {"n": 99, "ch": "滾動良率 RTY 計算", "q": "3站良率：Y₁=0.95, Y₂=0.92, Y₃=0.98，日產量1000件。計算：(1) RTY (2) 通過件數 (3) 若要RTY≥90%，Y₁需多少？", "given": "Y₁=0.95, Y₂=0.92, Y₃=0.98, 日產量1000件", "steps": ["RTY = 0.95×0.92×0.98 = 0.8565 ≈ 85.65%", "日通過件數 = 1000×0.8565 ≈ 857件", "Y₁×0.92×0.98 ≥ 0.90 → Y₁ ≥ 0.90/0.9016 = 0.9982", "即 Y₁ 需達 99.82%"], "ans": "RTY≈85.65%，通過857件；Y₁需≥99.82%才能使RTY≥90%"}, {"n": 100, "ch": "製程能力與σ水準綜合", "q": "μ=500, σ=10, USL=530, LSL=470。計算：(1) Cp (2) Cpk (3) σ水準 (4) 達6σ所需σ值。", "given": "μ=500, σ=10, USL=530, LSL=470", "steps": ["Cp = (530−470)/(6×10) = 60/60 = 1.0", "CPU = CPL = (530−500)/(3×10) = 1.0；Cpk = 1.0（居中）", "3σ水準，不良率≈0.27%（2,700 PPM）", "達6σ（Cpk=2.0）：(530−500)/(3σ)=2.0 → σ=5.0", "即 σ 需從 10 降至 5（降低50%）"], "ans": "Cp=Cpk=1.0（3σ水準）；達6σ需σ降至5.0（不良率從2700 PPM→0.0002 PPM）"},{"n": 261, "ch": "品質成本結構分析", "q": "某工廠月銷售額 NT$5,000,000；品質成本：預防$80,000、鑑定$150,000、內部失敗$220,000、外部失敗$130,000。計算：(1) 總品質成本占銷售額% (2) COPQ占銷售額% (3) 預防：鑑定：失敗比例。", "given": "銷售額$5,000K, 預防$80K, 鑑定$150K, 內失敗$220K, 外失敗$130K", "steps": ["總品質成本 = 80+150+220+130 = NT$580,000", "總品質成本率 = 580,000/5,000,000 = 11.6%", "COPQ = 220,000+130,000 = NT$350,000", "COPQ率 = 350,000/5,000,000 = 7.0%", "預防:鑑定:失敗 = 80:150:350 = 1:1.875:4.375", "→預防成本比例低，建議增加預防投入以降低失敗成本"], "ans": "總品質成本率11.6%，COPQ率7.0%；預防:鑑定:失敗=1:1.9:4.4（失敗成本比例過高，應加強預防）"}, {"n": 262, "ch": "威布爾可靠度計算", "q": "元件壽命服從Weibull分配，β=2.5（形狀），η=1000小時（尺度）。計算：(1) t=500hr的可靠度R(500) (2) MTTF（η×Γ(1+1/β)，Γ(1.4)≈0.887）。", "given": "Weibull: β=2.5, η=1000 hr；Γ(1.4)=0.887", "steps": ["R(t) = exp[-(t/η)^β]", "R(500) = exp[-(500/1000)^2.5] = exp[-(0.5)^2.5]", "(0.5)^2.5 = 0.5² × 0.5^0.5 = 0.25 × 0.707 = 0.1768", "R(500) = exp(-0.1768) ≈ 0.8380 = 83.8%", "MTTF = η × Γ(1+1/β) = 1000 × Γ(1.4) = 1000 × 0.887 = 887 hr"], "ans": "R(500hr)≈83.8%；MTTF≈887小時"}, {"n": 263, "ch": "串並聯可靠度計算", "q": "系統由3個元件組成：A與B並聯後，再與C串聯。R_A=0.90，R_B=0.85，R_C=0.95。計算：(1) A-B並聯可靠度 (2) 系統可靠度 (3) 若需系統R≥0.90，C需提升至多少？", "given": "R_A=0.90, R_B=0.85, R_C=0.95", "steps": ["R_AB（並聯） = 1-(1-0.90)(1-0.85) = 1-0.10×0.15 = 1-0.015 = 0.985", "系統R = R_AB × R_C = 0.985 × 0.95 = 0.9358 = 93.58%", "若需系統R≥0.90：R_C_new = 0.90/0.985 = 0.9137", "即 R_C 只需≥91.37%（目前95%已滿足）"], "ans": "R_AB=98.5%，系統R≈93.6%；C需R_C≥91.4%（現況已達）"}, {"n": 264, "ch": "MTBF與可用性計算", "q": "某設備MTBF=2000小時，MTTR=4小時，每小時維修成本NT$500，每小時停機損失NT$3000。計算：(1) 可用性A (2) 月（720hr）期望停機時間 (3) 月停機損失。", "given": "MTBF=2000hr, MTTR=4hr, 月=720hr", "steps": ["A = MTBF/(MTBF+MTTR) = 2000/(2000+4) = 0.998 = 99.80%", "月故障次數 = 720/2000 = 0.36次（期望）", "月停機時間 = 0.36次 × 4hr/次 = 1.44 hr", "月停機損失 = 1.44 × NT$3,000 = NT$4,320", "維修成本 = 1.44 × NT$500 = NT$720"], "ans": "可用性99.80%，月期望停機1.44hr，停機損失NT$4,320"}, {"n": 265, "ch": "樣本大小計算（比例）", "q": "估計工廠不良率，需在95%信賴水準下，估計誤差E≤1.5%。使用保守估計p=0.5。計算所需樣本數n。（z=1.96）", "given": "E=0.015, p=0.5（保守）, z=1.96, α=5%", "steps": ["n = z² × p(1-p) / E²", "n = (1.96)² × 0.5 × 0.5 / (0.015)²", "n = 3.8416 × 0.25 / 0.000225", "n = 0.9604 / 0.000225", "n = 4,268.4 → 取 n = 4,269"], "ans": "所需樣本數 n = 4,269件"}, {"n": 266, "ch": "樣本大小計算（均值）", "q": "估計螺絲拉力均值，σ=5N，需在95% CI下誤差E≤0.5N，計算所需n；若σ未知，已知前次樣本s=4.8N，n是否有變化？", "given": "σ=5N（或s=4.8N）, E=0.5N, z=1.96", "steps": ["n = (z×σ/E)² = (1.96×5/0.5)² = (19.6)² = 384.16 → n=385", "若用s=4.8：n = (1.96×4.8/0.5)² = (18.816)² = 354.04 → n=355", "實務上建議用已知σ較保守：n=385", "注意：用s估計時常用t分配迭代求解（因σ未知）"], "ans": "σ已知：n=385；用s=4.8估計：n=355（建議取385以較保守）"}, {"n": 267, "ch": "OC 曲線點計算", "q": "抽樣計畫 n=100, c=2，計算在 p=2% 時的允收機率 Pa（使用泊松近似）。（e⁻²=0.1353）", "given": "n=100, c=2, p=0.02；λ=np=2.0；e⁻²=0.1353", "steps": ["λ = 100 × 0.02 = 2.0（泊松近似）", "P(X=0) = e⁻² = 0.1353", "P(X=1) = λe⁻² = 2×0.1353 = 0.2707", "P(X=2) = (λ²/2!)×e⁻² = (4/2)×0.1353 = 0.2707", "Pa = P(X≤2) = 0.1353+0.2707+0.2707 = 0.6767 = 67.67%"], "ans": "Pa ≈ 67.7%（此批不良率2%的允收機率）"}, {"n": 268, "ch": "AOQ 與 AOQL 計算", "q": "承接前題：n=100, c=2, N=500, p=2%, Pa=67.7%。計算：(1) AOQ (2) 假設已知 AOQL=0.84%（最大AOQ值）在哪個p值附近，實際AOQ與AOQL的意義。", "given": "n=100, c=2, N=500, p=0.02, Pa=0.677", "steps": ["AOQ ≈ p×Pa×(N-n)/N = 0.02×0.677×(500-100)/500", "AOQ = 0.02×0.677×0.80 = 0.01083 ≈ 1.08%", "AOQL≈0.84%：這是整條AOQ曲線的最大值", "當p>AOQL對應的p時，AOQ反而隨p增大而下降（因更多批被拒→全數替換）", "此計畫保證長期出廠品質不超過0.84%"], "ans": "AOQ≈1.08%（注：因公式簡化，實際含複雜校正）；AOQL≈0.84%=長期最差出廠品質保證"}, {"n": 269, "ch": "雙次抽樣 ASN 計算", "q": "雙次抽樣：n₁=60, c₁=1（允收），r₁=4（拒收），n₂=60, c₂=3（總累積）。p=0.03時（泊松：λ₁=1.8，e⁻¹·⁸=0.165）。計算Pa₁、Pr₁、ASN。", "given": "n₁=60, c₁=1, r₁=4；p=0.03；λ₁=n₁p=1.8；e⁻¹·⁸=0.165", "steps": ["P(X=0|λ=1.8) = 0.165；P(X=1)=1.8×0.165=0.297", "Pa₁ = P(X≤1) = 0.165+0.297 = 0.462", "P(X≥4) = 1-P(X≤3)≈1-0.891=0.109（查表或計算）", "第一次結論機率：Pa₁+Pr₁ = 0.462+0.109=0.571", "進行第二次抽樣機率 = 1-0.571=0.429", "ASN = n₁ + n₂×(1-Pa₁-Pr₁) = 60+60×0.429 = 60+25.7 = 85.7"], "ans": "ASN≈85.7（介於n₁=60和n₁+n₂=120之間，對此品質水準比單次100有效率）"}, {"n": 270, "ch": "製程能力改善目標計算", "q": "現況：μ=52.0, σ=2.0, USL=58, LSL=46。目標：Cpk≥1.50。計算：(1) 現況Cpk (2) 維持μ不變，σ需降至多少才達Cpk=1.50？", "given": "μ=52.0, σ=2.0, USL=58, LSL=46", "steps": ["CPU = (58-52)/(3×2) = 6/6 = 1.000", "CPL = (52-46)/(3×2) = 6/6 = 1.000", "現況Cpk = min(1.000,1.000) = 1.000", "目標：Cpk=1.50，μ=52（對稱，CPU=CPL）", "(58-52)/(3×σ_new) = 1.50", "σ_new = 6/(3×1.50) = 6/4.5 = 1.333", "σ需從2.0降至1.333（降低33.4%）"], "ans": "現況Cpk=1.000；σ需降至1.333（降33.4%）才能達Cpk=1.50"}, {"n": 271, "ch": "Cp 與 Cpk 差距分析", "q": "製程：USL=100, LSL=88, μ=97.5, σ=1.5。計算Cp、Cpk，及若均值校正至中心值時Cpk的改善量。", "given": "USL=100, LSL=88, σ=1.5, μ=97.5", "steps": ["Cp = (100-88)/(6×1.5) = 12/9 = 1.333", "CPU = (100-97.5)/(3×1.5) = 2.5/4.5 = 0.556", "CPL = (97.5-88)/(3×1.5) = 9.5/4.5 = 2.111", "現況Cpk = min(0.556, 2.111) = 0.556", "若μ→中心值94：CPU=CPL=(100-94)/4.5=6/4.5=1.333", "改善後Cpk=1.333（與Cp相同，提升139%）"], "ans": "現況Cp=1.333，Cpk=0.556（嚴重偏移）；均值校正至中心→Cpk=1.333，提升140%"}, {"n": 272, "ch": "標準差估計與比較", "q": "兩組製程A、B各量測25件，s_A=0.42，s_B=0.28。檢定兩製程變異是否相同（α=5%）。F臨界值F(0.025,24,24)=2.27。", "given": "n_A=n_B=25, s_A=0.42, s_B=0.28, F_crit=2.27, α=5%", "steps": ["H₀: σ_A²=σ_B²，H₁: σ_A²≠σ_B²（雙尾）", "F = s_A²/s_B² = (0.42)²/(0.28)² = 0.1764/0.0784 = 2.25", "自由度 df₁=df₂=24", "F_calc=2.25 < F_crit=2.27（雙尾臨界值）", "結論：無法拒絕H₀，兩製程變異差異統計上不顯著（邊際情況）"], "ans": "F=2.25 < F_crit=2.27，無法拒絕H₀，兩製程變異無統計顯著差異（但很接近臨界值，需監控）"}, {"n": 273, "ch": "單因子 ANOVA 計算", "q": "三台機台各量測4件尺寸：機台A：[10.1, 9.9, 10.2, 10.0]，機台B：[10.5, 10.3, 10.4, 10.6]，機台C：[9.8, 10.0, 9.9, 10.1]。計算：(1) 各機台均值 (2) 判斷機台間是否有顯著差異（F_crit(0.05,2,9)=4.26）。", "given": "n=4每台，k=3台；F_crit(2,9)=4.26", "steps": ["X̄_A=(10.1+9.9+10.2+10.0)/4=10.05", "X̄_B=(10.5+10.3+10.4+10.6)/4=10.45", "X̄_C=(9.8+10.0+9.9+10.1)/4=9.95", "Grand Mean X̄̄=(10.05+10.45+9.95)/3=10.15", "SS_between = 4[(10.05-10.15)²+(10.45-10.15)²+(9.95-10.15)²] = 4[0.01+0.09+0.04]=0.56", "SS_within = 計算各組組內SS和≈0.16", "MS_between=0.56/2=0.28；MS_within=0.16/9=0.0178", "F=0.28/0.0178=15.73 > 4.26 → 拒絕H₀"], "ans": "X̄_A=10.05, X̄_B=10.45, X̄_C=9.95；F≈15.7 > 4.26，三機台均值有顯著差異（p<0.05）"}, {"n": 274, "ch": "X̄-s 管制圖計算", "q": "n=8（A₃=1.099, B₃=0.185, B₄=1.815），6組數據：X̄：24.5,25.2,24.8,25.0,24.7,25.1；s：0.45,0.52,0.48,0.50,0.47,0.53。計算X̄圖和s圖的管制界限。", "given": "n=8, A₃=1.099, B₃=0.185, B₄=1.815；X̄和s資料各6組", "steps": ["X̄̄ = (24.5+25.2+24.8+25.0+24.7+25.1)/6 = 149.3/6 = 24.883", "s̄ = (0.45+0.52+0.48+0.50+0.47+0.53)/6 = 2.95/6 = 0.4917", "UCL_X̄ = 24.883+1.099×0.4917 = 24.883+0.540 = 25.423", "LCL_X̄ = 24.883-0.540 = 24.343", "UCL_s = 1.815×0.4917 = 0.892", "LCL_s = 0.185×0.4917 = 0.091"], "ans": "UCL_X̄=25.42，LCL_X̄=24.34；UCL_s=0.892，LCL_s=0.091"}, {"n": 275, "ch": "u 管制圖計算（變動n）", "q": "5批布匹，面積（n）和缺點數：批1(n=20,c=8)，批2(n=25,c=12)，批3(n=18,c=6)，批4(n=22,c=9)，批5(n=15,c=5)。計算ū、各批UCL_u，並判斷批2是否失控。", "given": "各批n和c如上", "steps": ["總缺點=8+12+6+9+5=40；總面積=20+25+18+22+15=100", "ū = 40/100 = 0.40（缺點/單位面積）", "各批UCL_u = ū + 3√(ū/nᵢ)", "批2：UCL = 0.40+3√(0.40/25)=0.40+3×0.1265=0.40+0.379=0.779", "批2 u₂ = 12/25 = 0.480 < UCL=0.779 → 在管制內 ✓", "批1：UCL=0.40+3√(0.40/20)=0.40+0.424=0.824；u₁=8/20=0.400 ✓"], "ans": "ū=0.40；批2：u=0.48 < UCL=0.779，在管制內"}, {"n": 276, "ch": "移動全距管制圖計算", "q": "個別值X圖：15個觀測值（略），X̄=42.3，MR̄=1.80（d₂=1.128，D₄=3.267）。計算：(1) X圖的UCL、LCL (2) MR圖的UCL (3) σ̂估計值。", "given": "X̄=42.3, MR̄=1.80, d₂=1.128, D₄=3.267", "steps": ["σ̂ = MR̄/d₂ = 1.80/1.128 = 1.596", "UCL_X = X̄ + 3σ̂ = 42.3+3×1.596 = 42.3+4.787 = 47.09", "LCL_X = 42.3-4.787 = 37.51", "UCL_MR = D₄×MR̄ = 3.267×1.80 = 5.88", "LCL_MR = 0（D₃不適用，n=2時不設下界限）"], "ans": "σ̂≈1.60；UCL_X=47.09，LCL_X=37.51；UCL_MR=5.88"}, {"n": 277, "ch": "線性迴歸與預測", "q": "量測5組(X,Y)資料：X=[1,2,3,4,5]，Y=[2.1,3.9,6.2,8.0,9.8]。計算：(1) 迴歸方程 Ŷ=a+bX (2) 當X=6時預測Y。（ΣX=15,ΣY=30,ΣXY=103.2,ΣX²=55,n=5）", "given": "n=5,ΣX=15,ΣY=30,ΣXY=103.2,ΣX²=55", "steps": ["b = (nΣXY-ΣXΣY)/(nΣX²-(ΣX)²)", "b = (5×103.2-15×30)/(5×55-225) = (516-450)/(275-225) = 66/50 = 1.32", "X̄=3，Ȳ=6；a = Ȳ-b×X̄ = 6-1.32×3 = 6-3.96 = 2.04", "迴歸方程：Ŷ = 2.04 + 1.32X", "X=6時：Ŷ = 2.04+1.32×6 = 2.04+7.92 = 9.96"], "ans": "Ŷ = 2.04 + 1.32X；X=6時預測Y≈9.96"}, {"n": 278, "ch": "信賴區間比較與假設檢定", "q": "生產線A（n=36, X̄=120.5, s=3.6）與生產線B（n=36, X̄=118.8, s=4.2），α=5%。檢定兩線均值是否有顯著差異。（z₀.₀₂₅=1.96）", "given": "A: n=36,X̄=120.5,s=3.6；B: n=36,X̄=118.8,s=4.2；z=1.96", "steps": ["H₀: μ_A=μ_B；H₁: μ_A≠μ_B（雙尾）", "Z_calc = (X̄_A-X̄_B)/√(s_A²/n_A+s_B²/n_B)", "= (120.5-118.8)/√(3.6²/36+4.2²/36)", "= 1.7/√(0.36+0.49) = 1.7/√0.85 = 1.7/0.922 = 1.843", "|Z_calc|=1.843 < z_crit=1.96 → 無法拒絕H₀", "結論：兩生產線均值差異統計上不顯著（α=5%）"], "ans": "Z=1.84 < 1.96，不拒絕H₀，兩線均值無顯著差異（但差距明顯，建議增加n）"}, {"n": 279, "ch": "製程偏移檢測：CUSUM計算", "q": "製程目標μ₀=50，σ=2，CUSUM決策參數k=1（參考值），h=4（決策界限）。前7個觀測值：51,52,50,53,52,51,54。計算上方CUSUM C⁺ᵢ（從C⁺₀=0開始），判斷是否失控。", "given": "μ₀=50, k=1, h=4；x₁~x₇: 51,52,50,53,52,51,54", "steps": ["C⁺ᵢ = max(0, xᵢ-μ₀-k+C⁺ᵢ₋₁) = max(0,xᵢ-51+C⁺ᵢ₋₁)", "C⁺₁=max(0,51-51+0)=max(0,0)=0", "C⁺₂=max(0,52-51+0)=1", "C⁺₃=max(0,50-51+1)=0", "C⁺₄=max(0,53-51+0)=2", "C⁺₅=max(0,52-51+2)=3", "C⁺₆=max(0,51-51+3)=3", "C⁺₇=max(0,54-51+3)=6", "C⁺₇=6 > h=4 → 第7點偵測到上移，製程失控 ✓"], "ans": "C⁺: 0,1,0,2,3,3,6 → 第7點C⁺=6>h=4，偵測到製程均值上移，失控"}, {"n": 280, "ch": "測試常態性：偏態與峰態", "q": "30個樣本計算得：偏態係數g₁=1.52，峰態係數g₂=0.85（超峰態）。判斷：(1) 分配形狀 (2) 是否適合建立標準Shewhart管制圖 (3) 建議處理方式。", "given": "n=30, 偏態g₁=1.52, 峰態g₂=0.85", "steps": ["g₁=1.52>0：右偏（正偏）分配，有長右尾", "g₂=0.85>0：尖峰（Leptokurtic），比常態更集中且尾部更厚", "標準常態：g₁=0, g₂=0（超峰態）", "n=30時偏態標準誤≈√(6/30)=0.447；|1.52/0.447|=3.4>2 → 顯著偏態", "Shewhart圖假設常態 → 可能誤判（界限不準確）", "建議：Box-Cox轉換（λ<1）、或使用非常態製程能力方法"], "ans": "明顯右偏（g₁=1.52顯著）+尖峰；需轉換（如Box-Cox）才能有效使用Shewhart圖"}, {"n": 281, "ch": "製程改善後樣本量計算", "q": "改善前不良率p₁=8%，改善後期望p₂=3%，α=5%，β=10%。計算驗證改善效果所需的最小樣本數n。（z_α=1.645，z_β=1.28）", "given": "p₁=0.08, p₂=0.03, z_α=1.645（單尾）, z_β=1.28", "steps": ["p̄ = (p₁+p₂)/2 = 0.055", "n = [z_α√(2p̄(1-p̄))+z_β√(p₁(1-p₁)+p₂(1-p₂))]²/(p₁-p₂)²", "分子第一項: 1.645×√(2×0.055×0.945)=1.645×√(0.1040)=1.645×0.3224=0.530", "分子第二項: 1.28×√(0.08×0.92+0.03×0.97)=1.28×√(0.0736+0.0291)=1.28×√0.1027=1.28×0.3204=0.410", "(0.530+0.410)²/(0.05)² = (0.940)²/0.0025=0.8836/0.0025=353.4", "n ≈ 354 件"], "ans": "驗證改善成效所需最小樣本數≈354件（建議取400件較保守）"}, {"n": 282, "ch": "GR&R 完整計算", "q": "GR&R研究：2位操作員×5個零件×2次重複，操作員A：量測均值X̄_A=25.20，操作員B：X̄_B=24.95；5個零件極差最大值為R̄_max=1.8，R̄（所有20次）=0.42（d₂(2)=1.128，d₂(2)=1.128，k₁=3.65零件間）。計算%GR&R（TV=估計=1.8，製程6σ=10.8）。", "given": "R̄_operators=0.42,操作員差距=|25.20-24.95|=0.25,TV=1.8（給定）,d₂=1.128", "steps": ["EV（重複性）= R̄×k₁ = 0.42×3.65 = 1.533（k₁依2人2次查表）", "AV（再現性）= √[(操作員差距×k₂)²-EV²/nr]；k₂≈2.70", "= √[(0.25×2.70)²-1.533²/(5×2)] = √[0.455-0.235] = √0.220=0.469", "GR&R = √(EV²+AV²) = √(1.533²+0.469²)=√(2.350+0.220)=√2.570=1.603", "%GR&R = GR&R/TV = 1.603/1.8×100% = 89.1%", "判斷：%GR&R=89.1% >> 30% → 量測系統嚴重不合格！"], "ans": "%GR&R≈89%（嚴重不合格），量測系統變異幾乎等同製程變異，須立即改善量具"}, {"n": 283, "ch": "田口 SN 比計算", "q": "望目特性（Nominal-the-Best），目標值T=50，3次重複：y₁=49.5，y₂=50.3，y₃=50.8。計算：(1) ȳ (2) s (3) SN比（望目型：SN=10log(ȳ²/s²)）。", "given": "T=50, y₁=49.5, y₂=50.3, y₃=50.8", "steps": ["ȳ = (49.5+50.3+50.8)/3 = 150.6/3 = 50.20", "偏差：-0.70, +0.10, +0.60；SS=(0.49+0.01+0.36)=0.86", "s² = 0.86/(3-1) = 0.43；s = 0.656", "SN = 10×log(ȳ²/s²) = 10×log(50.20²/0.43)", "= 10×log(2520/0.43) = 10×log(5860) = 10×3.768 = 37.68 dB", "SN越大=信噪比越高=品質越穩定"], "ans": "ȳ=50.20，s=0.656，SN比≈37.68 dB"}, {"n": 284, "ch": "信賴區間（比例）計算", "q": "n=200件，發現12件不良。計算：(1) 樣本不良率p̂ (2) 95% CI（使用Wilson或常態近似）(3) 是否可推論母體不良率<10%？（z=1.96）", "given": "n=200, x=12（不良），z=1.96", "steps": ["p̂ = 12/200 = 0.060", "SE = √(p̂(1-p̂)/n) = √(0.06×0.94/200) = √0.000282 = 0.01679", "95% CI = p̂ ± z×SE = 0.060 ± 1.96×0.01679 = 0.060 ± 0.033", "95% CI = (0.027, 0.093)", "CI上界0.093 < 0.10 → 有95%把握母體不良率<10%"], "ans": "p̂=6%，95% CI=(2.7%, 9.3%)；有95%信心推論母體不良率<10%"}, {"n": 285, "ch": "超幾何vs二項分配比較", "q": "批量N=100，不良D=5。(1) 無放回抽n=10：P(X=0)用超幾何計算。(2) 用二項近似計算P(X=0)。(3) 比較兩者誤差。（C(95,10)=7.5億，C(100,10)=17.3億，0.95¹⁰=0.599）", "given": "N=100, D=5, n=10；C(95,10)≈7.5億，C(100,10)≈17.3億", "steps": ["超幾何：P(X=0)=C(5,0)×C(95,10)/C(100,10)=1×7.5億/17.3億=0.4335≈43.4%", "二項近似：p=5/100=0.05，P(X=0)=(1-0.05)¹⁰=0.95¹⁰=0.5987≈59.9%", "差異：|43.4%-59.9%|=16.5%（誤差顯著）", "n/N=10%（>5%）→母體有限修正大，超幾何更準；二項誤差大"], "ans": "超幾何P(0)≈43.4%；二項近似≈59.9%；差異16.5%。n/N=10%，應用超幾何"}, {"n": 286, "ch": "卡方檢定（適配性）", "q": "骰子投擲600次，觀測次數：1點=95，2點=102，3點=98，4點=105，5點=100，6點=100。α=5%，χ²(0.05,5)=11.07。檢定骰子是否公平。", "given": "n=600，6面各期望=100；觀測：95,102,98,105,100,100；χ²_crit=11.07", "steps": ["期望E = 600/6 = 100（每面）", "χ² = Σ(O-E)²/E", "= (95-100)²/100+(102-100)²/100+(98-100)²/100+(105-100)²/100+(100-100)²/100+(100-100)²/100", "= 25/100+4/100+4/100+25/100+0+0", "= 0.25+0.04+0.04+0.25+0+0 = 0.58", "χ²_calc=0.58 << χ²_crit=11.07 → 不拒絕H₀"], "ans": "χ²=0.58 << 11.07，不拒絕H₀，骰子可視為公平"}, {"n": 287, "ch": "製程穩定性統計檢定（Run Test）", "q": "管制圖上連續15個點是否隨機：+,-,+,+,-,-,+,-,+,+,+,-,-,+,-（+代表中心線以上，-以下）。計算遊程數R，判斷是否有非隨機模式（n₁=8正，n₂=7負，R_lower=5，R_upper=13，α=5%）。", "given": "n₁=8（+），n₂=7（-）；Run test臨界值R_L=5，R_U=13", "steps": ["序列：+,-,+,+,-,-,+,-,+,+,+,-,-,+,-", "計算遊程數（連續相同符號的串）：", "(+),(-),(++),(--),(+),(-),(+++),(--),(+),(-)=10個遊程", "R=10，5≤10≤13 → 無法拒絕隨機性假設", "結論：管制圖上的點排列沒有非隨機模式的統計證據"], "ans": "R=10，落在[5,13]區間內，不拒絕隨機性假設，序列無非隨機模式"}, {"n": 288, "ch": "卡方檢定（獨立性）", "q": "調查200人，品質培訓（受訓/未受訓）vs產品合格（是/否）：受訓合格90，受訓不合格10；未受訓合格70，未受訓不合格30。計算χ²，判斷培訓與合格率是否獨立。（χ²_crit(0.05,1)=3.84）", "given": "受訓：合格90，不合格10；未受訓：合格70，不合格30；χ²_crit=3.84", "steps": ["列聯表：受訓合格90、不合格10、小計100；未受訓合格70、不合格30、小計100", "邊際：合格=160，不合格=40，總n=200", "期望：E(受訓合格)=100×160/200=80；E(受訓不合格)=100×40/200=20", "E(未受訓合格)=80；E(未受訓不合格)=20", "χ²=(90-80)²/80+(10-20)²/20+(70-80)²/80+(30-20)²/20", "= 100/80+100/20+100/80+100/20=1.25+5+1.25+5=12.5", "12.5 > 3.84 → 拒絕獨立性假設"], "ans": "χ²=12.5 > 3.84，拒絕獨立假設；品質培訓與合格率有顯著關聯（培訓有效）"}, {"n": 289, "ch": "量測不確定度合成", "q": "長度量測不確定度來源：(1) 量具重複性u₁=0.02mm (2) 校正偏差u₂=0.01mm (3) 溫度影響u₃=0.015mm。假設獨立，計算：(1) 合成標準不確定度u_c (2) 擴充不確定度U（k=2）。", "given": "u₁=0.02, u₂=0.01, u₃=0.015（mm），k=2", "steps": ["u_c = √(u₁²+u₂²+u₃²)", "= √(0.02²+0.01²+0.015²)", "= √(0.0004+0.0001+0.000225)", "= √0.000725 = 0.02693 mm", "U = k × u_c = 2 × 0.02693 = 0.05386 ≈ 0.054 mm", "量測結果表示：L = X ± 0.054 mm（95%信賴水準，k=2）"], "ans": "u_c≈0.027mm，U=0.054mm（k=2，95%信賴水準）"}, {"n": 290, "ch": "FMEA 改善前後比較", "q": "失效模式X：S=8，O=7，D=6，RPN=336。實施改善A（O降至4）和改善B（D降至3）後，計算各自新RPN和總降幅，選擇最佳改善方案（成本相同）。", "given": "原RPN=S×O×D=8×7×6=336；改善A：O→4；改善B：D→3", "steps": ["改善A後：RPN_A = 8×4×6 = 192", "改善B後：RPN_B = 8×7×3 = 168", "RPN降幅：A降144（43%），B降168（50%）", "改善B（提升偵測能力）效果更佳", "同時實施A+B：RPN = 8×4×3 = 96（降幅71%）", "建議：先實施B（降幅更大），再評估是否需要A"], "ans": "改善A:RPN=192（降43%）；改善B:RPN=168（降50%）；B效果更佳；若同時實施RPN=96（降71%）"}, {"n": 291, "ch": "柏拉圖與改善優先化", "q": "某月缺陷：刮傷=185次，缺料=92次，尺寸超差=68次，氣泡=45次，變色=30次，其他=22次。計算各項%及累積%。(1) 依80%原則，找出重點項目 (2) 改善刮傷可減少50%，改善後柏拉圖如何變化？", "given": "刮傷185，缺料92，尺寸超差68，氣泡45，變色30，其他22", "steps": ["總計=185+92+68+45+30+22=442", "各%：刮傷41.9%，缺料20.8%，尺寸15.4%，氣泡10.2%，變色6.8%，其他5.0%", "累積%：41.9→62.7→78.1→88.3→95.0→100%", "80%法則：前三項（刮傷+缺料+尺寸）累積78.1%→重點改善項", "改善刮傷50%：刮傷→93次；新總計=357；刮傷新%=26.1%", "改善後第一位仍可能是缺料或刮傷，需重新排列"], "ans": "重點項目：刮傷(41.9%)、缺料(20.8%)、尺寸超差(15.4%)累計78.1%；刮傷改善50%後，缺料躍升為第一"}, {"n": 292, "ch": "RTY 與 DPU 計算", "q": "4個製程站，每站良率：Y₁=0.96，Y₂=0.98，Y₃=0.94，Y₄=0.99。計算：(1) RTY (2) DPU（defects per unit）(3) 若要RTY≥95%，找出最差站並計算其需要提升至多少。", "given": "Y₁=0.96, Y₂=0.98, Y₃=0.94, Y₄=0.99", "steps": ["RTY = 0.96×0.98×0.94×0.99 = 0.9600×0.9800×0.94×0.99", "= 0.9408×0.94×0.99 = 0.8843×0.99 ≈ 0.8755 = 87.55%", "DPU = -ln(RTY) = -ln(0.8755) ≈ 0.133（每件平均0.133個缺陷）", "最差站：Y₃=0.94（94%）；其他Y=0.96×0.98×0.99=0.9310", "要RTY≥0.95：Y₃_new ≥ 0.95/0.9310 = 1.020 → 不可能靠Y₃單獨達到", "需同時改善多站；即使Y₃=100%，RTY=0.9310<95%→Y₃不是唯一限制"], "ans": "RTY≈87.55%，DPU≈0.133；即使Y₃=100%，RTY仍只有93.1%，需同時改善多站"}, {"n": 293, "ch": "Pre-Control 方法應用", "q": "規格USL=20.0，LSL=16.0，目標T=18.0。Pre-Control分區：(1) 計算綠/黃/紅區界限 (2) 連續量測：18.5，17.8，19.6，17.2，18.8，判斷每點屬於哪區 (3) 說明操作決策規則。", "given": "USL=20.0，LSL=16.0，T=18.0", "steps": ["Pre-Control分區：規格寬=20-16=4.0", "綠區（中間50%）：T±25%規格寬=18.0±1.0=[17.0,19.0]", "黃區上：[19.0,20.0]；黃區下：[16.0,17.0]", "紅區：>20.0或<16.0", "各點：18.5→綠，17.8→綠，19.6→黃上，17.2→黃下，18.8→綠", "規則：初次生產連5點綠→開始生產；生產中1點黃=繼續；2連續黃（同側）=調整；任1點紅=立即停線"], "ans": "綠區[17,19]，黃區[16,17]和[19,20]；量測點：綠、綠、黃上、黃下、綠；第3點和第4點在不同側黃區，不觸發停線規則"}, {"n": 294, "ch": "接收抽樣計畫設計", "q": "顧客要求：AQL=0.65%（生產者風險α≤5%），LTPD=4.0%（消費者風險β≤10%）。使用泊松近似，設計單次抽樣計畫（n, c）。（參考：c=1時，n≈76；c=2時，n≈153；驗證β條件）", "given": "AQL=0.0065, LTPD=0.04, α≤0.05, β≤0.10", "steps": ["對於c=1：n×AQL≈0.35（使α≈5%） → n≈0.35/0.0065=53.8≈54", "驗證β：λ_LTPD=54×0.04=2.16，Pa=e⁻²·¹⁶(1+2.16)=0.116×3.16=0.367>0.10 ✗", "c=2：n×AQL≈0.82 → n=0.82/0.0065=126", "λ_LTPD=126×0.04=5.04；Pa=e⁻⁵·⁰⁴(1+5.04+12.7)=0.0065×18.74=0.122 ✗", "c=3：n×AQL≈1.37→n=211；λ_LTPD=211×0.04=8.44；Pa≈Poisson(≤3,8.44)≈0.032<0.10 ✓"], "ans": "建議方案：c=3，n≈211（滿足α≤5%在AQL，β≈3%<10%在LTPD）"}, {"n": 295, "ch": "EWMA 管制界限計算", "q": "EWMA: λ=0.20，σ=1.5，目標μ₀=100，L=3（控制界限係數）。計算第1、2、3次觀測後的σ_EWMA（穩態和初始）及UCL。（穩態：σ_EWMA=σ√(λ/(2-λ))）", "given": "λ=0.20, σ=1.5, μ₀=100, L=3", "steps": ["穩態σ_EWMA = σ×√(λ/(2-λ)) = 1.5×√(0.20/1.80) = 1.5×√0.1111 = 1.5×0.3333 = 0.500", "穩態UCL = 100+3×0.500 = 101.5；LCL = 98.5", "初始（第i點）：σᵢ=σ√(λ/(2-λ)×(1-(1-λ)^(2i)))", "i=1：σ₁=1.5×√(0.1111×(1-0.64))=1.5×√0.040=1.5×0.200=0.300；UCL₁=100.9", "i=2：σ₂=1.5×√(0.1111×(1-0.41))=1.5×√0.065=1.5×0.256=0.384；UCL₂=101.15", "i=3：σ₃=1.5×√(0.1111×(1-0.262))=1.5×√0.082=1.5×0.286=0.429；UCL₃=101.29"], "ans": "穩態UCL=101.5，LCL=98.5；初始界限從寬逐漸收窄：UCL₁=100.9→UCL₂=101.15→UCL₃=101.29"}, {"n": 296, "ch": "量測線性分析", "q": "在5個參考值處校正量具，量測結果：\n參考值 x：[2, 5, 8, 11, 14]\n量測值 y：[2.1, 5.3, 8.6, 11.2, 14.5]\n計算各點Bias，迴歸Bias=f(x)，判斷是否有線性問題。（已知Bias均值=0.34，斜率b=0.044）", "given": "參考x:[2,5,8,11,14]，量測y:[2.1,5.3,8.6,11.2,14.5]；b=0.044", "steps": ["各點Bias(=y-x)：+0.1,+0.3,+0.6,+0.2,+0.5", "平均Bias=（0.1+0.3+0.6+0.2+0.5）/5=1.7/5=0.34", "迴歸分析（已知）：Bias = a + b×x，斜率b=0.044≠0", "斜率≠0表示量具在不同量測範圍的偏差不一致=存在線性問題", "低值x=2時Bias≈0.18；高值x=14時Bias≈0.52", "建議重新校正，特別是高量測範圍端"], "ans": "平均Bias=0.34mm；斜率b=0.044≠0，存在線性問題（高值偏差大於低值）"}, {"n": 297, "ch": "製程能力與不良率轉換", "q": "製程X~N(μ=150, σ=5)，USL=165, LSL=135。計算：(1) Cp (2) Cpk (3) 良率（Φ(3)=0.9987, Φ(4)=0.99997）(4) 若σ降至4，新Cpk和良率為何（Φ(3.75)=0.99991）。", "given": "μ=150,σ=5,USL=165,LSL=135；Φ(3)=0.9987,Φ(4)=0.99997,Φ(3.75)=0.99991", "steps": ["Cp = (165-135)/(6×5) = 30/30 = 1.000", "CPU = (165-150)/(3×5) = 15/15 = 1.000", "CPL = (150-135)/(3×5) = 1.000；Cpk = 1.000（居中）", "良率=2Φ(3)-1=2×0.9987-1=0.9974=99.74%（2700 PPM）", "改善後σ=4：Cp=(165-135)/(24)=1.25；Cpk=(165-150)/(12)=1.25", "新良率=2Φ(3.75)-1=2×0.99991-1=0.99982=99.982%（180 PPM）"], "ans": "原Cp=Cpk=1.00，良率99.74%（2700PPM）；σ=4後Cpk=1.25，良率99.98%（180PPM）"}, {"n": 298, "ch": "Gauge R&R：重複性計算", "q": "3位操作員各量測10個零件2次，得到以下全距數據（每操作員的X̄_range）：Operator A：R̄_A=0.36，Operator B：R̄_B=0.42，Operator C：R̄_C=0.38。n=2次（d₂=1.128），計算EV（重複性）。", "given": "R̄_A=0.36, R̄_B=0.42, R̄_C=0.38；重複次數=2，d₂=1.128", "steps": ["R̄_overall = (0.36+0.42+0.38)/3 = 1.16/3 = 0.3867", "EV = R̄_overall / d₂ = 0.3867 / 1.128 = 0.3428（一個σ的EV）", "5.15σ重複性（90%寬度）= 5.15 × 0.3428 = 1.765", "6σ重複性寬度 = 6 × 0.3428 = 2.057", "管制界限上界：UCL_R = D₄×R̄ = 3.267×0.3867=1.263（D₄ for n=2=3.267）", "各操作員R̄需 < 1.263，否則操作員量測一致性不足"], "ans": "EV=0.343（σ），6σEV寬度=2.057；若規格寬10，%EV=2.057/10×100%=20.6%（需<10%才理想）"}, {"n": 299, "ch": "抽樣計畫轉換計算", "q": "原抽樣計畫（正常）：n=80, Ac=5, Re=6。近5批中有2批拒收，轉換至加嚴。加嚴計畫n不變，找新的Ac（AQL=2.5%，J代字加嚴抽樣表Ac=3，Re=4）。計算：(1) 正常vs加嚴的消費者保護差異 (2) 批量N=1000時，ATI在p=5%時的差異。", "given": "正常: n=80, Ac=5；加嚴: n=80, Ac=3；p=0.05, N=1000；e⁻⁴=0.018", "steps": ["p=5%時，λ=80×0.05=4", "正常Pa_N=P(X≤5|λ=4)=e⁻⁴(1+4+8+10.67+10.67+8.53)/=0.018×42.87=0.771", "加嚴Pa_T=P(X≤3|λ=4)=e⁻⁴(1+4+8+10.67)=0.018×23.67=0.426", "ATI_正常=80+（1-0.771）×920=80+210.7=291", "ATI_加嚴=80+(1-0.426)×920=80+528.1=608", "加嚴後ATI大幅增加（更多批被拒→全數檢），對供應商壓力更大"], "ans": "p=5%時：正常Pa=77.1%，加嚴Pa=42.6%；ATI正常≈291，ATI加嚴≈608（加嚴使全檢頻率大增）"}, {"n": 300, "ch": "綜合品質提升效益計算", "q": "工廠年銷售NT$50,000,000，改善前：預防$500K，鑑定$1,200K，內失敗$4,000K，外失敗$2,500K。改善後：預防$800K，鑑定$1,000K，內失敗$2,000K，外失敗$800K。計算：(1) 改善前後COPQ (2) 總品質成本變化 (3) ROI (4) COPQ占銷售額比率。", "given": "銷售$50,000K；改善前後各品質成本如題", "steps": ["改善前COPQ=4,000+2,500=NT$6,500K；TQC=500+1200+4000+2500=NT$8,200K", "改善後COPQ=2,000+800=NT$2,800K；TQC=800+1000+2000+800=NT$4,600K", "COPQ降低=6,500-2,800=NT$3,700K（降幅57%）", "TQC降低=8,200-4,600=NT$3,600K", "增加預防成本=800-500=NT$300K；增加投資=300K", "ROI=（COPQ節省-額外投入）/額外投入=(3700-300)/300=3400/300=11.3倍（1133%）", "改善前COPQ率=6500/50000=13%；改善後=2800/50000=5.6%"], "ans": "COPQ：$6,500K→$2,800K（降57%）；ROI=11.3倍（1133%）；COPQ率13%→5.6%"},
{"n": 461, "ch": "CQT計算題", "q": "一個位置度公差框格標示 ⌀0.4Ⓜ，零件實際尺寸為 ⌀19.94mm（名義尺寸 ⌀20.00mm，公差 +0.00/-0.10mm）。請計算額外可用的位置公差（bonus tolerance）為多少mm？", "given": "請參考題目條件", "steps": ["對於外部特徵（軸），MMC=最大尺寸=20.00mm；實際尺寸=19.94mm；Bonus tolerance = MMC - 實際尺寸 = 20.00 - 19.94 = 0.06mm"], "ans": "0.06mm", "opts": ["A. 0.04mm", "B. 0.06mm", "C. 0.10mm", "D. 0.16mm"], "correct": "B"},
{"n": 462, "ch": "CQT計算題", "q": "一個孔的位置度標示 ⌀0.3Ⓜ，孔的名義尺寸 ⌀10.00mm，公差 +0.10/+0.00mm（MMC=10.00mm）。若實際孔徑量測為 ⌀10.08mm，可用的總位置公差為多少？", "given": "請參考題目條件", "steps": ["對於內部特徵（孔），MMC=最小尺寸=10.00mm；實際尺寸=10.08mm；Bonus = 10.08 - 10.00 = 0.08mm；總位置公差 = 0.30 + 0.08 = ⌀0.38mm"], "ans": "⌀0.38mm", "opts": ["A. ⌀0.30mm", "B. ⌀0.38mm", "C. ⌀0.10mm", "D. ⌀0.08mm"], "correct": "B"},
{"n": 463, "ch": "CQT計算題", "q": "某零件測量到的孔中心位置：X偏差=+0.15mm，Y偏差=-0.10mm。計算真位置偏差（True Position Deviation）⌀值為多少mm？", "given": "請參考題目條件", "steps": ["True Position Deviation = 2√(ΔX² + ΔY²) = 2√(0.15² + 0.10²) = 2√(0.0225 + 0.01) = 2√0.0325 = 2 × 0.1803 ≈ ⌀0.36mm"], "ans": "⌀0.36mm", "opts": ["A. ⌀0.18mm", "B. ⌀0.25mm", "C. ⌀0.36mm", "D. ⌀0.50mm"], "correct": "C"},
{"n": 464, "ch": "CQT計算題", "q": "某量測系統Gage R&R分析結果：量測重複性(EV)=0.020mm，再現性(AV)=0.015mm，零件變異(PV)=0.100mm。計算量測系統變異(%GRR)佔總變異的百分比？", "given": "請參考題目條件", "steps": ["GRR = √(EV² + AV²) = √(0.020² + 0.015²) = √(0.0004+0.000225) = √0.000625 = 0.025mm；TV = √(GRR² + PV²) = √(0.025² + 0.100²) = √(0.000625+0.01) = √0.010625 = 0.1031mm；%GRR = GRR/TV × 100 = 0.025/0.1031 × 100 ≈ 24.3%"], "ans": "25.0%", "opts": ["A. 15.6%", "B. 25.0%", "C. 25.5%", "D. 6.25%"], "correct": "B"},
{"n": 465, "ch": "CQT計算題", "q": "某製程規格為 50.00 ± 0.50mm，製程平均值 = 50.20mm，製程標準差 σ = 0.15mm。計算 Cpk 值？", "given": "請參考題目條件", "steps": ["CPU = (USL - X̄)/(3σ) = (50.50 - 50.20)/(3×0.15) = 0.30/0.45 = 0.667；CPL = (X̄ - LSL)/(3σ) = (50.20 - 49.50)/(3×0.15) = 0.70/0.45 = 1.556；Cpk = min(0.667, 1.556) = 0.667"], "ans": "0.89", "opts": ["A. 0.89", "B. 1.11", "C. 0.67", "D. 1.33"], "correct": "A"},
{"n": 466, "ch": "CQT計算題", "q": "某電子組件可靠度服從指數分布，MTBF = 5000小時。若工作時間為1000小時，求其可靠度 R(t)？（e⁻⁰·² ≈ 0.8187）", "given": "請參考題目條件", "steps": ["R(t) = e^(-t/MTBF) = e^(-1000/5000) = e^(-0.2) ≈ 0.8187，即約81.87%的可靠度"], "ans": "0.8187", "opts": ["A. 0.90", "B. 0.8187", "C. 0.6321", "D. 0.7788"], "correct": "B"},
{"n": 467, "ch": "CQT計算題", "q": "一批貨共2000件，抽取80件進行檢驗，發現4件不合格品。估計批次不良率(p̂)及95%信賴區間下界（Z=1.96）？", "given": "請參考題目條件", "steps": ["p̂ = 4/80 = 0.05；SE = √(p̂(1-p̂)/n) = √(0.05×0.95/80) = √0.000594 = 0.02437；下界 = 0.05 - 1.96×0.02437 = 0.05 - 0.048 = 0.002；較精確：下界≈0.05-1.96×0.0244≈0.002，取最接近選項"], "ans": "p̂=0.05，下界=0.014", "opts": ["A. p̂=0.05，下界=0.014", "B. p̂=0.05，下界=0.029", "C. p̂=0.04，下界=0.002", "D. p̂=0.04，下界=0.009"], "correct": "A"},
{"n": 468, "ch": "CQT計算題", "q": "某SPC管制圖：X̄管制圖，n=5，X̄̄(總均值)=25.0，R̄=0.8，A₂=0.577。計算UCL_X̄？", "given": "請參考題目條件", "steps": ["UCL_X̄ = X̄̄ + A₂×R̄ = 25.0 + 0.577×0.8 = 25.0 + 0.462 = 25.462 ≈ 25.46"], "ans": "25.46", "opts": ["A. 25.46", "B. 25.58", "C. 24.54", "D. 25.80"], "correct": "A"},
{"n": 469, "ch": "CQT計算題", "q": "某DOE全因子實驗，有3個因子，每個因子2個水平，每個處理組合重複2次。總共需要幾個試驗？", "given": "請參考題目條件", "steps": ["試驗數 = 2³ × 2（重複次數）= 8 × 2 = 16次"], "ans": "16", "opts": ["A. 6", "B. 12", "C. 16", "D. 24"], "correct": "C"},
{"n": 470, "ch": "CQT計算題", "q": "抽樣計劃中，批量N=3000，使用MIL-STD-1916 AQL=1.0%，一般檢驗Level II。查表得樣本代字為K，樣本大小n=125，接受數Ac=3。若樣本中發現5件不合格品，應如何處置？", "given": "請參考題目條件", "steps": ["不合格品數(5) > 接受數Ac(3)，且5 ≥ 拒絕數Re(4)，因此判定拒絕批次，需全數篩選或退貨"], "ans": "拒絕批次，全數篩選或退貨", "opts": ["A. 接受批次", "B. 拒絕批次，全數篩選或退貨", "C. 切換到加嚴檢驗後接受", "D. 增加抽樣數量後再判定"], "correct": "B"},
{"n": 471, "ch": "CQT計算題", "q": "某串聯系統由3個元件組成，各元件可靠度分別為 R₁=0.95，R₂=0.98，R₃=0.97。計算系統可靠度？", "given": "請參考題目條件", "steps": ["串聯系統可靠度 = R₁×R₂×R₃ = 0.95×0.98×0.97 = 0.95×0.9506 = 0.9031 ≈ 0.903"], "ans": "0.904", "opts": ["A. 0.900", "B. 0.904", "C. 0.950", "D. 0.967"], "correct": "B"},
{"n": 472, "ch": "CQT計算題", "q": "某並聯系統由2個相同元件組成，每個元件可靠度 R=0.80。計算系統可靠度？", "given": "請參考題目條件", "steps": ["並聯系統可靠度 = 1-(1-R₁)(1-R₂) = 1-(1-0.80)(1-0.80) = 1-(0.20×0.20) = 1-0.04 = 0.96"], "ans": "0.96", "opts": ["A. 0.64", "B. 0.80", "C. 0.96", "D. 0.90"], "correct": "C"},
{"n": 473, "ch": "CQT計算題", "q": "使用「接受抽樣計劃」，AQL=1.5%，樣本n=200，接受數Ac=7。若批次實際不良率為3%，利用泊松近似，λ=np=200×0.03=6，P(X≤7|λ=6)≈0.744。批次被接受的概率約為？", "given": "請參考題目條件", "steps": ["利用泊松近似：λ = np = 200×0.03 = 6；P(接受) = P(X≤7|λ=6) ≈ 0.744，即約74.4%的機率接受此批次"], "ans": "74.4%", "opts": ["A. 25.6%", "B. 74.4%", "C. 50.0%", "D. 88.2%"], "correct": "B"},
{"n": 474, "ch": "CQT計算題", "q": "某FMEA分析：S=8，O=5，D=4。若採取改善措施後 O降至2，D降至2，新RPN為多少？", "given": "請參考題目條件", "steps": ["原RPN = 8×5×4 = 160；改善後RPN = S×O_new×D_new = 8×2×2 = 32"], "ans": "32", "opts": ["A. 32", "B. 64", "C. 80", "D. 160"], "correct": "A"},
{"n": 475, "ch": "CQT計算題", "q": "某量測數據共10次：{10.1, 10.3, 10.0, 10.2, 10.1, 10.4, 10.2, 10.1, 10.3, 10.2}。計算樣本標準差s（取近似值）？", "given": "請參考題目條件", "steps": ["X̄ = (10.1+10.3+10.0+10.2+10.1+10.4+10.2+10.1+10.3+10.2)/10 = 101.9/10 = 10.19；各偏差平方和≈0.125；s = √(0.125/9) = √0.01389 ≈ 0.118"], "ans": "s≈0.118", "opts": ["A. s≈0.118", "B. s≈0.130", "C. s≈0.100", "D. s≈0.150"], "correct": "A"},
{"n": 476, "ch": "CQT計算題", "q": "某校準實驗室量測標準不確定度：重複性u₁=0.003mm，標準器不確定度u₂=0.002mm，溫度效應u₃=0.001mm。合成標準不確定度u_c為多少mm？", "given": "請參考題目條件", "steps": ["u_c = √(u₁²+u₂²+u₃²) = √(0.003²+0.002²+0.001²) = √(0.000009+0.000004+0.000001) = √0.000014 ≈ 0.00374mm ≈ 0.0037mm"], "ans": "0.0037mm", "opts": ["A. 0.006mm", "B. 0.003mm", "C. 0.004mm", "D. 0.0037mm"], "correct": "D"},
{"n": 477, "ch": "CQT計算題", "q": "某批零件100件，抽樣10件，其中2件不合格。若使用超幾何分布估算，這批零件的估計不良品數量最可能為多少件？", "given": "請參考題目條件", "steps": ["樣本不良率 p̂ = 2/10 = 20%；估計總體不良數 = 100 × 20% = 20件"], "ans": "20件", "opts": ["A. 5件", "B. 10件", "C. 20件", "D. 2件"], "correct": "C"},
{"n": 478, "ch": "CQT計算題", "q": "某製程 USL=10.5，LSL=9.5，X̄=10.0，s=0.10。計算Cp和Ppk（均用s）？", "given": "請參考題目條件", "steps": ["Cp = (USL-LSL)/(6s) = (10.5-9.5)/(6×0.10) = 1.0/0.6 = 1.667；由於平均值在中心，CPL=CPUk=1.667，Ppk=min=1.667"], "ans": "Cp=1.67，Ppk=1.67", "opts": ["A. Cp=1.67，Ppk=1.67", "B. Cp=1.67，Ppk=1.67", "C. Cp=3.33，Ppk=1.67", "D. Cp=1.67，Ppk=0.83"], "correct": "A"},
{"n": 479, "ch": "CQT計算題", "q": "某工廠有5台相同機器生產同一零件，ANOVA分析結果：SSBetween=45.0（df=4），SSWithin=20.0（df=20）。計算F統計值？", "given": "請參考題目條件", "steps": ["MSBetween = SSBetween/dfBetween = 45.0/4 = 11.25；MSWithin = SSWithin/dfWithin = 20.0/20 = 1.0；F = MSBetween/MSWithin = 11.25/1.0 = 11.25"], "ans": "F=11.25", "opts": ["A. F=11.25", "B. F=2.25", "C. F=9.00", "D. F=4.50"], "correct": "A"},
{"n": 480, "ch": "CQT計算題", "q": "某熱處理爐的溫度均勻性測試：7點量測結果（°C）：{852, 848, 850, 853, 847, 851, 849}。計算極差(Range)為多少°C？", "given": "請參考題目條件", "steps": ["最大值=853°C，最小值=847°C；極差 = 853-847 = 6°C"], "ans": "6°C", "opts": ["A. 3°C", "B. 4°C", "C. 6°C", "D. 8°C"], "correct": "C"},
{"n": 481, "ch": "CQT計算題", "q": "某零件壁厚規格為 3.00 ± 0.15mm（LSL=2.85，USL=3.15）。製程平均=3.02mm，σ=0.04mm。計算 Cpk？", "given": "請參考題目條件", "steps": ["CPU=(USL-X̄)/(3σ)=(3.15-3.02)/(3×0.04)=0.13/0.12=1.083；CPL=(X̄-LSL)/(3σ)=(3.02-2.85)/(0.12)=0.17/0.12=1.417；Cpk=min(1.083,1.417)=1.083≈1.08"], "ans": "Cpk=1.25", "opts": ["A. Cpk=1.08", "B. Cpk=1.25", "C. Cpk=1.50", "D. Cpk=0.92"], "correct": "B"},
{"n": 482, "ch": "CQT計算題", "q": "使用游標卡尺量測10個零件的直徑，已知游標卡尺解析度0.02mm。計算量測的解析度貢獻的標準不確定度（均勻分布，u = resolution/(2√3)）？", "given": "請參考題目條件", "steps": ["對於均勻分布，半寬a = 0.02/2 = 0.01mm；u = a/√3 = 0.01/1.7321 ≈ 0.00577mm"], "ans": "0.00577mm", "opts": ["A. 0.00577mm", "B. 0.01000mm", "C. 0.01155mm", "D. 0.02000mm"], "correct": "A"},
{"n": 483, "ch": "CQT計算題", "q": "某零件規格長度 100.00 ± 0.05mm，在溫度22°C下量測得100.02mm，材料熱膨脹係數α=12×10⁻⁶/°C。修正到標準溫度20°C的實際尺寸為多少？", "given": "請參考題目條件", "steps": ["溫差ΔT = 22-20 = 2°C；熱膨脹修正量 = L × α × ΔT = 100.02 × 12×10⁻⁶ × 2 = 0.00240mm；修正尺寸（降溫收縮）= 100.02 - 0.0024 = 99.9976 ≈ 99.998mm"], "ans": "99.998mm", "opts": ["A. 99.998mm", "B. 100.018mm", "C. 100.022mm", "D. 99.978mm"], "correct": "A"},
{"n": 484, "ch": "CQT計算題", "q": "某AQL抽樣計劃，批量N=1500，AQL=2.5%，一般檢驗Level II。查MIL-STD-105E表：樣本代字=K，n=125，Ac=7，Re=8。抽取125件，發現不合格品6件，應如何判定？", "given": "請參考題目條件", "steps": ["不合格品數(6) ≤ 接受數Ac(7)，且6 < 拒絕數Re(8)，因此接受批次"], "ans": "接受，因為6 ≤ Ac(7)", "opts": ["A. 拒絕，因為超過5件", "B. 接受，因為6 ≤ Ac(7)", "C. 縮小樣本重新抽樣", "D. 切換加嚴檢驗並拒絕"], "correct": "B"},
{"n": 485, "ch": "CQT計算題", "q": "某設備修復時間數據（MTTR，小時）：{2.5, 3.0, 1.5, 4.0, 2.0, 3.5, 2.5}。計算平均修復時間(MTTR)？", "given": "請參考題目條件", "steps": ["MTTR = (2.5+3.0+1.5+4.0+2.0+3.5+2.5)/7 = 19.0/7 ≈ 2.71小時"], "ans": "2.71小時", "opts": ["A. 2.5小時", "B. 2.71小時", "C. 3.0小時", "D. 2.86小時"], "correct": "B"},
{"n": 486, "ch": "CQT計算題", "q": "某SPC分析：X̄管制圖，n=4，A₂=0.729，X̄̄=50.0，R̄=1.2。點N落在X̄=51.0。該點距UCL多遠（正向）？", "given": "請參考題目條件", "steps": ["UCL = X̄̄ + A₂×R̄ = 50.0 + 0.729×1.2 = 50.0 + 0.875 = 50.875；點值51.0 > UCL 50.875，已超出管制界限"], "ans": "點在管制內，距UCL=0.125", "opts": ["A. 0.125", "B. 0.125標準差", "C. UCL=50.875，點超出管制", "D. 點在管制內，距UCL=0.125"], "correct": "D"},
{"n": 487, "ch": "CQT計算題", "q": "三個量測值的平均值X̄=25.10mm，擴展不確定度U=0.06mm（k=2）。真值落在區間[25.04, 25.16]的機率約為多少？", "given": "請參考題目條件", "steps": ["k=2對應95.45%的信賴水準（常態分布），故真值落在 25.10±0.06mm 的機率約95.45%"], "ans": "95.45%", "opts": ["A. 68.27%", "B. 95.45%", "C. 99.73%", "D. 90.00%"], "correct": "B"},

{"n": 489, "ch": "CQT計算題", "q": "某熱處理製程規格為 850±15°C（LSL=835，USL=865）。量測10爐次平均值X̄=848°C，樣本標準差s=4.5°C。計算Cpk？", "given": "請參考題目條件", "steps": ["CPU=(865-848)/(3×4.5)=17/13.5=1.259；CPL=(848-835)/(13.5)=13/13.5=0.963；Cpk=min(1.259,0.963)=0.963≈0.96"], "ans": "Cpk=0.96", "opts": ["A. Cpk=0.96", "B. Cpk=1.02", "C. Cpk=1.11", "D. Cpk=1.33"], "correct": "A"},
{"n": 490, "ch": "CQT計算題", "q": "某零件圓柱表面量測3處直徑：{19.98, 20.02, 20.00}mm，名義尺寸20.00mm，公差±0.05mm。計算圓度誤差（最大-最小）/2？", "given": "請參考題目條件", "steps": ["最大值=20.02mm，最小值=19.98mm；極差=0.04mm；圓度誤差（半極差）= 0.04/2 = 0.02mm"], "ans": "0.02mm", "opts": ["A. 0.02mm", "B. 0.04mm", "C. 0.01mm", "D. 0.03mm"], "correct": "A"},
{"n": 491, "ch": "CQT計算題", "q": "某品質成本分析：預防成本=$50,000，鑑定成本=$30,000，內部失效=$40,000，外部失效=$20,000。品質成本佔銷售額比例為多少（銷售額=$700,000）？", "given": "請參考題目條件", "steps": ["總品質成本 = 50,000+30,000+40,000+20,000 = $140,000；占比 = 140,000/700,000 × 100 = 20%"], "ans": "14%", "opts": ["A. 10%", "B. 20%", "C. 20%", "D. 14%"], "correct": "D"},
{"n": 492, "ch": "CQT計算題", "q": "某零件做「首件檢驗」，共量測8個尺寸特性，每個特性規格均為±0.10mm，量測值均在規格內。若Cp要求≥1.33，計算允許的最大製程標準差σ？（以總規格寬度計算）", "given": "請參考題目條件", "steps": ["Cp = (USL-LSL)/(6σ) ≥ 1.33；6σ ≤ 0.20/1.33；σ ≤ 0.20/(6×1.33) = 0.20/7.98 ≈ 0.0250mm"], "ans": "σ≤0.0250mm", "opts": ["A. σ≤0.0250mm", "B. σ≤0.0376mm", "C. σ≤0.0500mm", "D. σ≤0.0125mm"], "correct": "A"},

{"n": 494, "ch": "CQT計算題", "q": "某螺紋量規：Go規通過，No-Go規也通過（即No-Go沒有阻止），表示零件螺紋狀態為？", "given": "請參考題目條件", "steps": ["No-Go規通過說明零件未達最小材料條件(LMC)要求，螺紋小徑過大或節徑過小，零件不合格（尺寸不足）"], "ans": "超差——牙形太小（尺寸不足，沒達到最小實體條件）", "opts": ["A. 合格", "B. 超差——牙形太小（尺寸不足，沒達到最小實體條件）", "C. 超差——牙形太大（超過最大實體條件）", "D. 需要重新量測"], "correct": "B"},
{"n": 495, "ch": "CQT計算題", "q": "某DOE分析，2因子全因子設計（2²）結果：A效應=+3.0，B效應=+2.0，AB交互效應=+1.0。因子A從低(-1)到高(+1)時，平均響應值增加多少（其他因子在低水平）？", "given": "請參考題目條件", "steps": ["Factor A效應定義為高水平均值-低水平均值=3.0；從低到高的增加量=效應/2 = 3.0/2 = 1.5（效應是兩端差，增加量是差的一半）"], "ans": "1.5", "opts": ["A. 1.5", "B. 2.0", "C. 3.0", "D. 4.0"], "correct": "A"},
{"n": 496, "ch": "CQT計算題", "q": "某品質目標：每月客戶投訴件數不超過5件（UCL）。過去12個月投訴數：{3,4,2,5,6,3,4,2,5,7,3,4}。共有幾個月超出目標？", "given": "請參考題目條件", "steps": ["超出5件的月份：第5月=6件，第10月=7件，共2個月超出目標"], "ans": "2個月", "opts": ["A. 1個月", "B. 2個月", "C. 3個月", "D. 4個月"], "correct": "B"},

{"n": 499, "ch": "CQT計算題", "q": "某「可靠度成長試驗」(HALT/HASS)中，某元件在加速試驗條件下，在溫度85°C下壽命為500小時。利用Arrhenius模型，已知活化能Ea=0.7eV，k=8.617×10⁻⁵ eV/K，計算在25°C下的預期壽命（AF=e^[Ea/k×(1/T_use-1/T_stress)]）。已知AF≈60，則預期壽命為多少小時？", "given": "請參考題目條件", "steps": ["25°C壽命 = 加速壽命 × AF = 500 × 60 = 30,000小時"], "ans": "30,000小時", "opts": ["A. 500小時", "B. 8,333小時", "C. 30,000小時", "D. 60,000小時"], "correct": "C"},

{"n":741,"ch":"[基礎] 品質成本 PAF 計算","q":"[基礎] 某月份品質成本：預防NT$60,000、鑑定NT$120,000、內部失敗NT$180,000、外部失敗NT$90,000。計算：(1) 總品質成本 (2) COPQ (3) 各類占比。","given":"預防$60K, 鑑定$120K, 內部失敗$180K, 外部失敗$90K","steps":["總品質成本 = 60+120+180+90 = NT$450,000","COPQ = 180+90 = NT$270,000","預防占比=60/450=13.3%；鑑定=120/450=26.7%；COPQ=270/450=60.0%","失敗成本占60%→預防投入嚴重不足","★ 衍伸：業界最佳狀態預防:鑑定:失敗比例趨近50:30:20（柯根曲線）","★ 記憶：P-A-F=Prevention預防+Appraisal鑑定+Failure失敗；COPQ=A+F（廣義含鑑定）或只含F（狹義）"],"ans":"總品質成本NT$450,000；COPQ NT$270,000（60%）；預防13.3%，鑑定26.7%，失敗60.0%"},
{"n":742,"ch":"[基礎] GD&T 位置度計算","q":"[基礎] 孔名義位置(50.00,30.00)，實際量測(50.08,29.94)，位置度公差⌀0.20mm。計算：(1) 實際位置偏差量 (2) 判斷是否合格。","given":"名義(50.00,30.00)，實際(50.08,29.94)，位置度公差⌀0.20mm","steps":["ΔX = 50.08-50.00 = +0.08mm","ΔY = 29.94-30.00 = -0.06mm","實際位置偏差（直徑值）= 2×√(0.08²+0.06²) = 2×√(0.0064+0.0036) = 2×0.100 = 0.200mm","偏差0.200mm = 公差⌀0.20mm → 剛好在界限上，合格（等於公差值仍合格）","★ 衍伸：GD&T位置度公差帶為圓形（直徑值），非方框（±值）","★ 公式記憶：位置偏差=2×√(ΔX²+ΔY²)，類似直角三角形斜邊再乘2"],"ans":"實際偏差=⌀0.200mm，等於公差⌀0.20mm，判定合格（邊界值）"},
{"n":743,"ch":"[基礎] MMC Bonus Tolerance 計算","q":"[基礎] 軸（外部特徵）MMC=25.00mm，LMC=24.90mm，位置度公差框格：⌀0.10Ⓜ。實際量測軸徑=24.93mm。計算總可用位置公差。","given":"MMC=25.00mm，LMC=24.90mm，標示位置公差=⌀0.10mm，實際尺寸=24.93mm","steps":["對外部特徵（軸），MMC=最大尺寸=25.00mm","Bonus Tolerance = MMC-實際尺寸 = 25.00-24.93 = 0.07mm","總可用位置公差 = 標示公差+Bonus = 0.10+0.07 = ⌀0.17mm","★ 衍伸：MMC修飾符Ⓜ的邏輯—零件偏離MMC（有更多材料餘量）時，可以容許更多位置偏差","★ 口訣：外部特徵 Bonus=MMC-實際；內部特徵（孔）Bonus=實際-MMC（LMC=最小尺寸）","★ 應用：汽車螺孔位置度常用，可降低製造成本同時保證功能互換性"],"ans":"Bonus=0.07mm，總位置公差=⌀0.17mm"},
{"n":744,"ch":"[進階] GD&T 平面度與圓柱度","q":"[進階] 量測平面8個點（mm）：10.02,10.05,9.98,10.03,10.07,9.96,10.01,10.04。(1) 計算平面度誤差 (2) 公差=0.10mm，是否合格？","given":"8點高度：10.02,10.05,9.98,10.03,10.07,9.96,10.01,10.04（mm）","steps":["最高點=10.07mm；最低點=9.96mm","平面度誤差=最高-最低=10.07-9.96=0.11mm","公差=0.10mm；0.11>0.10 → 不合格 ✗","★ 衍伸：平面度（Flatness）=所有點必須落在兩平行平面之間；是形狀公差，無需基準","★ 與平行度不同：平面度不涉及位置，只是形狀；平行度是方向公差（需基準）","★ 改善方法：精密研磨、刮削、磁性吸盤加工後應力釋放導致平面度惡化"],"ans":"平面度誤差=0.11mm，超過公差0.10mm，不合格"},
{"n":745,"ch":"[基礎] Cpk 計算與判斷","q":"[基礎] μ=24.8mm，σ=0.4mm，USL=26.0mm，LSL=23.0mm。計算：(1) Cp (2) CPU (3) CPL (4) Cpk (5) 判斷是否達IATF 16949要求（Cpk≥1.33）。","given":"μ=24.8，σ=0.4，USL=26.0，LSL=23.0","steps":["Cp=(26.0-23.0)/(6×0.4)=3.0/2.4=1.250","CPU=(26.0-24.8)/(3×0.4)=1.2/1.2=1.000","CPL=(24.8-23.0)/(3×0.4)=1.8/1.2=1.500","Cpk=min(CPU,CPL)=1.000","Cp=1.25但Cpk=1.000→製程偏向USL側","Cpk=1.000<1.33 → 不符IATF 16949要求","★ 衍伸：Cp反映潛力，Cpk反映實際（含均值偏移）；Cp>Cpk說明均值偏移","★ 改善：先調整μ至中心24.5，CPU=CPL=(1.5)/(1.2)=1.25；再降σ達Cpk=1.33"],"ans":"Cp=1.25，Cpk=1.00；不符IATF 16949（需Cpk≥1.33），均值偏向USL側需調整"},
{"n":746,"ch":"[進階] X̄-R 管制圖建立與失控判斷","q":"[進階] n=4（A₂=0.729, D₃=0, D₄=2.282），X̄̄=50.2，R̄=2.4。新5組數據（X̄,R）：(52.1,2.1),(51.8,2.5),(52.3,2.0),(53.1,2.8),(52.9,2.3)。計算管制界限，判斷各組是否失控。","given":"n=4, A₂=0.729, D₄=2.282, D₃=0；X̄̄=50.2, R̄=2.4；5組新數據如題","steps":["UCL_X̄=50.2+0.729×2.4=50.2+1.750=51.950","LCL_X̄=50.2-1.750=48.450；UCL_R=2.282×2.4=5.477；LCL_R=0","各組判斷（UCL_X̄=51.95）：","(52.1,2.1)：52.1>51.95 → X̄超出UCL ✗","(51.8,2.5)：51.8>51.95 → 超出 ✗","(52.3,2.0)：超出 ✗","(53.1,2.8)：超出 ✗","(52.9,2.3)：超出 ✗","5組X̄均超出UCL，R圖均在管制內","★ 診斷：均值持續偏高→設備調整、材料批次、操作方式可能改變","★ 衍伸：管制圖只偵測「特殊原因」，X̄超界=需調查；R圖正常=批內一致性OK"],"ans":"UCL_X̄=51.95；5組X̄全部超出UCL（製程均值上移），R圖正常；需立即查明原因"},
{"n":747,"ch":"[進階] 長短期製程能力比較","q":"[進階] 短期n=30：s_ST=1.5mm；長期N=200：s_LT=2.1mm。USL=50，LSL=38，μ=44。計算：(1) Cpk（短期）(2) Ppk（長期）(3) Z_shift。","given":"s_ST=1.5，s_LT=2.1；μ=44，USL=50，LSL=38","steps":["短期Cpk：CPU=(50-44)/(3×1.5)=6/4.5=1.333；CPL=(44-38)/4.5=1.333；Cpk=1.333","長期Ppk：Ppu=(50-44)/(3×2.1)=6/6.3=0.952；Ppl=(44-38)/6.3=0.952；Ppk=0.952","Z_shift=3×Cpk-3×Ppk=3×1.333-3×0.952=4.0-2.857=1.143σ","★ 衍伸：Cpk用R̄/d₂估計短期σ（批內），Ppk用長期s（含批間漂移）","★ 差距大=製程長期不穩定=需加強標準化、原料管制、設備維護","★ 六標準差假設1.5σ長期漂移（Z_shift=1.5σ）；本案例1.14σ，控制尚可"],"ans":"Cpk=1.333（短期），Ppk=0.952（長期）；Z_shift=1.14σ，存在明顯長期漂移"},
{"n":748,"ch":"[基礎] 可靠度：指數分配基本計算","q":"[基礎] 電子元件故障率λ=0.001次/hr（指數分配）。計算：(1) MTBF (2) R(1000hr) (3) R(500hr) (4) 中位壽命t_m。（e⁻¹≈0.368，e⁻⁰·⁵≈0.607，ln2≈0.693）","given":"λ=0.001/hr；e⁻¹=0.368，e⁻⁰·⁵=0.607，ln2=0.693","steps":["MTBF=1/λ=1/0.001=1,000小時","R(t)=exp(-λt)","R(1000)=e⁻¹=0.368=36.8%","R(500)=e⁻⁰·⁵=0.607=60.7%","中位壽命：e^(-0.001×t_m)=0.5→t_m=ln2/0.001=693小時","★ 衍伸：R(MTBF)=e⁻¹≈36.8%（不是50%！）；中位壽命=0.693×MTBF","★ 指數分配具無記憶性（memoryless）→適合偶發故障期（浴缸曲線中段）","★ 記憶：MTBF=1/λ；R(t)=e^(-λt)；F(t)=1-R(t)=累積失效率"],"ans":"MTBF=1000hr；R(1000hr)=36.8%；R(500hr)=60.7%；中位壽命=693hr"},
{"n":749,"ch":"[進階] 串並聯系統可靠度","q":"[進階] 系統：A與B串聯後與C並聯，再與D串聯。RA=0.92，RB=0.88，RC=0.95，RD=0.97。計算：(1) R_AB (2) R_ABC (3) R_系統。","given":"RA=0.92, RB=0.88, RC=0.95, RD=0.97","steps":["R_AB（串聯）=0.92×0.88=0.8096","R_ABC（並聯）=1-(1-0.8096)(1-0.95)=1-0.1904×0.05=1-0.00952=0.9905","R_系統=R_ABC×RD=0.9905×0.97=0.9608=96.08%","★ 衍伸：串聯=乘積（越串越小）；並聯=1-失效率乘積（冗餘提升可靠度）","★ 重要設備常用1oo2（1-out-of-2）或2oo3投票系統","★ 記憶：串聯R=R₁×R₂×…；並聯F=F₁×F₂×…（F=1-R）"],"ans":"R_AB=0.8096，R_ABC=0.9905，系統R=96.08%"},
{"n":750,"ch":"[進階] Weibull 分析","q":"[進階] Weibull分配：β=1.5，η=800hr。計算：(1) R(400hr) (2) 失效率h(400) (3) 判斷浴缸曲線所在階段。（e⁻⁰·³⁵⁴≈0.702）","given":"β=1.5, η=800hr；e⁻⁰·³⁵⁴=0.702","steps":["R(t)=exp[-(t/η)^β]","(400/800)^1.5=(0.5)^1.5=0.5×√0.5=0.5×0.707=0.354","R(400)=exp(-0.354)=0.702=70.2%","h(t)=(β/η)×(t/η)^(β-1)=(1.5/800)×(400/800)^0.5=0.001875×0.707=0.001326次/hr","β=1.5>1→失效率隨時間增加→磨耗期","★ 浴缸曲線：β<1=早夭期；β=1=偶發期（指數分配）；β>1=磨耗期","★ β越大，磨耗越急；η=特性壽命（63.2%累積失效時的壽命）","★ 記憶：β決定形狀→趨勢；η決定尺度→壽命長短"],"ans":"R(400hr)≈70.2%；h(400)≈0.00133次/hr；β=1.5>1→磨耗期（失效率遞增）"},
{"n":751,"ch":"[進階] MTBF與可用性計算","q":"[進階] 設備月記錄720hr：故障5次，修復時間：3.5,2.0,4.5,1.5,3.5hr。計算：(1) MTTR (2) MTBF (3) 可用性A (4) 月預期生產時間。","given":"月720hr，5次故障，修復時間如題","steps":["總停機=3.5+2.0+4.5+1.5+3.5=15.0hr","MTTR=15.0/5=3.0hr/次","實際生產時間=720-15=705hr；MTBF=705/5=141hr/次","A=MTBF/(MTBF+MTTR)=141/(141+3)=141/144=0.9792=97.92%","月預期生產=720×0.9792≈705hr","★ 衍伸：A=可靠性×維修性的綜合指標；提升A=增MTBF或降MTTR","★ 設備A<95%→需改善維修策略或增加備用設備","★ 記憶公式：A=MTBF/(MTBF+MTTR)=Uptime/(Uptime+Downtime)"],"ans":"MTTR=3.0hr，MTBF=141hr，A=97.92%，月預期生產≈705hr"},
{"n":752,"ch":"[高難] 系統可靠度與保固成本","q":"[高難] 產品MTBF=3,000hr（指數分配），保固1年=8,760hr，每次維修NT$2,500，年產10,000件。計算：(1) 保固期故障概率 (2) 預期維修次數/件 (3) 年保固成本。（e⁻²·⁹²≈0.054）","given":"MTBF=3000hr，保固=8760hr，NT$2500/次，年產10000件；e⁻²·⁹²=0.054","steps":["F(8760)=1-e^(-8760/3000)=1-e^(-2.92)=1-0.054=0.946=94.6%","預期維修次數/件（泊松）=8760/3000=2.92次","年維修總次數=10,000×2.92=29,200次","年保固成本=29,200×NT$2,500=NT$73,000,000","★ 衍伸：MTBF=3000hr<保固期8760hr→幾乎所有產品在保固期內都會故障！","★ 設計目標：MTBF應≥10×保固期；本案例需提升至MTBF≥87,600hr","★ 可靠性成長測試（RGT）：找出早期失效並改善設計"],"ans":"故障概率94.6%；預期維修2.92次/件；年保固成本NT$73,000,000（MTBF嚴重不足，需大幅改善）"},
{"n":753,"ch":"[基礎] AQL 抽樣查表應用","q":"[基礎] N=1,200件，ANSI Z1.4，一般檢驗水準II，AQL=1.0%，正常單次抽樣。確定：(1) 樣本代字 (2) n (3) Ac (4) Re。","given":"N=1200，GIS II，AQL=1.0%，正常單次抽樣","steps":["N=1,201~3,200→樣本代字=K（查Z1.4代字表）","代字K，正常單次，AQL=1.0%→n=125，Ac=3，Re=4","作業：抽125件；不良≤3件允收；≥4件拒收","★ 衍伸：Z1.4為計數值抽樣；Z1.9為計量值抽樣（樣本量更少）","★ GIS水準：I=破壞性/少量；II=一般標準；III=重要/高信心","★ 記憶：N越大→代字字母越後→n越大；AQL越嚴→允收數越少"],"ans":"樣本代字K，n=125，Ac=3，Re=4"},
{"n":754,"ch":"[進階] 雙次抽樣計畫計算","q":"[進階] 雙次抽樣：n₁=80，c₁=2，r₁=5，n₂=80，c₂=6（累積）。p=3%時（λ=2.4，e⁻²·⁴=0.091）。計算：(1) Pa₁ (2) Pr₁ (3) ASN。","given":"n₁=80, c₁=2, r₁=5；p=0.03；λ=2.4；e⁻²·⁴=0.091","steps":["P(0)=0.091；P(1)=2.4×0.091=0.218；P(2)=2.88×0.091=0.262","Pa₁=P(X≤2)=0.091+0.218+0.262=0.571","P(3)=4.608×0.091=0.209；P(4)=2.765×0.091×0.5≈0.125","P(X≥5)=1-（0.091+0.218+0.262+0.209+0.125）=1-0.905=0.095","進入第二次機率=1-0.571-0.095=0.334","ASN=80+80×0.334=80+26.7≈107件","★ 衍伸：雙次抽樣比單次（n=160）平均節省約33%樣本量","★ p低時多數第一次就允收→ASN接近n₁=80（效率最高）","★ 缺點：操作較複雜，需兩階段決策"],"ans":"Pa₁=57.1%（第一次即允收）；ASN≈107件（比單次160件節省33%）"},
{"n":755,"ch":"[進階] 田口損失函數比較","q":"[進階] 兩方案：A（k=500，σ=0.3，μ=目標T）；B（k=500，σ=0.15，μ=T+0.2）。計算E[L]=k×(σ²+(μ-T)²)並比較。","given":"k=500，T=目標值；設計A：σ=0.3，μ=T；設計B：σ=0.15，μ=T+0.2","steps":["E[L]=k×(σ²+(μ-T)²)","設計A：E[L_A]=500×(0.09+0)=NT$45","設計B：E[L_B]=500×(0.0225+0.04)=500×0.0625=NT$31.25","設計B損失更小（31.25<45）","即使B有0.2偏移，但σ降低50%→整體損失仍較小","★ 衍伸：田口哲學：降低變異比調整均值更重要","★ 公式展開：E[(y-T)²]=σ²+(μ-T)²=變異+偏移²（期望值分解）","★ 記憶：田口損失函數L=k(y-T)²；期望損失E[L]=k(σ²+(μ-T)²)"],"ans":"E[L_A]=NT$45，E[L_B]=NT$31.25；設計B更佳（即使有偏移，降低變異效益更大）"},
{"n":756,"ch":"[基礎] 抽樣計畫 AOQ 計算","q":"[基礎] 抽樣計畫n=50，c=1，N=1000，p=2%（λ=1.0，e⁻¹=0.368）。計算：(1) Pa (2) AOQ (3) 說明AOQ意義。","given":"n=50, c=1, N=1000, p=0.02；λ=1.0，e⁻¹=0.368","steps":["P(0)=e⁻¹=0.368；P(1)=1×e⁻¹=0.368","Pa=0.368+0.368=0.736=73.6%","AOQ=p×Pa×(N-n)/N=0.02×0.736×950/1000=0.02×0.736×0.95=0.01399≈1.40%","AOQ意義：長期平均出廠不良率（允收批留下p%不良，拒收批全數篩選變0%）","★ 衍伸：AOQL=AOQ曲線的最高點=長期出廠品質的最壞保證","★ p很高時，更多批被拒→全數篩選→AOQ反而降低","★ 記憶：AOQ=p×Pa×(N-n)/N；AOQL=max(AOQ)"],"ans":"Pa=73.6%，AOQ≈1.40%；AOQL是此計畫能保證的最差長期出廠品質"},
{"n":757,"ch":"[進階] FMEA Action Priority（AP）方法","q":"[進階] AIAG-VDA FMEA 5版：三個失效模式A(S=8,O=4,D=5)、B(S=7,O=6,D=4)、C(S=9,O=3,D=6)。計算各RPN，說明AP方法如何改變優先順序。","given":"A: S=8,O=4,D=5；B: S=7,O=6,D=4；C: S=9,O=3,D=6","steps":["RPN_A=8×4×5=160；RPN_B=7×6×4=168（最高）；RPN_C=9×3×6=162","傳統RPN排序：B>C>A","AP方法（AIAG-VDA 2019）以嚴重度S為第一優先","C的S=9最高→AP評定為H（High），需立即採取行動","即使RPN_C=162<RPN_B=168，C仍優先","★ 衍伸：AP方法解決RPN數學缺陷（不同組合可得相同RPN）","★ AP規則：S≥9或10=必定為H；S較低但O和D均高=可能為M；S和O均低=L","★ 記憶：S>O>D（嚴重度最重要，偵測度影響最小）"],"ans":"RPN：A=160，B=168，C=162；AP法以C（S=9）優先，而非RPN最高的B"},
{"n":758,"ch":"[進階] OEE 設備整體效能計算","q":"[進階] 設備日班480分鐘，計畫停機60分，非計畫停機40分，理論速率=100件/分，實際產量=32,300件，良品=31,000件。計算：(1) 可用率A (2) 效能率P (3) 品質率Q (4) OEE。","given":"計畫=480min，計畫停=60min，非計畫停=40min，理論速=100件/min，產量=32300件，良品=31000件","steps":["計畫生產時間=480-60=420min","實際生產時間=420-40=380min","A=380/420=90.5%","P=32300/(100×380)=32300/38000=85.0%","Q=31000/32300=96.0%","OEE=0.905×0.850×0.960=0.738=73.8%","★ 衍伸：世界級OEE≥85%；73.8%有改善空間","★ OEE六大損失：①設備故障②換模/調整（→可用率）③小停機④速度損失（→效能率）⑤不良品⑥啟動損失（→品質率）","★ 記憶：OEE=A×P×Q；各指標均用百分比相乘"],"ans":"A=90.5%，P=85.0%，Q=96.0%，OEE=73.8%（目標≥85%）"},
{"n":759,"ch":"[基礎] 量測系統 Bias 計算","q":"[基礎] 標準件=20.00mm，10次量測：20.03,19.98,20.05,20.02,19.97,20.04,20.01,20.03,19.99,20.02。規格寬T=2mm。計算：(1) X̄ (2) Bias (3) %Bias (4) 是否合格（<5%）。","given":"參考值=20.00mm，10次量測，T=2mm","steps":["ΣX=200.14；X̄=200.14/10=20.014mm","Bias=X̄-參考值=20.014-20.00=+0.014mm","%Bias=|0.014|/2.0×100%=0.70%","0.70%<5%→合格 ✓","★ 衍伸：Bias=準確性問題（系統性偏差），可透過校正消除","★ 重複性=精密性問題（隨機誤差），即使Bias=0仍需檢查重複性","★ 完整MSA：Bias（準確性）+重複性（EV）+再現性（AV）=GR&R"],"ans":"X̄=20.014mm，Bias=+0.014mm，%Bias=0.70%<5%，合格"},
{"n":760,"ch":"[進階] MSA GR&R 完整計算","q":"[進階] GR&R：EV=0.12mm，AV=0.08mm，PV=0.50mm，規格寬T=2.0mm。計算：(1) GR&R (2) TV (3) %GR&R（製程基礎）(4) 判斷。","given":"EV=0.12, AV=0.08, PV=0.50（mm）；T=2.0mm","steps":["GR&R=√(0.12²+0.08²)=√(0.0144+0.0064)=√0.0208=0.1442mm","TV=√(0.1442²+0.50²)=√(0.0208+0.25)=√0.2708=0.5204mm","%GR&R（製程基礎）=GR&R/TV=0.1442/0.5204=27.7%","判斷：10%~30%邊際，依應用場合評估","★ 標準：<10%理想；10~30%可接受（需評估）；>30%不合格","★ 第二種%GR&R（規格基礎）=5.15×GR&R/T=5.15×0.1442/2.0=37.1%（不合格）","★ 衍伸：ndc=1.41×(PV/GR&R)=1.41×(0.50/0.1442)=4.89<5→鑑別力不足"],"ans":"GR&R=0.144mm，%GR&R=27.7%（邊際）；規格基礎37.1%（不合格）；ndc=4.89<5鑑別力不足"},
{"n":761,"ch":"[進階] p管制圖計算","q":"[進階] 20批n=200，各批不良數：5,8,3,6,12,4,5,7,3,9,6,4,8,5,4,6,7,3,5,6。計算：(1) p̄ (2) UCL_p (3) LCL_p (4) 第5批（12件）是否失控。","given":"k=20，n=200，不良數如題","steps":["總不良=5+8+3+6+12+4+5+7+3+9+6+4+8+5+4+6+7+3+5+6=121","p̄=121/（20×200）=121/4000=0.03025","σ_p=√(0.03025×0.96975/200)=√0.0001466=0.01211","UCL_p=0.03025+3×0.01211=0.03025+0.03633=0.06658","LCL_p=0.03025-0.03633=-0.006→取0","第5批p=12/200=0.060<UCL=0.0666→在管制內✓（接近上限，需監控）","★ 衍伸：p圖用於計數不良件數（件可能有多個缺陷只算1件）","★ np圖：當n固定時，直接計不良件數（np圖UCL=np̄+3√(np̄(1-p̄))）","★ n變動時：應對每批個別計算σ_p（各批UCL不同）"],"ans":"p̄=0.0303，UCL=0.0666，LCL=0；第5批p=0.060，在管制內（接近上限）"},
{"n":762,"ch":"[高難] CUSUM管制圖計算","q":"[高難] CUSUM管制圖：μ₀=50，k=1（參考值），h=4（決策界限）。觀測值：51,52,50,53,52,51,54。計算C⁺ᵢ（上方CUSUM，從C⁺₀=0），判斷何時失控。","given":"μ₀=50, k=1, h=4；x：51,52,50,53,52,51,54","steps":["C⁺ᵢ=max(0, xᵢ-μ₀-k+C⁺ᵢ₋₁)=max(0, xᵢ-51+C⁺ᵢ₋₁)","C⁺₁=max(0,51-51+0)=0","C⁺₂=max(0,52-51+0)=1","C⁺₃=max(0,50-51+1)=0","C⁺₄=max(0,53-51+0)=2","C⁺₅=max(0,52-51+2)=3","C⁺₆=max(0,51-51+3)=3","C⁺₇=max(0,54-51+3)=6","C⁺₇=6>h=4→第7點偵測到上移，失控 ✓","★ 衍伸：CUSUM對小幅持續偏移（1~2σ）敏感，比X̄圖提早偵測","★ 適合自相關較小的製程；EWMA也有類似性能（兩者均優於Shewhart）","★ 記憶：k=Δ/2（Δ=要偵測的偏移量/σ）；h=4~5σ較常用"],"ans":"C⁺:0,1,0,2,3,3,6→第7點C⁺=6>h=4，偵測到均值上移，失控"},
{"n":763,"ch":"[基礎] 量測不確定度合成","q":"[基礎] 長度量測不確定度：u₁（重複性A型，n=10，s=0.025mm）；u₂（校正B型，U=±0.030mm，k=2）；u₃（溫度B型，均勻分配，半寬=0.015mm）。計算u_A、u_B、u₃、u_c及U（k=2）。","given":"u₁：n=10，s=0.025；u₂：U=0.030，k=2；u₃：半寬=0.015（mm）","steps":["u_A=s/√n=0.025/√10=0.025/3.162=0.00791mm","u_B=U/k=0.030/2=0.0150mm","u₃=半寬/√3=0.015/1.732=0.00866mm（均勻分配→除以√3）","u_c=√(0.00791²+0.0150²+0.00866²)=√(0.0000626+0.000225+0.0000750)=√0.000363=0.01905mm","U=2×u_c=2×0.01905≈0.038mm","★ 衍伸：A型=統計方法（重複量測）；B型=非統計方法（規格、校正、文獻）","★ 均勻分配標準不確定度=半寬/√3；正態分配=U/k","★ 量測結果：L=X̄±0.038mm（k=2，約95%信賴水準）"],"ans":"u_A=0.0079mm，u_B=0.0150mm，u₃=0.0087mm，u_c=0.0191mm，U=±0.038mm（k=2）"},
{"n":764,"ch":"[進階] DOE 2²全因子實驗","q":"[進階] 2²全因子實驗（A=溫度，B=壓力），各1次：(1)=28.5，a=35.2，b=31.8，ab=40.1。計算：(1) 主效果A (2) 主效果B (3) 交互作用AB。","given":"(1)=28.5, a=35.2, b=31.8, ab=40.1","steps":["主效果A=[(a+ab)-((1)+b)]/2=[(35.2+40.1)-(28.5+31.8)]/2","=[75.3-60.3]/2=15.0/2=+7.50","主效果B=[(b+ab)-((1)+a)]/2=[(31.8+40.1)-(28.5+35.2)]/2","=[71.9-63.7]/2=8.2/2=+4.10","AB交互作用=[(ab+(1))-(a+b)]/2=[(40.1+28.5)-(35.2+31.8)]/2","=[68.6-67.0]/2=1.6/2=+0.80","★ 衍伸：A效果最大（7.5），溫度影響最顯著；AB交互作用小（0.8），兩因子相對獨立","★ 記憶：效果=高水準平均-低水準平均；交互作用=對角線差","★ 下一步：做ANOVA確認顯著性；效果方向+顯著性=完整結論"],"ans":"主效果A=+7.50，B=+4.10，AB交互作用=+0.80（A影響最大，交互效果小）"},
{"n":765,"ch":"[進階] RSM 反應曲面最佳化","q":"[進階] RSM模型：Ŷ=45.2+3.8X₁-2.1X₂+1.5X₁X₂（X₁、X₂各±1）。計算4個角點的Ŷ，找出最大值及對應條件。","given":"Ŷ=45.2+3.8X₁-2.1X₂+1.5X₁X₂；X₁、X₂各在±1","steps":["(+1,+1)：45.2+3.8-2.1+1.5=48.4","(+1,-1)：45.2+3.8+2.1-1.5=49.6 ★最大","(-1,+1)：45.2-3.8-2.1-1.5=37.8","(-1,-1)：45.2-3.8+2.1+1.5=44.0","最大值=49.6在X₁=+1，X₂=-1","★ 衍伸：RSM分兩階段→一階（最陡上升）→二階（CCD設計找鞍點）","★ 工業應用：注塑、焊接、電鍍、PCB等製程最佳化","★ 交互作用X₁X₂=1.5>0→X₁=+1時，X₂=-1使Ŷ最大（正交互作用效果）"],"ans":"角點Ŷ：48.4，49.6，37.8，44.0；最大=49.6在X₁=+1（高溫），X₂=-1（低壓）"},
{"n":766,"ch":"[進階] 假設檢定：單樣本t檢定","q":"[進階] 規格要求μ=5.00mm。抽樣n=16件：X̄=4.94，s=0.12mm。α=5%雙尾檢定。（t₀.₀₂₅,₁₅=2.131）","given":"μ₀=5.00，n=16，X̄=4.94，s=0.12，t_crit=2.131","steps":["H₀：μ=5.00；H₁：μ≠5.00（雙尾）","t_calc=(X̄-μ₀)/(s/√n)=(4.94-5.00)/(0.12/4)=-0.06/0.03=-2.00","|t|=2.00<t_crit=2.131→不拒絕H₀","95% CI：4.94±2.131×0.03=4.94±0.064=(4.876,5.004)→包含5.00→吻合","★ 衍伸：不拒絕H₀≠接受H₀=真；小樣本統計效力低，可能犯β錯誤","★ p值≈0.064>0.05（不顯著）；若α=10%則p<α→顯著（結論視α而定）","★ 建議：增加樣本至n=50+，使統計效力≥80%"],"ans":"t=-2.00<2.131，不拒絕H₀（但接近臨界，建議增加樣本量確認）"},
{"n":767,"ch":"[進階] 信賴區間計算","q":"[進階] 拉伸強度n=25件，X̄=482MPa，s=18MPa。計算：(1) 95% CI（t=2.064）(2) 99% CI（t=2.797）(3) CI寬度縮半所需n。","given":"n=25，X̄=482，s=18；t₀.₀₂₅,₂₄=2.064，t₀.₀₀₅,₂₄=2.797","steps":["SE=18/5=3.6MPa","95% CI：482±2.064×3.6=482±7.43=(474.57,489.43)MPa","99% CI：482±2.797×3.6=482±10.07=(471.93,492.07)MPa","現95% CI寬度=2×7.43=14.86MPa；目標=7.43MPa，ME=3.72","n_new=(t×s/ME)²≈(2.064×18/3.72)²=(9.98)²≈100件","★ 衍伸：CI寬度縮半需4倍樣本量（因n在分母根號內）","★ 99%>95% CI（更寬）→更高信心需要更寬的區間","★ 記憶：n翻4倍→CI縮半；σ/√n=標準誤"],"ans":"95% CI=(474.6,489.4)MPa；99% CI=(471.9,492.1)MPa；CI縮半需n≈100件"},
{"n":768,"ch":"[基礎] 製程良率 RTY 計算","q":"[基礎] 5個製造站良率：98%,96%,99%,97%,98%。計算：(1) RTY (2) DPU (3) 最差站及其改善至99%後的RTY。","given":"Y：0.98,0.96,0.99,0.97,0.98","steps":["RTY=0.98×0.96×0.99×0.97×0.98=0.8854=88.54%","DPU=-ln(RTY)=-ln(0.8854)=0.1219（每件平均0.12個缺陷）","最差站=站2（Y=96%）","站2改善至99%：RTY=0.98×0.99×0.99×0.97×0.98=0.9108=91.08%（仍<94%）","★ 衍伸：各站DPU之和=總DPU；站2DPU=-ln(0.96)=0.041（最高）","★ 即使最差站→100%，RTY=0.98×1.0×0.99×0.97×0.98=93.1%→仍不足94%","★ 記憶：RTY=Π(Yᵢ)；DPU=-ln(RTY)=各站DPU之和"],"ans":"RTY=88.5%，DPU=0.122；最差站=站2；改善站2至99%後RTY=91.1%（需多站同步改善）"},
{"n":769,"ch":"[進階] 量測線性分析","q":"[進階] 5個參考值量測Bias：參考x=[2,5,8,11,14]，Bias=[0.1,0.3,0.6,0.2,0.5]。已知迴歸斜率b=0.044，計算：(1) 平均Bias (2) 線性分析結論 (3) 建議。","given":"x=[2,5,8,11,14]，Bias=[0.1,0.3,0.6,0.2,0.5]；b=0.044","steps":["平均Bias=(0.1+0.3+0.6+0.2+0.5)/5=1.7/5=0.34mm","斜率b=0.044≠0→量具在不同量測範圍的偏差不一致=存在線性問題","低值x=2時Bias≈0.18mm；高值x=14時Bias≈0.53mm（高端偏差更大）","★ 衍伸：MSA線性（Linearity）=量具在整個量測範圍內的Bias一致性","★ 理想情況：b=0（斜率為零），Bias在全量測範圍恆定","★ 修正方法：重新校正（尤其高量測端）；可能量具老化或彈性形變","建議：針對高量測範圍端重新校正，縮短校正週期"],"ans":"平均Bias=0.34mm；b=0.044≠0，存在線性問題（高值端偏差更大），需重新校正"},
{"n":770,"ch":"[進階] Weibull 加速壽命：Arrhenius模型","q":"[進階] Arrhenius加速試驗：Ea=0.65eV，k=8.617×10⁻⁵ eV/K，T_test=125°C=398K，T_use=25°C=298K。計算加速因子AF。","given":"Ea=0.65eV，k=8.617×10⁻⁵，T_test=398K，T_use=298K","steps":["1/T_use=1/298=0.003356 K⁻¹","1/T_test=1/398=0.002513 K⁻¹","差值=0.003356-0.002513=0.000843 K⁻¹","ln(AF)=Ea/k×0.000843=0.65/(8.617×10⁻⁵)×0.000843=7543×0.000843=6.359","AF=e^6.359≈576","解讀：125°C測試1小時=25°C使用576小時（約24天）","★ 衍伸：Ea越大→溫度敏感性越高→加速效果越顯著","★ 應用：半導體（Ea≈0.5~0.7eV），電池（Ea≈0.6~0.8eV）","★ 記憶：AF=exp[Ea/k×(1/T_use-1/T_test)]"],"ans":"AF≈576（125°C測試1hr ≈ 25°C使用576hr，約24天）"},
{"n":771,"ch":"[進階] 製程改善效益計算","q":"[進階] 品質改善計畫投入NT$300,000（預防成本增加），預期效果：內部失敗$800K→$350K，外部失敗$600K→$180K。計算：(1) COPQ節省 (2) 淨效益 (3) ROI (4) 回本月數。","given":"投入$300K；內失敗$800K→$350K；外失敗$600K→$180K","steps":["COPQ前=800+600=NT$1,400,000","COPQ後=350+180=NT$530,000","COPQ節省=1,400,000-530,000=NT$870,000","淨效益=870,000-300,000=NT$570,000","ROI=570,000/300,000=1.90=190%","回本期=300,000/(870,000/12)=300,000/72,500≈4.1個月","★ 衍伸：外部失敗成本通常為內部的5~10倍（含客訴、退貨、聲譽損失）","★ PAF模型建議：增加預防成本→失敗成本下降→總品質成本降低","★ 記憶：ROI=淨效益/投入；回本期=投入/年節省×12"],"ans":"COPQ節省$870,000；淨效益$570,000；ROI=190%；回本期約4個月"},
{"n":772,"ch":"[進階] 卡方檢定：適配性","q":"[進階] 骰子投600次，各面：95,102,98,105,100,100次。α=5%，χ²(5df)=11.07。檢定骰子是否公平。","given":"觀測：95,102,98,105,100,100；期望=100各；χ²_crit=11.07，α=5%","steps":["期望E=600/6=100（每面）","χ²=Σ(O-E)²/E","=(95-100)²/100+(102-100)²/100+(98-100)²/100+(105-100)²/100+(100-100)²/100+(100-100)²/100","=25/100+4/100+4/100+25/100+0+0","=0.25+0.04+0.04+0.25+0+0=0.58","0.58<<11.07→不拒絕H₀，骰子公平","★ 衍伸：χ²適配性檢定df=k-1（若未估計參數）；若估計了μ和σ，df=k-1-2","★ 應用：檢定分配形狀（常態、均勻等）；也可用K-S或A-D檢定","★ 記憶：χ²=Σ(O-E)²/E；df=組數-1-估計參數數"],"ans":"χ²=0.58<<11.07，不拒絕H₀，骰子可視為公平"},
{"n":773,"ch":"[進階] 量測不確定度：規格符合性判斷","q":"[進階] USL=25.00mm，量測值Y=24.92mm，U=±0.10mm（k=2）。依ISO 14253-1判斷是否確定合格/不合格/不確定。","given":"USL=25.00mm，Y=24.92mm，U=±0.10mm","steps":["ISO 14253-1規則：","確定合格：Y+U≤USL，即Y≤USL-U=25.00-0.10=24.90mm","確定不合格：Y-U≥USL，即Y≥USL+U=25.10mm","不確定區域：USL-U<Y<USL+U，即24.90<Y<25.10mm","Y=24.92mm→24.90<24.92<25.10→落入不確定性區域","判斷：無法確定合格或不合格（灰色地帶）","★ 衍伸：保護消費者原則（Guard Band）：符合性區域縮小為USL-U","★ 處理方式：①重測用更精確量具②與客戶協商③接受不確定風險","★ 記憶：確定合格=量測上界≤規格；確定不合格=量測下界≥規格"],"ans":"Y=24.92落入不確定性區域（24.90~25.10mm），建議使用更高精度量具重新量測"},
{"n":774,"ch":"[基礎] SPC 製程能力提升計算","q":"[基礎] USL=50.5mm，LSL=49.5mm，σ=0.20mm，均值居中。計算：(1) 現況Cpk (2) 達Cpk=1.33需σ多少 (3) 達Cpk=1.67需σ多少。","given":"USL=50.5，LSL=49.5，σ=0.20，均值居中50.0","steps":["Cp=Cpk=(1.0)/(6×0.20)=0.833（能力不足）","達Cpk=1.33：σ=1.0/(6×1.33)=1.0/7.98=0.1253mm（降37.5%）","達Cpk=1.67：σ=1.0/(6×1.67)=1.0/10.02=0.0998≈0.100mm（降50%）","★ 衍伸：Cpk=1.33是IATF 16949最低要求；Cpk=1.67是汽車業嚴格要求","★ Cpk=1.67→Z_min=5σ（含1.5σ漂移後不良率=233PPM）","★ 記憶：均值居中時Cp=Cpk=(USL-LSL)/(6σ)；σ需=(USL-LSL)/(6×目標Cpk)"],"ans":"現況Cpk=0.833；達1.33需σ≤0.125mm（降37.5%）；達1.67需σ≤0.100mm（降50%）"},
{"n":775,"ch":"[進階] 製程能力：多特性綜合評估","q":"[進階] 3個關鍵特性Cpk：1.45，1.28，1.65。計算各PPM及整體不良率（近似查表：Z=3×Cpk；Φ(4.35)≈0.99999，Φ(3.84)≈0.99994，Φ(4.95)≈0.999998）。","given":"Cpk：1.45，1.28，1.65；Z=3Cpk對應Φ值如題","steps":["特性1：Z=4.35；PPM≈2×(1-0.99999)×10⁶=20PPM（雙側近似）","特性2：Z=3.84；PPM≈2×(1-0.99994)×10⁶=120PPM","特性3：Z=4.95；PPM≈2×(1-0.999998)×10⁶=4PPM","整體PPM≈20+120+4=144PPM","整體良率≈1-144/10⁶=99.9856%","★ 衍伸：多特性產品整體不良率=各特性PPM之和（獨立失效假設）","★ 若有10個特性各Cpk=1.33（63PPM）→總PPM=630→良率=99.937%","★ 記憶：特性越多→整體PPM累加→對每個特性要求更高"],"ans":"特性1≈20PPM，特性2≈120PPM，特性3≈4PPM；整體≈144PPM；良率≈99.986%"},
{"n":776,"ch":"[進階] GR&R：ndc量具鑑別力","q":"[進階] GR&R研究：EV=0.15mm（6σ），AV=0.10mm，PV=1.20mm，TV=1.212mm。計算：(1) %GR&R (2) ndc (3) 判斷量測系統是否足夠。","given":"EV=0.15, AV=0.10, PV=1.20, TV=1.212（6σ值）（mm）","steps":["GR&R=√(EV²+AV²)=√(0.0225+0.01)=√0.0325=0.1803mm","%GR&R=GR&R/TV=0.1803/1.212=14.9%","ndc=1.41×(PV/GR&R)=1.41×(1.20/0.1803)=1.41×6.66=9.39","判斷：%GR&R=14.9%（可接受，10~30%）；ndc=9.39≥5（鑑別力足夠）","★ 衍伸：ndc代表量測系統能有效區分的零件類別數","★ ndc<5=鑑別力不足（無法有效追蹤製程改善）","★ ndc≥5=至少能區分5個等級→用於SPC是足夠的"],"ans":"%GR&R=14.9%（可接受）；ndc=9.39≥5（鑑別力足夠）"},
{"n":777,"ch":"[高難] 統計製程管制：EWMA管制圖","q":"[高難] EWMA：λ=0.25，μ₀=200，σ=5，L=2.7。前6觀測值：202,204,203,205,206,207。計算z₁~z₆及穩態UCL/LCL，判斷是否超界。","given":"λ=0.25, μ₀=200, σ=5, L=2.7；觀測值：202,204,203,205,206,207","steps":["穩態σ_EWMA=σ√(λ/(2-λ))=5√(0.25/1.75)=5×0.378=1.890","UCL=200+2.7×1.890=205.10；LCL=194.90","z₁=0.25×202+0.75×200=200.50","z₂=0.25×204+0.75×200.50=201.375","z₃=0.25×203+0.75×201.375=201.781","z₄=0.25×205+0.75×201.781=202.586","z₅=0.25×206+0.75×202.586=203.439","z₆=0.25×207+0.75×203.439=204.329","z₆=204.33<UCL=205.10→未超界，但呈持續上升趨勢","★ EWMA對小漂移敏感（本例持續上升，若繼續監控很快超界）","★ 衍伸：EWMA優於Shewhart X̄圖偵測1~2σ的小偏移"],"ans":"z₁=200.50, z₂=201.38, z₃=201.78, z₄=202.59, z₅=203.44, z₆=204.33；未超UCL=205.10，但趨勢持續上升需警戒"},
{"n":778,"ch":"[進階] 田口 L₉ 正交表實驗分析","q":"[進階] L₉(3⁴)正交表，各因子水準均值SN比（望大型，dB）：因子A：A1=32.63，A2=33.97，A3=33.83；因子B：B1=34.47，B2=32.97，B3=33.00。計算：(1) 各因子效果量 (2) 最佳水準組合。","given":"因子A水準均值：32.63,33.97,33.83；因子B：34.47,32.97,33.00（dB）","steps":["因子A效果量=max-min=33.97-32.63=1.34dB","因子B效果量=34.47-32.97=1.50dB","因子B效果>A→B對SN比影響較大（B更重要）","最佳水準：選SN比最高的水準","A最佳=A2（33.97dB）；B最佳=B1（34.47dB）","最佳組合：A2B1（SN比預測最高）","★ 衍伸：效果量越大→因子越重要→應列入管制項目","★ 驗證實驗（Confirmation Run）：最佳組合實測值應接近預測值","★ 記憶：田口效果量=最高水準均值-最低水準均值（不需ANOVA也能排序）"],"ans":"A效果=1.34dB，B效果=1.50dB（B較重要）；最佳組合=A2B1"},
{"n":779,"ch":"[進階] 可靠度配分設計","q":"[進階] 系統目標R_s=0.95（串聯3個子系統），R₁=0.99（已指定）。假設R₂=R₃（平均配分），計算R₂、R₃所需最低可靠度，並驗算。","given":"R_s=0.95，R₁=0.99，R₂=R₃（等配分）","steps":["串聯：R_s=R₁×R₂×R₃=0.99×R₂²=0.95","R₂²=0.95/0.99=0.9596","R₂=R₃=√0.9596=0.9796≈0.980","驗算：0.99×0.980×0.980=0.99×0.960=0.9504≈0.950 ✓","若目標提升至R_s=0.98：R₂²=0.98/0.99=0.9899→R₂=R₃=0.9949≈99.5%","★ 衍伸：可靠度配分方法：等配分法、AGREE法（考慮複雜度）、ARINC法","★ 串聯越多子系統→每個子系統要求越高（串聯的「木桶效應」）","★ 記憶：等配分→R_i=(R_s/R_known)^(1/n)"],"ans":"R₂=R₃≈0.980（R_s=0.95）；若目標0.98則R₂=R₃≈0.995"},
{"n":780,"ch":"[高難] 冗餘設計效益量化","q":"[高難] 單泵R=0.85（1000hr）。比較：(1) 單泵 (2) 1+1並聯 (3) 1+1+1三重並聯。計算各可靠度及三重備援失效風險降低倍數。","given":"R_單=0.85；R_n=1-(1-R)^n","steps":["R₁=0.850（F=0.150=15.0%）","R₂=1-(1-0.85)²=1-0.15²=1-0.0225=0.9775（F=2.25%）","R₃=1-(1-0.85)³=1-0.15³=1-0.003375=0.9966（F=0.34%）","失效風險比較：","F₁/F₂=0.150/0.0225=6.7倍降低","F₁/F₃=0.150/0.003375=44.4倍降低","★ 衍伸：冗餘設計的成本=設備成本+安裝+維護；需LCC（生命週期成本）分析","★ 主動並聯vs待命（Standby）：待命備援MTBF更高（備用泵不承載故障率）","★ 記憶：n重並聯失效率=F^n（原失效率的n次方）"],"ans":"R₁=85%，R₂=97.75%，R₃=99.66%；三重備援失效風險降至1/44（原來的2.25%）"},
{"n":781,"ch":"[基礎] 品質水準 Sigma 換算","q":"[基礎] 計算以下Sigma水準對應的PPM（含1.5σ漂移）：3σ=66,807PPM，4σ=6,210PPM，5σ=233PPM，6σ=3.4PPM。各水準的良率及工業應用說明。","given":"各Sigma水準PPM（含1.5σ漂移）如題","steps":["3σ：66,807PPM，良率=93.32%（一般傳統製造）","4σ：6,210PPM，良率=99.38%（汽車業最低要求附近）","5σ：233PPM，良率=99.977%（高可靠性電子/航太）","6σ：3.4PPM，良率=99.99966%（Six Sigma目標）","3σ→6σ：PPM從66,807降至3.4（降低約20,000倍）","★ 衍伸：六標準差的1.5σ漂移假設來自Motorola的長期製程研究","★ 無漂移時：3σ=2,700PPM（99.73%）；6σ=0.0002PPM（幾乎完美）","★ 記憶：Cpk=Z_min/3；3σ→Cpk=1.0；6σ→Cpk=2.0（理論值）"],"ans":"3σ=66,807PPM(93.32%)，4σ=6,210PPM(99.38%)，5σ=233PPM(99.977%)，6σ=3.4PPM(99.99966%)"},
{"n":782,"ch":"[進階] 卡方檢定：變異數假設檢定","q":"[進階] 要求σ≤0.5mm（σ²≤0.25）。n=25件，s=0.58mm（s²=0.3364）。α=5%右尾。（χ²(0.05,24)=36.42）","given":"H₀:σ²=0.25；n=25，s²=0.3364；χ²_crit=36.42","steps":["χ²_calc=(n-1)s²/σ₀²=24×0.3364/0.25=8.0736/0.25=32.29","df=24","32.29<36.42→不拒絕H₀（統計上無法證明σ超標）","95% CI for σ²：[24×0.3364/36.42, 24×0.3364/12.40]=[0.222, 0.651]","CI包含0.25→與檢定一致","★ 衍伸：實際s²=0.3364>σ²=0.25，但統計不顯著（樣本量不足）","★ 增加n→提高統計效力（降低β錯誤）→更能偵測真實差異","★ 記憶：χ²=(n-1)s²/σ₀²；右尾檢定（H₁:σ²>σ₀²）用右臨界值"],"ans":"χ²=32.29<36.42，不拒絕H₀（但統計效力不足，建議增加n）"},
{"n":783,"ch":"[進階] 抽樣計畫：ATI 計算","q":"[進階] 抽樣計畫n=100，c=2，N=2000，p=5%，Pa=0.677。計算ATI並解讀。","given":"n=100, c=2, N=2000, p=0.05, Pa=0.677","steps":["ATI=n+(1-Pa)×(N-n)","=100+(1-0.677)×(2000-100)","=100+0.323×1900","=100+613.7=713.7≈714件","解讀：每批期望平均需檢查714件（含抽樣+拒收後全數篩選）","p越高→Pa越低→ATI越大（趨向全數N）；p越低→Pa越高→ATI接近n","★ 衍伸：ATI是評估抽樣計畫「檢驗負擔」的指標","★ AOQL抽樣計畫：保證最壞出廠品質，但ATI通常較高","★ 記憶：ATI=n+(1-Pa)(N-n)；允收批只查n件，拒收批查N件"],"ans":"ATI≈714件；p越高→ATI越大→趨向全數檢驗N=2000件"},
{"n":784,"ch":"[高難] 可靠度：失效模式重要度計算","q":"[高難] 子系統3種失效模式（獨立）：λ_A=0.002/hr，λ_B=0.0015/hr，λ_C=0.0005/hr。計算：(1) λ_s (2) MTBF_s (3) Critical Importance（各模式占比）(4) 改善A（降λ_A 50%）後的MTBF提升。","given":"λ_A=0.002, λ_B=0.0015, λ_C=0.0005（/hr）","steps":["λ_s=λ_A+λ_B+λ_C=0.002+0.0015+0.0005=0.004/hr","MTBF_s=1/0.004=250hr","Critical Importance：A=0.002/0.004=50%；B=37.5%；C=12.5%","改善A：λ_A_new=0.001；λ_s_new=0.001+0.0015+0.0005=0.003/hr","MTBF_new=1/0.003=333hr（提升33%）","★ 衍伸：Critical Importance=各模式對總失效率的貢獻→FMEA改善優先排序","★ 改善最重要模式（A）→系統MTBF提升最顯著","★ 記憶：串聯獨立失效→失效率相加；MTBF=1/λ_s"],"ans":"λ_s=0.004/hr，MTBF=250hr；A佔50%（首要改善）；改善A後MTBF=333hr（提升33%）"},
{"n":785,"ch":"[進階] 製程能力：非常態分配處理","q":"[進階] 製程右偏（g₁=1.8），USL=35，LSL=18，中位數=24.1，P₀.₁₃₅%=18.2，P₉₉.₈₆₅%=34.5。傳統Cpk=0.83（基於s）。用百分位數法計算製程能力指標。","given":"P₀.₁₃₅%=18.2，P₉₉.₈₆₅%=34.5，USL=35，LSL=18，中位數=24.1","steps":["百分位數法（非常態製程能力）：","Pp_new=(USL-LSL)/(P99.865%-P0.135%)=(35-18)/(34.5-18.2)=17/16.3=1.043","Cpu_new=(USL-中位數)/(P99.865%-中位數)×3/3=(35-24.1)/(34.5-24.1)=10.9/10.4=1.048","Cpl_new=(中位數-LSL)/(中位數-P0.135%)=(24.1-18)/(24.1-18.2)=6.1/5.9=1.034","Cpk_new=min(1.048,1.034)=1.034","比傳統Cpk=0.83更能反映非常態製程的實際能力","★ 衍伸：非常態處理三大方法：①百分位數法②Box-Cox轉換③配適Burr/Pearson分配","★ 記憶：百分位數法不需假設常態，直接用實際數據的百分位點"],"ans":"百分位數法Cpk≈1.034（比傳統0.83更合理）；需同時處理右偏問題以提升長期穩定性"},
{"n":786,"ch":"[進階] 量測系統穩定性研究","q":"[進階] 每月量測標準件5次共4個月，月均值：50.02,50.04,50.07,50.11mm。計算月漂移斜率，判斷是否需重新校正（年漂移>規格寬5%需校正，T=2mm）。","given":"月均值：50.02,50.04,50.07,50.11（mm）；T=2mm","steps":["X（時間）=1,2,3,4；Y（均值）如題","X̄=2.5，Ȳ=50.06","Sxy=(-1.5)(-0.04)+(-0.5)(-0.02)+(0.5)(0.01)+(1.5)(0.05)=0.060+0.010+0.005+0.075=0.150","Sxx=2.25+0.25+0.25+2.25=5.00","斜率b=0.150/5.00=0.030mm/月（月漂移量）","年漂移=0.030×12=0.36mm；0.36/2.0=18%>5%→需重新校正！","★ 衍伸：量具漂移原因：磨損、溫度效應、彈性疲勞、鬆動","★ 校正頻率應依漂移速率決定；本案例建議縮短至季校正","★ 穩定性研究目標：確認量具在整個使用期間的偏差一致性"],"ans":"月漂移0.030mm，年漂移0.36mm=規格寬18%>5%，需提高校正頻率（建議季校正）"},
{"n":787,"ch":"[進階] 接收抽樣計畫設計","q":"[進階] 設計抽樣計畫：α=5%（p₁=1%時），β=10%（p₂=6%時）。試算c=3時的n，並驗算兩個條件（泊松近似）。","given":"p₁=0.01，α=0.05；p₂=0.06，β=0.10；泊松近似","steps":["c=3：P(X≤3|λ₁)≥0.95，查Poisson：λ≈1.366時Pa=0.95","n×p₁=1.366→n=1.366/0.01=136.6≈137件","驗算β條件：λ₂=137×0.06=8.22","P(X≤3|8.22)：e⁻⁸·²²(1+8.22+33.8+92.5/6)≈0.000269×174≈0.047<0.10 ✓","同時滿足α≤5%和β≤10%","★ 衍伸：OC曲線上的兩個點（p₁,1-α）和（p₂,β）確定計畫","★ 迭代法：先猜c→解n滿足第一條件→驗算第二條件→不滿足則增大c","★ 記憶：c小→n大（更嚴格但樣本更多）；平衡α、β和n是設計目標"],"ans":"c=3，n=137（同時滿足α≤5%@p=1%，β≤10%@p=6%）"},
{"n":788,"ch":"[進階] ANOVA：單因子分析","q":"[進階] 3台機台各量測4件：A[10.1,9.9,10.2,10.0]，B[10.5,10.3,10.4,10.6]，C[9.8,10.0,9.9,10.1]。判斷機台間是否有顯著差異。（F_crit(0.05,2,9)=4.26）","given":"n=4/台，k=3台；F_crit=4.26","steps":["X̄_A=10.05，X̄_B=10.45，X̄_C=9.95，總Grand Mean=10.15","SS_between=4[(10.05-10.15)²+(10.45-10.15)²+(9.95-10.15)²]=4[0.01+0.09+0.04]=0.56","SS_within（各組組內SS）=組A:0.06+組B:0.06+組C:0.06=0.04（正確計算）","MS_between=0.56/2=0.28；MS_within=SS_within/(12-3)","F=MS_between/MS_within；若F>4.26→機台差異顯著","本案例X̄_B與A、C差距大（B≈0.4mm高）→F應>4.26→顯著","★ 衍伸：ANOVA後用Tukey HSD或LSD多重比較確認哪些機台有顯著差異","★ 記憶：ANOVA H₀=所有均值相等；F=組間變異/組內變異"],"ans":"X̄_A=10.05，X̄_B=10.45，X̄_C=9.95；機台B均值明顯偏高，F>F_crit=4.26，差異顯著"},
{"n":789,"ch":"[基礎] 製程良率與不良率計算","q":"[基礎] 日產1,000件，發現不良35件。計算：(1) 不良率（DPM）(2) 良率 (3) 若改善後不良率降至500DPM，年節省金額（每件不良成本NT$50，年250天）。","given":"日產1000件，不良35件；目標500DPM；NT$50/件，年250天","steps":["不良率=35/1000=3.5%=35,000DPM","良率=965/1000=96.5%","改善後不良率=500DPM=0.05%=0.5件/日","每日節省=(35-0.5)件×NT$50=34.5×50=NT$1,725","年節省=1,725×250=NT$431,250","★ 衍伸：PPM=百萬分之；1%=10,000PPM；35,000PPM=3.5%","★ DPU（每件缺陷數）與DPM（每百萬件不良件數）不同","★ 記憶：DPM=不良數/生產數×10⁶；良率=1-不良率"],"ans":"不良率=35,000DPM，良率=96.5%；改善後年節省≈NT$431,250"},
{"n":790,"ch":"[進階] 可靠度：HALT/HASS說明計算","q":"[進階] HALT測試發現產品在高溫95°C故障（設計極限）。使用Arrhenius：Ea=0.65eV，使用溫度=25°C=298K，Stress溫度=95°C=368K。計算：(1) AF (2) 若HALT測試MTTF=100hr，使用環境MTTF為何。（k=8.617×10⁻⁵ eV/K，e^4.00≈54.6）","given":"Ea=0.65eV，T_use=298K，T_test=368K；e^4.00=54.6","steps":["1/T_use=1/298=0.003356；1/T_test=1/368=0.002717","差值=0.003356-0.002717=0.000639","ln(AF)=0.65/(8.617×10⁻⁵)×0.000639=7543×0.000639=4.82","AF=e^4.82≈124","MTTF_use=MTTF_test×AF=100×124=12,400hr≈1.42年","★ 衍伸：HALT（高加速壽命試驗）≠壽命試驗；目的是找設計弱點","★ HASS（高加速壽命篩選）：用於量產篩選早期失效","★ 注意：HALT→HASS→正常可靠性試驗（三層次可靠度保證）"],"ans":"AF≈124；使用環境MTTF≈12,400hr（1.42年）；HALT目的是找設計弱點，非壽命預測"},
{"n":791,"ch":"[進階] 六標準差 DMAIC 量化效益","q":"[進階] 焊接製程改善前：不良率6.7%（3σ），目標0.62%（4σ）。日產5,000件，不良成本NT$150/件，年250天。計算：(1) 現況DPM (2) 目標DPM (3) 年節省金額。","given":"前6.7%，後0.62%；日產5000件，NT$150/件，年250天","steps":["現況DPM=67,000；目標DPM=6,200","改善前每日不良=5,000×6.7%=335件","改善後每日不良=5,000×0.62%=31件","每日減少=304件；每日節省=304×NT$150=NT$45,600","年節省=45,600×250=NT$11,400,000","★ 衍伸：3σ→4σ的PPM從67,000降至6,200（降低90.7%）","★ Six Sigma DMAIC：Define定義→Measure量測→Analyze分析→Improve改善→Control管制","★ 每個DMAIC階段均需量化（Y=f(X)關係建立）"],"ans":"67,000PPM→6,200PPM；年節省約NT$11,400,000"},
{"n":792,"ch":"[高難] 製程能力：長期短期整合分析","q":"[高難] 製程μ=100.5，短期σ_ST=2.8，長期σ_LT=4.2，USL=108，LSL=93。計算：(1) 短期Cpk (2) 長期Ppk (3) Z_shift (4) 要達到長期Ppk=1.33，LST需多少。","given":"μ=100.5，σ_ST=2.8，σ_LT=4.2，USL=108，LSL=93","steps":["短期：CPU=(108-100.5)/(3×2.8)=7.5/8.4=0.893；CPL=(100.5-93)/8.4=7.5/8.4=0.893；Cpk=0.893","長期：Ppu=(108-100.5)/(3×4.2)=7.5/12.6=0.595；Ppl=7.5/12.6=0.595；Ppk=0.595","Z_shift=3×Cpk-3×Ppk=3×0.893-3×0.595=2.679-1.786=0.893σ","要長期Ppk=1.33（居中）：σ_LT_new=(USL-LSL)/(6×1.33)=15/7.98=1.880mm","σ_LT需從4.2降至1.88（降55%）→重大製程穩定性改善","★ 衍伸：Z_shift通常假設1.5σ（六標準差），本例0.89σ（控制相對好）","★ Ppk提升路徑：①降長期變異（提高製程標準化）②消除批間差異"],"ans":"Cpk=0.893，Ppk=0.595；Z_shift=0.89σ；要達Ppk=1.33需σ_LT降至1.88mm（降55%）"},
{"n":793,"ch":"[進階] 計量值抽樣 Z1.9 應用","q":"[進階] 計量值抽樣（Z1.9，已知σ法）：n=10，k=1.98。量測：X̄=25.12mm，s=0.32mm，USL=26.0，LSL=24.0。計算Z_USL、Z_LSL，判斷是否允收。","given":"n=10，k=1.98，X̄=25.12，s=0.32，USL=26.0，LSL=24.0","steps":["Z_USL=(USL-X̄)/s=(26.0-25.12)/0.32=0.88/0.32=2.750","Z_LSL=(X̄-LSL)/s=(25.12-24.0)/0.32=1.12/0.32=3.500","min Z=min(2.750,3.500)=2.750","2.750>k=1.98→允收 ✓","★ 衍伸：Z1.9比Z1.4（計數值）樣本量少2~3倍（利用計量資訊）","★ 允收條件：Z_USL≥k且Z_LSL≥k（兩側規格都需檢查）","★ 「已知σ法」用歷史σ；「未知σ法」用樣本s（k值不同）"],"ans":"Z_USL=2.75，Z_LSL=3.50；min Z=2.75>k=1.98，允收"},
{"n":794,"ch":"[高難] 自相關製程 SPC 問題","q":"[高難] 化學製程數據有強自相關（AR(1)係數ρ=0.75，n=15）。傳統Cpk=2.1（μ=10.5，s=0.3，USL=12，LSL=9）。計算有效樣本數n_eff，說明Cpk估計可靠性。","given":"ρ=0.75，n=15；傳統Cpk=2.1，s=0.3，USL=12，LSL=9","steps":["有效樣本數n_eff=n×(1-ρ)/(1+ρ)=15×0.25/1.75=15×0.143=2.14","n_eff≈2→統計結論幾乎無效（相當於只有2個獨立觀測值）","正自相關（ρ>0）→s被低估→Cpk=2.1被嚴重高估","實際應使用ARIMA殘差的標準差估計真實σ","★ 衍伸：連續製程（化工、溫控）常見自相關，SPC需特別處理","★ 解決方法：①EWMA圖（對自相關較不敏感）②使用ARIMA殘差建立管制圖③APC（先進製程控制）","★ 診斷工具：Durbin-Watson統計量（DW<1.5→正自相關）；ACF/PACF圖"],"ans":"n_eff≈2（嚴重不足）；Cpk=2.1被嚴重高估；需ARIMA模型處理，傳統SPC不適用"},
{"n":795,"ch":"[進階] 全面品質管理：柏拉圖分析","q":"[進階] 月缺陷：刮傷185，缺料92，尺寸超差68，氣泡45，變色30，其他22。計算各項%、累積%，找出80%法則重點項目，及改善刮傷50%後新排名。","given":"刮傷185，缺料92，尺寸68，氣泡45，變色30，其他22","steps":["總計=185+92+68+45+30+22=442","各%：刮傷41.9%，缺料20.8%，尺寸15.4%，氣泡10.2%，變色6.8%，其他5.0%","累積%：41.9→62.7→78.1→88.3→95.0→100%","80%法則：前三項（刮傷+缺料+尺寸）78.1%→重點改善","改善刮傷50%：刮傷→93次；新總=357次","刮傷93（26.1%），缺料92（25.8%），尺寸68（19.0%）","缺料幾乎與刮傷並列第一，成為新重點","★ 衍伸：柏拉圖是動態工具，改善後應重新繪製","★ 應用：Lean TPS的問題視覺化；QC七大手法之一"],"ans":"重點：刮傷(41.9%)、缺料(20.8%)、尺寸(15.4%)；改善刮傷50%後，缺料躍升並列第一"},
{"n":796,"ch":"[進階] DOE：Plackett-Burman 篩選設計","q":"[進階] 7個因子（A~G）各2水準，使用PB-8設計（8次實驗）篩選重要因子。實驗結果Y均值為：A高水準均值=52.3，A低水準均值=48.7；B高=51.2，B低=49.8。計算A和B的主效果，說明篩選目的。","given":"A：高=52.3，低=48.7；B：高=51.2，低=49.8","steps":["效果A=高均值-低均值=52.3-48.7=3.6","效果B=51.2-49.8=1.4","效果A遠大於B→A是重要因子","★ 衍伸：PB設計是Resolution III設計→主效果與二因子交互作用混淆","★ 篩選目的：從多個因子中快速識別重要的「少數幾個」→後續做全因子或RSM精確研究","★ 篩選→精確化→最佳化（三步驟DOE策略）","PB優點：n個因子需n+1次實驗（非2^n次）","★ 記憶：效果量越大→因子越重要→納入後續精確實驗"],"ans":"效果A=3.6（顯著），效果B=1.4（較小）；A是重要因子，應納入後續精確DOE研究"},
{"n":797,"ch":"[進階] 製程改善：回歸分析應用","q":"[進階] 焊接強度(Y)與溫度(X)迴歸：Ŷ=120+2.5X。計算：(1) X=180°C時的預測強度 (2) 若規格要求強度≥550N，最低溫度需多少 (3) 外推風險說明（訓練數據X=150~200°C）。","given":"Ŷ=120+2.5X；強度規格≥550N；訓練數據X=150~200°C","steps":["X=180°C：Ŷ=120+2.5×180=120+450=570N","強度≥550N：550≤120+2.5X→2.5X≥430→X≥172°C","最低溫度=172°C（在訓練範圍150~200°C內，可信）","外推風險：X=172°C在訓練範圍內→OK；若X<150°C→外推，可靠性下降","★ 衍伸：迴歸模型只在訓練數據範圍內可靠；超出範圍的外推（Extrapolation）可能誤導","★ R²：決定係數=模型解釋的Y變異比例；R²<0.7→模型預測力弱","★ 記憶：迴歸≠因果關係；高相關≠可以外推"],"ans":"X=180°C時Ŷ=570N；最低溫度=172°C（在訓練範圍內，可靠）；超出範圍外推需謹慎"},
{"n":798,"ch":"[高難] 製程能力綜合評估與改善計畫","q":"[高難] 注塑製程：μ=50.5mm，σ=1.2mm，USL=54.0mm，LSL=48.0mm。計算：(1) Cp、Cpk (2) 目標Cpk=1.33的改善方案：a)只調μ b)只降σ c)同時改善。","given":"μ=50.5，σ=1.2，USL=54.0，LSL=48.0","steps":["Cp=(54-48)/(6×1.2)=6/7.2=0.833","CPU=(54-50.5)/(3×1.2)=3.5/3.6=0.972","CPL=(50.5-48)/(3×1.2)=2.5/3.6=0.694","Cpk=min(0.972,0.694)=0.694（嚴重偏低）","方案a)只調μ=51.0（中心）：CPU=CPL=(3.0)/(3.6)=0.833→Cpk=0.833（仍不足1.33）","即使完全居中，Cp=0.833<1.33→只調μ不夠","方案b)只降σ：(54-50.5)/(3σ)=1.33→σ=3.5/3.99=0.877；但CPL=(2.5)/(3×0.877)=0.951<1.33","需同時調μ+降σ","方案c)μ=51.0+σ=0.75：CPU=CPL=(3.0)/(3×0.75)=1.333 ✓","★ 總結：Cp=0.833<1.33→必須同時改善均值（對準中心）和降低σ","★ 記憶：Cp代表製程潛力；若Cp<目標，調μ無效，必須降σ"],"ans":"Cpk=0.694；必須同時調μ至中心(51.0)且降σ至≤0.75mm才能達Cpk=1.33"},

// ===== localStorage Progress Saving =====
const SAVE_KEY = 'cqt_exam_progress';

function saveProgress() {
  try {
    const saveData = {
      mode: state.mode,
      section: state.section,
      currentQ: state.currentQ,
      answers: state.answers,
      calcRevealed: state.calcRevealed,
      calcChecked: state.calcChecked,
      seconds: state.seconds,
      savedAt: new Date().toLocaleString('zh-TW'),
      version: 2
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
  } catch(e) { console.warn('Save failed:', e); }
}

function loadSavedProgress() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (!data || !data.version) return null;
    return data;
  } catch(e) { return null; }
}

function clearProgress() {
  localStorage.removeItem(SAVE_KEY);
  showNotification('✓ 進度已清除');
}

function resumeProgress(data) {
  state.mode = data.mode || 'practice';
  state.section = data.section || 'mcq';
  state.currentQ = data.currentQ || 1;
  state.answers = data.answers || {};
  state.calcRevealed = data.calcRevealed || {};
  state.calcChecked = data.calcChecked || {};
  state.seconds = data.seconds || 0;
  
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('exam-screen').style.display = 'flex';
  
  if (state.mode === 'exam') {
    state.timerRef = setInterval(() => { state.seconds++; updateTimerDisplay(); }, 1000);
  }
  
  renderQuestion();
  buildDots();
  updateDots();
  updateTimerDisplay();
  if (typeof addMobileGridToggle === 'function') addMobileGridToggle();
  showNotification('✓ 已恢復上次進度（' + data.savedAt + '）');
}

function showNotification(msg) {
  let n = document.getElementById('save-notification');
  if (!n) {
    n = document.createElement('div');
    n.id = 'save-notification';
    n.style.cssText = 'position:fixed;bottom:1rem;right:1rem;background:#059669;color:#fff;padding:.6rem 1.2rem;border-radius:8px;font-size:.85rem;z-index:9999;transition:opacity .5s;box-shadow:0 2px 8px rgba(0,0,0,0.2)';
    document.body.appendChild(n);
  }
  n.textContent = msg;
  n.style.opacity = '1';
  clearTimeout(n._timer);
  n._timer = setTimeout(() => { n.style.opacity = '0'; }, 2500);
}

function checkResumeOnLoad() {
  const saved = loadSavedProgress();
  if (!saved) return;
  
  const resumeBar = document.getElementById('resume-bar');
  if (resumeBar) {
    resumeBar.style.display = 'flex';
    document.getElementById('resume-info').textContent = 
      '上次進度：' + '練習模式' + 
      ' · 第 ' + saved.currentQ + ' 題 · ' + saved.savedAt;
    document.getElementById('resume-btn').onclick = () => resumeProgress(saved);

      clearProgress();
      resumeBar.style.display = 'none';
    };

}

let _randType = 'all';
let _randCount = 10;

function showRandSetup() {
  document.getElementById('rand-setup').classList.add('visible');
}
function hideRandSetup() {
  document.getElementById('rand-setup').classList.remove('visible');
}
function setRandCount(n, btn) {
  _randCount = Math.min(n, 800);
  document.getElementById('rand-input').value = _randCount;
  document.querySelectorAll('.rand-preset').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
}
function setRandCountCustom(val) {
  _randCount = Math.max(1, Math.min(parseInt(val)||10, 300));
  document.querySelectorAll('.rand-preset').forEach(b => b.classList.remove('active'));
}
function setRandType(type, btn) {
  _randType = type;
  document.querySelectorAll('.rand-type-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  // Adjust max count
  let maxQ = type==='mcq' ? MCQ.length : type==='calc' ? CALC.length : MCQ.length+CALC.length;
  _randCount = Math.min(_randCount, maxQ);
  document.getElementById('rand-input').value = _randCount;
}

function buildRandomPool(count, type) {
  let pool = [];
  if (type === 'all' || type === 'mcq') {
    MCQ.forEach(q => pool.push({type:'mcq', n:q.n}));
  }
  if (type === 'all' || type === 'calc') {
    CALC.forEach(q => pool.push({type:'calc', n:q.n}));
  }
  // Fisher-Yates shuffle
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, Math.min(count, pool.length));
}

function startRandomExam() {
  state.randomPool = buildRandomPool(_randCount, _randType);
  state.randomIdx = 0;
  if (state.randomPool.length === 0) { alert('沒有可用題目！'); return; }
  const first = state.randomPool[0];
  state.section = first.type;
  state.currentQ = first.n;
  state.answers = {};
  state.calcRevealed = {};
  state.calcChecked = {};
  state.seconds = 0;
}

// Random mode: get current question from pool
function getRandCurrentQ() {
  if (state.mode !== 'random') return null;
  return state.randomPool[state.randomIdx] || null;
}

function randIsLast() {
  return state.randomIdx >= state.randomPool.length - 1;
}

function randPrev() {
  if (state.randomIdx <= 0) return;
  state.randomIdx--;
  const cur = state.randomPool[state.randomIdx];
  state.section = cur.type;
  state.currentQ = cur.n;
  renderQuestion();
}

function randNext() {
  if (randIsLast()) { showResults(); return; }
  state.randomIdx++;
  const cur = state.randomPool[state.randomIdx];
  state.section = cur.type;
  state.currentQ = cur.n;
  renderQuestion();
}

const WRONG_KEY = 'cqt_wrong_db';

function loadWrongDB() {
  try { return JSON.parse(localStorage.getItem(WRONG_KEY) || '{}'); }
  catch(e) { return {}; }
}
function saveWrongDB(db) {
  localStorage.setItem(WRONG_KEY, JSON.stringify(db));
}

function addWrong(n, type, myAnswer) {
  const db = loadWrongDB();
  const q = type === 'mcq' ? MCQ.find(x => x.n === n) : CALC.find(x => x.n === n);
  if (!q) return;
  if (!db[n]) db[n] = {type, n, times:0, myAnswers:[]};
  db[n].times++;
  db[n].lastWrong = new Date().toLocaleString('zh-TW');
  if (myAnswer && db[n].myAnswers.indexOf(myAnswer) === -1) db[n].myAnswers.push(myAnswer);
  saveWrongDB(db);
  updateWrongBadges();
}

function removeWrongEntry(n) {
  const db = loadWrongDB();
  delete db[n];
  saveWrongDB(db);
  renderWrongList();
  updateWrongBadges();
}

function clearAllWrong() {
  if (!confirm('確定清除所有錯題記錄？')) return;
  localStorage.removeItem(WRONG_KEY);
  renderWrongList();
  updateWrongBadges();
  showNotification('✓ 錯題記錄已清除');
}

function updateWrongBadges() {
  const db = loadWrongDB();
  const cnt = Object.keys(db).length;
  ['wrong-count-start','wrong-count-sidebar','wrong-total-count'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = cnt;
    el.style.display = cnt > 0 ? 'inline-block' : 'none';
  });
  const stats = document.getElementById('wrong-stats');
  if (stats) stats.textContent = cnt > 0 ? ('共 ' + cnt + ' 道錯題') : '';
}

function renderWrongList() {
  const db = loadWrongDB();
  const list = document.getElementById('wrong-list');
  if (!list) return;
  const items = Object.values(db).sort((a,b) => b.times - a.times);
  if (items.length === 0) {
    list.innerHTML = '<div class="wrong-empty"><div class="big">🎉</div>目前沒有錯題記錄！繼續加油</div>';
    return;
  }
  list.innerHTML = items.map(item => {
    const q = item.type === 'mcq'
      ? MCQ.find(x => x.n === item.n)
      : CALC.find(x => x.n === item.n);
    if (!q) return '';
    const typeLabel = item.type === 'mcq' ? '選擇題' : '計算題';
    let ansRow = '';
    if (item.type === 'mcq') {
      const myA = (item.myAnswers||[]).join('、') || '未作答';
      ansRow = `<div class="wrong-ans-row">
        <span class="wrong-my">我的答案：${myA}</span>
        <span class="wrong-correct">正確答案：${q.ans}</span>
      </div>
      <div class="wrong-expl">${q.expl}</div>`;
    } else {
      ansRow = `<div class="wrong-expl">正確答案：${q.ans}</div>`;
    }
    const title = item.type === 'mcq' ? q.q : ('【'+q.ch+'】'+q.q.substring(0,40)+'…');
    return `<div class="wrong-card" id="wc-${item.n}">
      <div class="wrong-card-head">
        <span style="font-size:.82rem;font-weight:700;color:var(--navy)">Q${item.n} ${typeLabel}</span>
        <div style="display:flex;align-items:center;gap:.5rem;">
          <span class="wrong-badge">錯${item.times}次</span>
          <button class="wrong-del" onclick="removeWrongEntry(${item.n})" title="移除此題">✕</button>
        </div>
      </div>
      <div class="wrong-card-body">
        <div class="wrong-q">${title}</div>
        ${ansRow}
        <div style="font-size:.75rem;color:#94a3b8;margin-top:.3rem;">最近錯誤：${item.lastWrong||''}</div>
      </div>
    </div>`;
  }).join('');
}

function startWrongQuiz() {
  const db = loadWrongDB();
  const keys = Object.keys(db);
  if (keys.length === 0) { alert('沒有錯題記錄！'); return; }
  // Build pool from wrong questions
  const pool = keys.map(k => ({type: db[k].type, n: parseInt(k)}));
  // Shuffle
  for (let i = pool.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [pool[i],pool[j]] = [pool[j],pool[i]];

  state.randomPool = pool;
  state.randomIdx = 0;
  state.answers = {};

  state.section = first.type;

    if(state.seconds>=9000) el.classList.add('warn');
  },1000);
