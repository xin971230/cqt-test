<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CQT 綜合模擬考卷 — 互動版</title>
<style>
:root{
  --navy:#1C3A5F;--teal:#0891B2;--orange:#E97316;
  --green:#059669;--red:#DC2626;--purple:#7C3AED;
  --bg:#F0F6FF;--dark:#1E293B;--gray:#64748B;
  --lgray:#E2E8F0;--white:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft JhengHei","微軟正黑體",Arial,sans-serif;background:var(--bg);color:var(--dark);}

/* ─── START SCREEN ─────────────────── */
#start{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;background:linear-gradient(135deg,var(--navy) 0%,#2563a8 100%);}
.start-card{background:white;border-radius:16px;padding:2.5rem;max-width:640px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.start-logo{font-size:2.8rem;font-weight:900;color:var(--navy);margin-bottom:.3rem;}
.start-sub{font-size:1.1rem;color:var(--teal);font-weight:600;margin-bottom:1.5rem;}
.start-info{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:1.5rem 0;}
.info-box{background:var(--bg);border-radius:10px;padding:1rem;border-left:4px solid var(--teal);}
.info-box b{color:var(--navy);display:block;margin-bottom:.3rem;font-size:.95rem;}
.info-box span{color:var(--gray);font-size:.88rem;}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:1.5rem 0;}
.mode-btn{border:2px solid var(--lgray);border-radius:12px;padding:1.2rem;cursor:pointer;text-align:left;background:white;transition:.2s;}
.mode-btn:hover,.mode-btn.selected{border-color:var(--teal);background:#eff6ff;}
.mode-btn.selected{border-color:var(--navy);background:#dbeafe;}
.mode-icon{font-size:1.8rem;margin-bottom:.5rem;}
.mode-title{font-weight:700;color:var(--navy);font-size:1rem;}
.mode-desc{font-size:.82rem;color:var(--gray);margin-top:.3rem;line-height:1.4;}
.btn-start{width:100%;padding:1rem;background:var(--navy);color:white;border:none;border-radius:10px;font-size:1.1rem;font-weight:700;cursor:pointer;margin-top:.5rem;transition:.2s;font-family:inherit;}
.btn-start:hover{background:var(--teal);}

/* ─── APP LAYOUT ─────────────────── */
#app{display:none;height:100vh;flex-direction:column;}
header{background:var(--navy);color:white;padding:.6rem 1.2rem;display:flex;align-items:center;gap:1rem;flex-shrink:0;}
.hdr-title{font-size:1rem;font-weight:700;flex:1;}
.hdr-timer{font-size:1.1rem;font-weight:700;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.1);padding:.3rem .8rem;border-radius:8px;min-width:80px;text-align:center;}
.hdr-timer.warn{background:#dc2626;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.hdr-score{font-size:.9rem;background:var(--teal);padding:.3rem .8rem;border-radius:8px;}
.progress-bar{height:4px;background:rgba(255,255,255,.2);flex-shrink:0;}
.progress-fill{height:100%;background:var(--teal);transition:.3s;}

.layout{display:flex;flex:1;overflow:hidden;}

/* ─── SIDEBAR ─────────────────── */
aside{width:240px;background:white;border-right:1px solid var(--lgray);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;}
.sec-tabs{display:flex;border-bottom:1px solid var(--lgray);}
.sec-tab{flex:1;padding:.7rem .3rem;text-align:center;cursor:pointer;font-size:.82rem;font-weight:600;color:var(--gray);border-bottom:3px solid transparent;transition:.2s;}
.sec-tab.active{color:var(--navy);border-bottom-color:var(--teal);}
.q-grid{padding:.8rem;overflow-y:auto;flex:1;}
.q-grid-title{font-size:.75rem;color:var(--gray);text-transform:uppercase;margin-bottom:.5rem;letter-spacing:.05em;}
.q-dots{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:1rem;}
.q-dot{aspect-ratio:1;border-radius:4px;background:var(--lgray);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:600;color:var(--gray);transition:.15s;border:none;}
.q-dot:hover{background:#cbd5e1;}
.q-dot.answered{background:#dbeafe;color:var(--navy);}
.q-dot.correct{background:#dcfce7;color:var(--green);}
.q-dot.wrong{background:#fee2e2;color:var(--red);}
.q-dot.current{outline:2px solid var(--navy);outline-offset:1px;}
.sidebar-stats{padding:.8rem;border-top:1px solid var(--lgray);font-size:.8rem;color:var(--gray);}
.stat-row{display:flex;justify-content:space-between;margin-bottom:.3rem;}
.stat-val{font-weight:700;color:var(--dark);}

/* ─── MAIN CONTENT ─────────────────── */
main{flex:1;overflow-y:auto;padding:1.5rem;}
.q-card{background:white;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);overflow:hidden;max-width:780px;margin:0 auto;}
.q-header{background:var(--navy);color:white;padding:1rem 1.2rem;display:flex;align-items:center;gap:.8rem;}
.q-num{background:var(--teal);color:white;border-radius:8px;padding:.3rem .7rem;font-weight:700;font-size:.9rem;white-space:nowrap;}
.q-chapter{font-size:.82rem;color:#a0c4e8;}
.q-body{padding:1.4rem;}
.q-text{font-size:1rem;font-weight:600;color:var(--dark);line-height:1.6;margin-bottom:1.2rem;}
.options{display:grid;gap:.5rem;}
.opt-btn{width:100%;text-align:left;padding:.75rem 1rem;border-radius:8px;border:2px solid var(--lgray);background:white;cursor:pointer;font-size:.95rem;color:var(--dark);transition:.15s;font-family:inherit;line-height:1.4;}
.opt-btn:hover:not(:disabled){border-color:var(--teal);background:#eff6ff;}
.opt-btn.selected{border-color:#94a3b8;background:#f8fafc;}
.opt-btn.correct{border-color:var(--green)!important;background:#f0fdf4!important;color:var(--green);font-weight:600;}
.opt-btn.wrong{border-color:var(--red)!important;background:#fef2f2!important;color:var(--red);text-decoration:line-through;}
.opt-btn:disabled{cursor:default;}
.expl-box{margin-top:1rem;padding:.9rem 1rem;background:#fffbeb;border-left:4px solid var(--orange);border-radius:0 8px 8px 0;font-size:.9rem;color:var(--dark);line-height:1.5;display:none;}
.expl-box.show{display:block;}
.exam-note{margin-top:1rem;padding:.8rem;background:var(--bg);border-radius:8px;font-size:.88rem;color:var(--gray);text-align:center;}

/* ─── CALC SLIDE ─────────────────── */
.calc-q-box{background:#eff6ff;border:1.5px solid var(--navy);border-radius:8px;padding:1rem 1.2rem;margin-bottom:.8rem;font-size:.98rem;font-weight:600;color:var(--navy);line-height:1.5;}
.given-box{background:var(--teal);color:white;border-radius:8px;padding:.6rem 1rem;margin-bottom:.8rem;font-size:.88rem;}
.given-label{font-weight:700;margin-bottom:.2rem;}
.work-area{border:2px dashed var(--lgray);border-radius:8px;min-height:180px;padding:1rem;margin:.8rem 0;position:relative;}
.work-label{position:absolute;top:.7rem;left:.8rem;font-size:.85rem;color:#cbd5e1;font-weight:600;}
.work-area textarea{width:100%;min-height:140px;border:none;background:transparent;resize:none;font-family:inherit;font-size:.9rem;color:var(--dark);padding-top:1.8rem;outline:none;}
.reveal-btn{padding:.65rem 1.4rem;background:var(--navy);color:white;border:none;border-radius:8px;cursor:pointer;font-size:.95rem;font-weight:600;font-family:inherit;transition:.2s;}
.reveal-btn:hover{background:var(--teal);}
.solution-box{margin-top:1rem;border:1.5px solid var(--lgray);border-radius:8px;overflow:hidden;display:none;}
.solution-box.show{display:block;}
.sol-header{background:var(--navy);color:white;padding:.6rem 1rem;font-weight:700;font-size:.9rem;}
.steps{padding:.8rem 1rem;}
.step-row{display:flex;gap:.7rem;margin-bottom:.6rem;align-items:flex-start;}
.step-num{background:var(--orange);color:white;border-radius:6px;min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.82rem;flex-shrink:0;margin-top:1px;}
.step-text{font-size:.9rem;color:var(--dark);line-height:1.5;padding-top:2px;}
.ans-banner{background:var(--green);color:white;padding:.65rem 1rem;font-weight:700;font-size:.92rem;border-radius:0 0 8px 8px;}
.calc-self-check{display:flex;align-items:center;gap:.6rem;margin-top:.8rem;padding:.7rem 1rem;background:#f0fdf4;border-radius:8px;font-size:.9rem;color:var(--dark);}
.calc-self-check input{width:18px;height:18px;cursor:pointer;accent-color:var(--green);}

/* ─── NAV BUTTONS ─────────────────── */
.q-nav{display:flex;align-items:center;justify-content:space-between;max-width:780px;margin:1rem auto 0;}
.nav-btn{padding:.6rem 1.2rem;border-radius:8px;border:2px solid var(--lgray);background:white;cursor:pointer;font-size:.92rem;font-weight:600;color:var(--dark);font-family:inherit;transition:.2s;}
.nav-btn:hover:not(:disabled){border-color:var(--navy);color:var(--navy);}
.nav-btn:disabled{opacity:.4;cursor:default;}
.nav-btn.primary{background:var(--navy);color:white;border-color:var(--navy);}
.nav-btn.primary:hover{background:var(--teal);border-color:var(--teal);}
.q-counter{font-size:.9rem;color:var(--gray);}

/* ─── RESULTS ─────────────────── */
#results{display:none;min-height:100vh;background:var(--bg);padding:2rem;}
.res-hero{background:var(--navy);color:white;border-radius:16px;padding:2rem;text-align:center;margin-bottom:1.5rem;max-width:700px;margin-left:auto;margin-right:auto;}
.res-score{font-size:4rem;font-weight:900;color:var(--teal);line-height:1;}
.res-total{font-size:1rem;color:#a0c4e8;margin-bottom:1rem;}
.res-grade{font-size:1.4rem;font-weight:700;margin:.5rem 0;}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin-top:1rem;}
.res-stat{background:rgba(255,255,255,.1);border-radius:10px;padding:.8rem;}
.res-stat-n{font-size:1.6rem;font-weight:700;}
.res-stat-l{font-size:.8rem;color:#a0c4e8;}
.res-card{background:white;border-radius:12px;padding:1.5rem;max-width:700px;margin:0 auto 1rem;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.res-card h3{color:var(--navy);margin-bottom:1rem;font-size:1rem;}
.review-item{padding:.6rem 0;border-bottom:1px solid var(--lgray);display:flex;align-items:flex-start;gap:.7rem;font-size:.88rem;}
.review-item:last-child{border-bottom:none;}
.ri-icon{font-size:1rem;flex-shrink:0;margin-top:2px;}
.ri-q{flex:1;}
.ri-q b{display:block;color:var(--dark);margin-bottom:.2rem;}
.ri-q small{color:var(--gray);}
.btn-retry{padding:.8rem 2rem;background:var(--teal);color:white;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;margin-top:.5rem;}
.calc-review-item{padding:.8rem 0;border-bottom:1px solid var(--lgray);font-size:.88rem;}
.calc-review-item:last-child{border-bottom:none;}
.cri-q{font-weight:600;color:var(--dark);margin-bottom:.3rem;}
.cri-ans{color:var(--green);font-size:.85rem;}
.section-switch-btn{padding:.5rem 1rem;background:var(--bg);border:2px solid var(--navy);color:var(--navy);border-radius:8px;cursor:pointer;font-size:.88rem;font-weight:600;font-family:inherit;transition:.2s;}
.section-switch-btn:hover,.section-switch-btn.active{background:var(--navy);color:white;}
.exam-submit-bar{background:var(--navy);color:white;padding:.8rem 1.5rem;border-radius:10px;display:flex;align-items:center;justify-content:space-between;max-width:780px;margin:1rem auto 0;}
.submit-btn{padding:.55rem 1.4rem;background:var(--orange);color:white;border:none;border-radius:8px;cursor:pointer;font-size:.95rem;font-weight:700;font-family:inherit;}

/* ═══════════════════════════════════════
   MOBILE RESPONSIVE (max-width: 768px)
   ═══════════════════════════════════════ */
@media (max-width: 768px) {

  /* ── Start Screen ── */
  #start { padding: 1rem; }
  .start-card { padding: 1.5rem 1.2rem; border-radius: 12px; }
  .start-logo { font-size: 2rem; }
  .start-sub { font-size: .95rem; margin-bottom: 1rem; }
  .start-info { grid-template-columns: 1fr; gap: .6rem; margin: 1rem 0; }
  .mode-grid { grid-template-columns: 1fr; gap: .6rem; margin: 1rem 0; }
  .mode-btn { padding: .9rem; }
  .mode-icon { font-size: 1.4rem; margin-bottom: .3rem; }
  .btn-start { padding: .85rem; font-size: 1rem; }

  /* ── App Header ── */
  header { padding: .5rem .8rem; gap: .5rem; flex-wrap: wrap; }
  .hdr-title { font-size: .85rem; min-width: 0; }
  .hdr-timer { font-size: .95rem; padding: .25rem .6rem; min-width: 68px; }
  .hdr-score { font-size: .78rem; padding: .25rem .6rem; }
  #mode-badge { display: none; }

  /* ── Layout: sidebar → top bar ── */
  .layout { flex-direction: column; overflow: visible; }

  aside {
    width: 100%;
    flex-direction: column;
    border-right: none;
    border-bottom: 2px solid var(--lgray);
    max-height: none;
    overflow: visible;
  }

  .sec-tabs { border-bottom: 1px solid var(--lgray); }
  .sec-tab { padding: .6rem .3rem; font-size: .85rem; }

  /* Question dot grid: collapsible on mobile */
  .q-grid { display: none; }
  .q-grid.mobile-open { display: block; max-height: 180px; overflow-y: auto; }

  .sidebar-stats {
    display: flex;
    align-items: center;
    gap: .6rem;
    padding: .5rem .8rem;
    flex-wrap: wrap;
  }
  .stat-row { margin-bottom: 0; font-size: .78rem; }
  .stat-val { font-size: .85rem; }

  /* Toggle button for dot grid */
  #grid-toggle {
    display: block !important;
    width: 100%;
    padding: .35rem;
    background: var(--bg);
    border: none;
    border-bottom: 1px solid var(--lgray);
    color: var(--gray);
    font-size: .8rem;
    cursor: pointer;
    font-family: inherit;
  }

  /* ── Main content full-width ── */
  main { padding: .8rem; overflow-y: visible; }

  /* ── Question Card ── */
  .q-card { border-radius: 10px; }
  .q-header { padding: .75rem .9rem; gap: .6rem; flex-wrap: wrap; }
  .q-num { font-size: .82rem; padding: .25rem .55rem; }
  .q-chapter { font-size: .75rem; }
  .q-body { padding: 1rem .9rem; }
  .q-text { font-size: .95rem; line-height: 1.55; margin-bottom: 1rem; }
  .options { gap: .45rem; }
  .opt-btn { font-size: .9rem; padding: .65rem .85rem; border-radius: 7px; }
  .expl-box { font-size: .85rem; padding: .75rem .85rem; margin-top: .8rem; }

  /* ── Calc Card ── */
  .calc-q-box { font-size: .92rem; padding: .85rem; }
  .given-box { font-size: .83rem; padding: .55rem .85rem; }
  .work-area { min-height: 130px; padding: .7rem; }
  .work-area textarea { min-height: 95px; font-size: .88rem; }
  .reveal-btn { padding: .55rem 1rem; font-size: .88rem; }
  .step-text { font-size: .85rem; }
  .step-num { min-width: 23px; height: 23px; font-size: .78rem; }
  .ans-banner { font-size: .88rem; padding: .55rem .85rem; }
  .calc-self-check { font-size: .85rem; }

  /* ── Navigation buttons ── */
  .q-nav { flex-wrap: nowrap; gap: .5rem; margin-top: .8rem; }
  .nav-btn { font-size: .82rem; padding: .5rem .7rem; flex-shrink: 0; }
  .q-counter { font-size: .8rem; white-space: nowrap; }

  /* ── Results ── */
  #results { padding: 1rem; }
  .res-hero { padding: 1.5rem 1rem; border-radius: 12px; margin-bottom: 1rem; }
  .res-score { font-size: 3rem; }
  .res-total { font-size: .9rem; }
  .res-grade { font-size: 1.2rem; }
  .res-grid { grid-template-columns: 1fr 1fr 1fr; gap: .5rem; }
  .res-stat { padding: .6rem .4rem; }
  .res-stat-n { font-size: 1.2rem; }
  .res-stat-l { font-size: .7rem; }
  .res-card { border-radius: 10px; padding: 1rem; }
  .res-card h3 { font-size: .92rem; }
  .review-item { font-size: .82rem; gap: .5rem; }
  .ri-q b { font-size: .85rem; }
  .calc-review-item { font-size: .82rem; }
  .btn-retry { padding: .7rem 1.5rem; font-size: .95rem; }

  /* ── Sidebar submit button ── */
  .sidebar-stats .submit-btn {
    padding: .4rem .8rem;
    font-size: .8rem;
    border-radius: 6px;
    white-space: nowrap;
  }
}

/* Extra small phones */
@media (max-width: 380px) {
  .start-logo { font-size: 1.7rem; }
  .q-text { font-size: .88rem; }
  .opt-btn { font-size: .84rem; padding: .6rem .7rem; }
  .res-grid { grid-template-columns: 1fr; }
}


#grid-toggle { display: none; }

  #resume-bar {
    display: none;
    background: linear-gradient(135deg, #0891B2, #1C3A5F);
    color: white;
    padding: .8rem 1.2rem;
    border-radius: 10px;
    margin: 1rem auto;
    max-width: 680px;
    align-items: center;
    gap: .8rem;
    flex-wrap: wrap;
    font-size: .9rem;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }
  #resume-info { flex: 1; min-width: 200px; }
  #resume-btn {
    background: #E97316;
    color: white;
    border: none;
    padding: .4rem .9rem;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: .85rem;
  }
  #resume-btn:hover { background: #c75f10; }
  #clear-btn-top {
    background: transparent;
    color: rgba(255,255,255,0.75);
    border: 1px solid rgba(255,255,255,0.4);
    padding: .4rem .8rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: .8rem;
  }
  #clear-btn-top:hover { color: white; border-color: white; }
  .save-btn-sidebar {
    display: block;
    width: 100%;
    margin-top: .5rem;
    padding: .4rem;
    background: #059669;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: .8rem;
    font-weight: 600;
  }
  .save-btn-sidebar:hover { background: #047857; }
  .clear-btn-sidebar {
    display: block;
    width: 100%;
    margin-top: .3rem;
    padding: .4rem;
    background: transparent;
    color: #DC2626;
    border: 1px solid #DC2626;
    border-radius: 6px;
    cursor: pointer;
    font-size: .75rem;
  }
  .clear-btn-sidebar:hover { background: #DC2626; color: white; }


  /* Random quiz UI */
  .mode-grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:.8rem; margin:1.2rem 0; }
  .random-setup { display:none; background:var(--bg); border-radius:12px; padding:1rem 1.2rem; margin:.5rem 0 1rem; }
  .random-setup.visible { display:block; }
  .rand-presets { display:flex; flex-wrap:wrap; gap:.5rem; margin-bottom:.8rem; }
  .rand-preset { background:white; border:2px solid var(--lgray); color:var(--navy); border-radius:8px;
    padding:.35rem .75rem; cursor:pointer; font-size:.85rem; font-weight:600; transition:.15s; font-family:inherit; }
  .rand-preset.active,.rand-preset:hover { border-color:var(--teal); background:var(--teal); color:white; }
  .rand-custom { display:flex; align-items:center; gap:.6rem; }
  .rand-custom input { width:90px; padding:.4rem .6rem; border:2px solid var(--lgray); border-radius:8px;
    font-size:.9rem; font-family:inherit; text-align:center; }
  .rand-custom input:focus { outline:none; border-color:var(--teal); }
  .rand-type-row { display:flex; gap:.6rem; margin-top:.7rem; flex-wrap:wrap; }
  .rand-type-btn { padding:.3rem .7rem; border:2px solid var(--lgray); border-radius:6px; cursor:pointer;
    font-size:.8rem; font-weight:600; font-family:inherit; background:white; color:var(--gray); transition:.15s; }
  .rand-type-btn.active { border-color:var(--orange); background:var(--orange); color:white; }

  /* Wrong answer panel */
  #wrong-panel { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:2000; display:none;
    align-items:flex-start; justify-content:flex-end; }
  #wrong-panel.open { display:flex; }
  .wrong-drawer { background:white; width:min(520px,100vw); height:100vh; overflow-y:auto;
    box-shadow:-4px 0 24px rgba(0,0,0,.2); display:flex; flex-direction:column; }
  .wrong-header { background:var(--navy); color:white; padding:1rem 1.2rem; display:flex;
    align-items:center; justify-content:space-between; position:sticky; top:0; z-index:1; }
  .wrong-header h2 { font-size:1.05rem; margin:0; }
  .wrong-close { background:none; border:none; color:white; font-size:1.4rem; cursor:pointer; line-height:1; }
  .wrong-toolbar { padding:.8rem 1rem; border-bottom:1px solid var(--lgray); display:flex; gap:.6rem; flex-wrap:wrap; }
  .wrong-list { flex:1; padding:.8rem 1rem; }
  .wrong-card { border:1px solid var(--lgray); border-radius:10px; margin-bottom:.8rem; overflow:hidden; }
  .wrong-card-head { background:var(--bg); padding:.55rem .9rem; display:flex;
    align-items:center; justify-content:space-between; }
  .wrong-badge { font-size:.72rem; background:#FEE2E2; color:#DC2626; padding:.15rem .5rem;
    border-radius:20px; font-weight:700; }
  .wrong-card-body { padding:.7rem .9rem; font-size:.88rem; }
