{"n":552,"q":"[高難] 「熱膨脹效應」對精密量測的影響中，若鋼件線膨脹係數α=11.7×10⁻⁶/°C，100mm長的工件在25°C（標準溫度為20°C）量測，理論尺寸修正量為？","opts":["A. +0.006mm", "B. +0.059mm", "C. -0.059mm", "D. +0.585mm"],"ans":"B","expl":"熱膨脹修正：ΔL=L×α×ΔT=100mm×11.7×10⁻⁶/°C×(25-20)°C=100×11.7×10⁻⁶×5=0.00585mm≈+0.006mm。等等，我要重算：100×11.7e-6×5=0.00585mm。選項A=+0.006mm最接近。重要的是，高溫使工件膨脹，量測值偏大；修正到20°C標準狀態應減去膨脹量，真實尺寸=量測值-ΔL。"},
{"n":553,"q":"[基礎] 「準確度」(Accuracy)與「精密度」(Precision)的差異？","opts":["A. 準確度=偏差小（靠近真值）；精密度=重複性好（值集中）", "B. 兩者相同", "C. 精密度=靠近真值；準確度=重複性好", "D. 準確度只用於量具；精密度只用於儀器"],"ans":"A","expl":"經典比喻——射箭：①高準確度+高精密度=箭都射中靶心（理想）②高精密度+低準確度=箭集中但偏離靶心（系統誤差，可校正）③低精密度+高準確度=箭散亂但中心在靶心（隨機誤差）④低精密度+低準確度=又散又偏（最差）。量測系統分析：偏差(Bias)=準確度問題；R&R=精密度問題。"},
{"n":554,"q":"[進階] 「螺紋環規」(Thread Ring Gauge)的Go端與No-Go端分別檢查什麼？","opts":["A. Go端檢查大徑；No-Go端檢查小徑", "B. Go端檢查最大實體條件（組裝性）；No-Go端檢查最小實體條件（材料足量）", "C. 兩端功能相同", "D. Go端檢查節距；No-Go端檢查螺紋角"],"ans":"B","expl":"依Taylor原則：Go規設計成模擬配合件，同時檢查被測特徵的最大實體條件（形態+尺寸）；No-Go規只檢查單一特性的最小實體條件。螺紋環規：Go端=完整螺紋配合（同時檢查大徑、節徑、牙形），確保螺栓能旋入（組裝性）；No-Go端=只檢查節徑上限，確保材料不過少。外螺紋用環規，內螺紋用塞規。"},
{"n":555,"q":"[高難] 「量測系統分析」中，若某量測系統的判別分析數(NDC, Number of Distinct Categories)≥5，表示？","opts":["A. 量測系統不可接受", "B. 量測系統可以區分至少5個不同的品質類別，分辨率足夠", "C. 操作員需要更多訓練", "D. 需要更多量測次數"],"ans":"B","expl":"NDC（可區別的類別數）=1.41×(PV/GRR)，PV=零件變異，GRR=量測系統變異。NDC≥5代表量測系統的分辨率足夠區分產品間的差異，可用於製程控制和能力分析。NDC=1=量測系統無法區分任何產品差異（只能告訴你合格/不合格）。NDC越高=量測系統的鑑別力越好。"},
{"n":556,"q":"[基礎] 「游標卡尺」的讀數方式，如主尺讀數為35mm，游標尺第8條線與主尺對齊，游標最小分度為0.02mm，讀數為？","opts":["A. 35.08mm", "B. 35.16mm", "C. 35.8mm", "D. 35.016mm"],"ans":"B","expl":"游標卡尺讀數=主尺讀數+游標格數×最小分度=35mm+8×0.02mm=35mm+0.16mm=35.16mm。游標卡尺原理：主尺49mm對應游標50格，每格0.98mm，主尺每格1mm與游標每格之差=0.02mm（最小分度）。常見規格：0.02mm（50格）、0.05mm（20格）、0.01mm（10格）。"},
{"n":557,"q":"[進階] 「原子力顯微鏡」(AFM)量測表面粗糙度的解析度級別是？","opts":["A. 微米級(μm)", "B. 奈米級(nm)乃至亞奈米級", "C. 毫米級(mm)", "D. 皮米級(pm)"],"ans":"B","expl":"原子力顯微鏡(AFM)利用微懸臂梁尖端（針尖曲率半徑<10nm）掃描表面，測量針尖與表面間的原子力變化，解析度可達0.1nm（亞奈米級），可直接觀察原子排列。相較之下，觸針式表面粗糙度儀(profilometer)解析度約1nm，光學干涉儀約0.1nm，而一般觸針式Ra量測範圍0.1μm到100μm。"},
{"n":558,"q":"[高難] 「坐標量測機」(CMM)的「動態誤差」主要來源是？","opts":["A. 溫度變化", "B. 探針系統的滯後、振動、慣性效應", "C. 工件固定方式", "D. 校正球的不圓度"],"ans":"B","expl":"CMM誤差分類：①幾何誤差（導軌直線度、垂直度、滾轉等，共21項）②溫度誤差③探針誤差（探針撓曲、滯後、各向異性）④動態誤差（量測速度高時，滑台慣性、振動引起的位置誤差）⑤工件安裝誤差。動態誤差在高速掃描CMM中特別重要，需要速度自適應補償算法。ISO 10360系列規範CMM的驗收測試方法。"},
{"n":559,"q":"[基礎] 「量表（Likert Scale）」量測得到的數據屬於哪種數據類型？","opts":["A. 比率尺度(Ratio Scale)", "B. 等距尺度(Interval Scale)", "C. 順序尺度(Ordinal Scale)", "D. 名目尺度(Nominal Scale)"],"ans":"C","expl":"數據尺度層次（從低到高）：名目尺度(Nominal)=分類，無序（顏色、性別）→順序尺度(Ordinal)=有序，但間距不等（1-5分滿意度）→等距尺度(Interval)=等間距，但無絕對零點（溫度°C、年份）→比率尺度(Ratio)=有絕對零點（重量、長度、溫度K）。Likert量表5分制的「1到2」與「4到5」的差距不一定相同，只能排序，不能做加減乘除。"},
{"n":560,"q":"[進階] 「反覆量測取平均」能降低哪種誤差，但不能消除哪種誤差？","opts":["A. 降低系統誤差；不能消除隨機誤差", "B. 降低隨機誤差；不能消除系統誤差（偏差）", "C. 同時降低兩種誤差", "D. 降低人為誤差；不能消除設備誤差"],"ans":"B","expl":"誤差分類：隨機誤差（Random Error）=量測散亂，服從正態分布，取平均後標準誤差=σ/√n，多次量測可降低；系統誤差/偏差（Systematic Error/Bias）=量測值與真值的固定偏差（如量具未校正、溫度偏差），無論量測多少次都無法通過平均消除，需通過校準或修正來消除。"},
{"n":561,"q":"[基礎] 「浴缸曲線」(Bathtub Curve)中，「有效使用期」(Useful Life)的失效率特性為？","opts":["A. 急速上升", "B. 隨時間遞增", "C. 大致恆定（隨機失效）", "D. 遞減"],"ans":"C","expl":"浴缸曲線三個時期：①早期失效期(Infant Mortality)=失效率遞減，因製造缺陷、安裝不當，Weibull β<1；②有效使用期=失效率幾乎恆定（隨機失效），β≈1（指數分布），MTBF最穩定；③耗損期=失效率遞增，因磨耗、疲勞、老化，β>1。預防性保養計劃應在進入耗損期前進行替換。"},
{"n":562,"q":"[進階] 「故障模式影響分析」(FMEA)中，「RPN」(風險優先數)的計算方式為？","opts":["A. Severity + Occurrence + Detection", "B. Severity × Occurrence × Detection", "C. Severity × Occurrence / Detection", "D. (Severity + Occurrence) × Detection"],"ans":"B","expl":"RPN = S × O × D，各項1-10分。RPN的局限：①RPN=8×1×1=8 vs S=2×O=2×D=2 RPN=8，前者嚴重度高更危險但RPN相同②同一RPN值可能由不同S/O/D組合產生。AIAG最新版FMEA（2019）改用「Action Priority」(AP)以Severity為主要優先準則，強調高Severity（8-10）即使O和D較低也應優先處理。"},
{"n":563,"q":"[高難] 「可靠性增長測試」(Reliability Growth Testing)的AMSAA模型假設？","opts":["A. 每次修復後可靠性保持不變", "B. 隨累積測試時間增加，失效率呈冪次方降低（累積失效數服從NHPP）", "C. 可靠性隨使用次數線性提升", "D. 初始可靠性決定最終可靠性"],"ans":"B","expl":"AMSAA（Army Materials Systems Analysis Activity）模型：累積失效數E[N(t)]=λtᵝ（非齊次泊松過程NHPP），β<1時失效強度遞減（可靠性增長）。用於追蹤開發測試階段可靠性改善進展，預測達到目標MTBF所需的測試時間。MTBF估計：MTBF_current=T/(β×N)，T=累積測試時間，N=累積失效數。"},
{"n":564,"q":"[基礎] 「MTBF」(Mean Time Between Failures)的適用條件是？","opts":["A. 所有類型的可修復系統", "B. 失效率恆定（指數分布）的可修復系統", "C. 不可修復系統", "D. 機械磨耗失效"],"ans":"B","expl":"MTBF=1/λ，適用於失效率恆定（隨機失效，指數分布）的可修復系統，如電子元件的有效使用期。不可修復系統使用MTTF（Mean Time To Failure）。韋伯分布β≠1時，MTBF=η×Γ(1+1/β)，Γ為Gamma函數。常見混淆：MTBF包含修復時間；MTBF=MTTF+MTTR（非常態假設下不完全正確，嚴格而言MTBF=1/失效率）。"},
{"n":565,"q":"[進階] 「加速壽命測試」(ALT)使用高應力條件的目的是？","opts":["A. 找出設計缺陷", "B. 在較短時間內誘發與正常使用條件相同機制的失效，並用數學模型外推正常壽命", "C. 測試產品能承受的最大應力", "D. 替代一般品質測試"],"ans":"B","expl":"ALT關鍵：必須誘發與正常使用「相同的失效機制」，否則外推結果無效。常用加速模型：Arrhenius（溫度加速，用於電子元件氧化、化學反應）；逆冪定律（電壓、機械應力加速）；Eyring（多應力組合）。加速因子(AF)：Arrhenius AF=exp[Ea/k×(1/T_use-1/T_stress)]。高度加速壽命測試(HALT)不外推壽命，而是找出設計邊際和弱點。"},
{"n":566,"q":"[高難] 「系統可靠度」中，k-out-of-n系統（n個單元中至少k個正常，系統才正常）的可靠度公式（各單元可靠度相同為R）為？","opts":["A. n×R-(n-1)×R²", "B. Σᵢ₌ₖⁿ C(n,i)×Rⁱ×(1-R)^(n-i)", "C. Rᵏ", "D. 1-(1-R)ⁿ"],"ans":"B","expl":"k-out-of-n系統可靠度=Σ(i=k to n) C(n,i)×Rⁱ×(1-R)^(n-i)，這是二項分布的累積概率（至少k個成功）。特例：k=n→串聯系統Rⁿ；k=1→並聯系統1-(1-R)ⁿ。例子：3-out-of-5系統（飛機3引擎以上正常才飛），R_unit=0.95→R_sys=C(5,3)×0.95³×0.05²+C(5,4)×0.95⁴×0.05+C(5,5)×0.95⁵≈0.9988。"},
{"n":567,"q":"[基礎] 「故障樹分析」(FTA)與「失效模式影響分析」(FMEA)的分析方向不同之處是？","opts":["A. FTA從上往下（由頂部事件追原因）；FMEA從下往上（由失效模式到影響）", "B. FTA分析軟體；FMEA分析硬體", "C. FTA只用於航太；FMEA只用於汽車", "D. 兩者分析方向相同"],"ans":"A","expl":"分析方向對比：FTA（故障樹分析）=演繹法（Deductive），從「頂部不期望事件」出發，向下尋找可能的原因組合，建立邏輯樹；FMEA（失效模式影響分析）=歸納法（Inductive），從「底層零件失效模式」出發，向上分析對系統的影響。兩者互補：FMEA找出所有可能失效，FTA分析特定事件發生的邏輯組合。"},
{"n":568,"q":"[進階] 「可靠度目標設定」中，若要求系統在10,000小時內可靠度≥0.95（指數分布），需要的最低MTBF為？","opts":["A. 10,000小時", "B. 約195,000小時", "C. 50,000小時", "D. 100,000小時"],"ans":"B","expl":"R(t)=e^(-t/MTBF)≥0.95；e^(-10000/MTBF)=0.95；-10000/MTBF=ln(0.95)=-0.05129；MTBF=10000/0.05129≈195,000小時。這顯示：要求高可靠度+長壽命時，所需MTBF遠大於設計壽命。這就是為何高可靠系統（如航太、核能）的MTBF要求往往是使用壽命的數十甚至數百倍。"},
{"n":569,"q":"[高難] 「維修性」(Maintainability)的核心指標MTTR的影響因素不包括？","opts":["A. 設計的可維修性（易拆裝性）", "B. 備品可用率", "C. 維修人員技能", "D. 元件的內在可靠性"],"ans":"D","expl":"MTTR（平均修復時間）影響因素：①設計因素=模組化、易接取、自我診斷能力②後勤因素=備品庫存、工具可用性③人員因素=技能培訓、人機介面設計④文件因素=維修手冊、故障診斷流程。元件的內在可靠性(MTBF)影響「失效頻率」，但不影響每次失效後的「修復時間」(MTTR)。系統可用度(Availability)=MTBF/(MTBF+MTTR)，同時受兩者影響。"},
{"n":570,"q":"[基礎] 「預防性保養」(Preventive Maintenance, PM)的最佳時機，基於可靠度理論應在？","opts":["A. 失效發生後", "B. 進入耗損期（失效率開始上升）之前", "C. 固定日曆時間，無論使用情況", "D. 生產空閒時"],"ans":"B","expl":"最佳PM時機：在浴缸曲線的「耗損期開始前」（即在Weibull β值>1的失效率上升前）更換或大修。提前太多=浪費（尚有剩餘壽命）；太晚=可能已進入高失效率區。基於條件的保養（CBM/預知保養）利用振動分析、油液分析等監控設備狀態，在「真正需要時」才保養，比時間基礎PM更精確。"},
{"n":571,"q":"[進階] 「設計FMEA」(DFMEA)與「製程FMEA」(PFMEA)的主要差異是？","opts":["A. DFMEA分析設計概念的失效；PFMEA分析製造過程步驟的失效", "B. 兩者相同", "C. DFMEA評估成本；PFMEA評估技術風險", "D. DFMEA由客戶做；PFMEA由供應商做"],"ans":"A","expl":"DFMEA（設計FMEA）：分析產品設計階段的失效模式（如材料強度不足、設計過度複雜、熱管理不良），由設計工程師主導，在設計定案前完成。PFMEA（製程FMEA）：分析製造/組裝過程步驟的失效模式（如焊接溫度不當、裝配錯誤、刀具磨耗），由製程工程師主導。兩者在APQP中的時序：DFMEA→設計→PFMEA→製程計劃。"},
{"n":572,"q":"[高難] 「加速衰退測試」(Accelerated Degradation Test, ADT)適用於？","opts":["A. 失效快速、測試時間短的高可靠度產品", "B. MTTF極長、正常測試中幾乎不會觀察到失效的高可靠度產品", "C. 低成本消費品", "D. 只用於化學品"],"ans":"B","expl":"ADT適用場景：產品MTTF遠超測試時間（如LED燈泡MTTF>50,000小時），傳統壽命測試無法在合理時間內獲得足夠失效數。ADT方法：在加速應力下量測性能退化指標（如LED光通量衰減），建立退化路徑模型，外推至失效門檻（如光通量<初始70%），估計MTTF分布。比傳統ALT提供更多信息，適用於退化型失效（而非突發型失效）。"},
{"n":573,"q":"[基礎] 「冗餘設計」(Redundancy)最直接提升哪項可靠度指標？","opts":["A. MTBF", "B. 系統可靠度R(t)（不增加MTBF但通過並聯提高系統存活概率）", "C. 維修性", "D. 單個元件的可靠性"],"ans":"B","expl":"冗餘設計（並聯冗余）提升系統可靠度：R_sys=1-(1-R)ⁿ。例如單元件R=0.9，兩重並聯→R_sys=1-(0.1)²=0.99。注意：冗余不改變單個元件的MTBF，而是通過「允許部分失效系統仍正常運作」來提高系統可靠度。冗余類型：熱備援（主要並聯運作）=最高可靠度但耗能多；冷備援（主要失效時切換）=節能但切換可靠性需考慮。"},
{"n":574,"q":"[進階] 「失效模式」(Failure Mode)與「失效機制」(Failure Mechanism)的差異是？","opts":["A. 完全相同", "B. 失效模式=失效的表現形式（如斷裂、短路）；失效機制=失效的根本物理/化學過程（如疲勞、腐蝕）", "C. 失效機制=外部觀察到的現象；失效模式=內部原因", "D. 兩者都是指失效的原因"],"ans":"B","expl":"層次關係：失效機制（根本物理/化學過程，如疲勞裂紋擴展、電遷移、腐蝕）→產生→失效模式（表現形式，如斷裂、開路、短路、洩漏）→導致→失效影響（對系統或使用者的後果）。加速壽命測試必須選擇能加速「相同失效機制」的應力，否則在測試中誘發的失效模式與實際使用不同，外推結果無效。"},
{"n":575,"q":"[高難] 「安全裕度」(Safety Margin / Safety Factor)的定義為？","opts":["A. 強度/應力的比值（需>1）", "B. (強度-應力)/標準差", "C. 設計載荷/額定載荷", "D. 規格上限-製程均值"],"ans":"A","expl":"安全係數（Safety Factor）=強度/應力=Strength/Stress（需>1，通常要求1.5~4，視風險程度而定）。可靠度設計觀點：安全係數>1不保證零失效，因強度和應力都是分布，可靠度=P(Strength>Stress)。干涉理論(Interference Theory)：當強度分布和應力分布有重疊（干涉），就有失效概率，應計算兩分布的分離程度來量化可靠度。"},
{"n":576,"q":"[基礎] FMEA中「嚴重度」(Severity)評分為10的情況是？","opts":["A. 顧客不滿意但可繼續使用", "B. 可能影響行車安全或違反法規要求，不警告就失效", "C. 需要返修", "D. 嚴重影響外觀"],"ans":"B","expl":"AIAG FMEA嚴重度評分準則：10=影響行車安全或違反政府法規，且失效發生時無警告；9=影響安全或法規，但有警告；8-7=100%或部分產品失去主要功能（顧客非常不滿）；6-5=功能降低，顧客不適；4-2=外觀/NVH問題，顧客可感知；1=無可感知影響。嚴重度只能通過「設計變更」降低，不能靠增加偵測措施降低。"},
{"n":577,"q":"[進階] 「系統安全」分析方法中，「PHA」(Preliminary Hazard Analysis)的執行時機是？","opts":["A. 量產後", "B. 設計最早期（概念設計階段），確認主要危害", "C. 失效發生後", "D. 客戶驗收前"],"ans":"B","expl":"系統安全分析時序：①PHA=初步危害分析，最早期，識別重大危害→②FHA=功能危害分析→③FMEA=失效模式影響分析，詳細設計後→④FTA=故障樹分析，設計完成後→⑤CCA=共模分析，設計完成後。越早識別危害，修改成本越低（符合1/10/100原則）。"},
{"n":578,"q":"[高難] 「共模失效」(Common Cause Failure, CCF)在冗余系統中的危害是？","opts":["A. 只影響一個元件", "B. 同一根本原因同時使多個冗余元件失效，使冗余設計失效", "C. 只在高溫環境發生", "D. 比獨立失效更容易偵測"],"ans":"B","expl":"共模失效是冗余設計的隱形殺手。例如：雙引擎飛機若兩引擎共用同一燃油管路，燃油污染會使兩引擎同時失效（冗余無效）。預防CCF措施：多樣性設計（不同製造商、不同技術的冗余）；物理隔離（火災隔牆）；功能測試（定期測試備援系統）。β因子模型：CCF概率=β×λ_total，β通常0.05-0.15。"},
{"n":579,"q":"[基礎] 「MTTR」(Mean Time To Repair)中的「修復時間」通常包含？","opts":["A. 只包含實際修理時間", "B. 故障診斷+備件取得+實際修理+功能測試的總時間", "C. 只計算停機時間", "D. 包含預防性保養時間"],"ans":"B","expl":"MTTR的組成：①故障偵測/告警時間②診斷時間（定位故障）③備件領料/運送時間④實際維修時間⑤功能測試/驗收時間⑥文件記錄時間。縮短MTTR的策略：模組化設計（快速更換）、線上自診斷、備件預置（Kitting）、清晰維修手冊、人員培訓。MTTR是維修性設計(Maintainability Design)的核心指標。"},
{"n":580,"q":"[進階] 「可用度」(Availability)的最精確計算公式是？","opts":["A. MTBF / (MTBF + MTTR)", "B. 良好運作時間 / 總需求時間", "C. 1 - 年停機率", "D. 視情況，A、B均正確"],"ans":"D","expl":"可用度分類：固有可用度Ai=MTBF/(MTBF+MTTR)，只考慮修復時間；運作可用度Ao=正常運作時間/(正常+停機)，包含所有停機（等料、等人、等機）；達成可用度Aa=MTBM/(MTBM+MMT)，MTBM=兩次保養間平均時間，MMT=平均保養時間。不同情境使用不同可用度指標。"},
{"n":581,"q":"[基礎] ISO 19011:2018 「稽核原則」中不包含以下哪項？","opts":["A. 誠信", "B. 保密性", "C. 財務獨立性", "D. 專業慎重"],"ans":"C","expl":"ISO 19011:2018稽核七大原則：①誠信(Integrity)②公正展示(Fair Presentation)③專業慎重(Due Professional Care)④保密性(Confidentiality)⑤獨立性(Independence，指思想獨立，非財務）⑥以證據為基礎的方法(Evidence-based Approach)⑦風險本位方法(Risk-based Approach)。財務獨立性不在原則清單中（雖然避免財務衝突是稽核員誠信的一部分）。"},
{"n":582,"q":"[進階] ISO 9001:2015 條文 4.1「理解組織及其背景」要求分析哪兩類議題？","opts":["A. 財務與法律議題", "B. 影響組織目的的外部議題（政治/經濟/社會/技術）與內部議題（價值觀/文化/績效）", "C. 顧客議題與供應商議題", "D. 短期與長期議題"],"ans":"B","expl":"條文4.1要求確定對組織相關的「外部」和「內部」議題。常用工具：PESTLE分析（政治、經濟、社會、技術、法律、環境）用於外部議題；SWOT分析（優勢、劣勢、機會、威脅）整合內外部。這些議題在管理評審(9.3)和策略規劃中定期更新。ISO 9001:2015的背景分析強調品質管理系統必須與組織策略一致。"},
{"n":583,"q":"[高難] 「稽核風險」(Audit Risk)的三個組成部分是？","opts":["A. 樣本風險、時間風險、成本風險", "B. 固有風險、控制風險、偵查風險", "C. 抽樣風險、非抽樣風險、系統風險", "D. 高風險、中風險、低風險"],"ans":"B","expl":"稽核風險模型（源自財務稽核，現亦用於品質稽核）：①固有風險(Inherent Risk)=不考慮控制措施時，活動本身的失誤風險；②控制風險(Control Risk)=現有內部控制無法防止或偵測重大錯誤的風險；③偵查風險(Detection Risk)=稽核程序未能偵測到重要問題的風險。總稽核風險=固有風險×控制風險×偵查風險。稽核規劃應根據風險評估分配稽核資源。"},
{"n":584,"q":"[基礎] 第一方、第二方、第三方稽核的主要差異是？","opts":["A. 稽核員的資歷不同", "B. 稽核的執行者與被稽核者的關係：自己稽核自己、顧客稽核供應商、獨立機構稽核", "C. 稽核的深度不同", "D. 法規要求不同"],"ans":"B","expl":"三種稽核：①第一方（內部稽核）=組織稽核自身，目的是改善和符合要求（ISO 9001條文9.2）；②第二方（外部稽核）=顧客稽核其供應商（或代理機構以顧客名義稽核），目的是供應商批准和績效確認；③第三方（認證稽核）=獨立認證機構（CB）稽核組織，目的是頒發ISO認證。三者獨立性遞增，信服力也遞增。"},
{"n":585,"q":"[進階] IATF 16949 要求的「生產件批准程序」(PPAP)共幾個提交要素？","opts":["A. 10個", "B. 18個", "C. 23個", "D. 5個"],"ans":"B","expl":"PPAP第4版共18個提交要素：①設計記錄②工程變更文件③顧客工程批准④DFMEA⑤流程圖⑥PFMEA⑦控制計劃⑧量測系統分析(MSA)⑨尺寸結果⑩材料/性能測試⑪初始製程研究(Cpk)⑫合格實驗室文件⑬外觀批准報告(AAR)⑭樣品零件⑮樣品⑯首件檢驗(FAI)⑰顧客特定要求⑱零件提交保證書(PSW)。不同Level提交的文件範圍不同（Level 1最少，Level 5最多）。"},
{"n":586,"q":"[高難] ISO 9001:2015 條文 8.3「產品和服務設計及開發」要求的「設計確認」(Design Validation)目的是？","opts":["A. 確認設計輸出符合設計輸入", "B. 確認最終產品/服務能滿足規定的使用要求或預期應用", "C. 確認設計文件完整性", "D. 確認供應商能力"],"ans":"B","expl":"設計驗證(Design Verification) vs 設計確認(Design Validation)：驗證=確認設計輸出符合設計輸入（「We built it right」，設計正確性）；確認=確認最終產品在預期使用條件下能滿足顧客需求（「We built the right thing」，設計適用性）。類比：製造一把椅子（驗證=椅子符合圖面規格；確認=用椅子的人坐起來滿意）。"},
{"n":587,"q":"[基礎] 「不符合事項」(Nonconformity)在ISO 9001:2015的定義是？","opts":["A. 任何未達到顧客期望的事項", "B. 未符合要求(Requirement)的事項", "C. 產品缺陷", "D. 程序文件不完整"],"ans":"B","expl":"ISO 9000:2015定義：不符合=未符合「要求」。「要求」可以是：顧客要求、法規要求、組織自訂要求、標準要求。不符合分類：主要(Major)不符合=系統性失效，對顧客或管理系統有重大影響，需立即糾正；次要(Minor)不符合=單一或偶發缺失，對系統影響小。觀察事項(Observation)=尚未不符合，但若不處理可能發展為不符合的潛在問題。"},
{"n":588,"q":"[進階] 「稽核矩陣」(Audit Matrix)的主要功能是？","opts":["A. 記錄稽核員的培訓記錄", "B. 規劃哪位稽核員在何時稽核哪些條文/部門，確保覆蓋率", "C. 計算稽核成本", "D. 評估供應商績效"],"ans":"B","expl":"稽核矩陣（又稱稽核計劃矩陣/年度稽核計劃）：橫軸=月份/時間，縱軸=部門/過程/ISO條文，表格內標示何時對何處進行何種稽核。功能：①確保所有要求項目都被稽核到②根據風險分配頻率（高風險區域更頻繁）③避免重複或遺漏④提供稽核覆蓋率記錄（ISO 9001 9.2要求考慮製程狀態和重要性）。"},
{"n":589,"q":"[高難] 在「過程方法」稽核中，「龜形圖」(Turtle Diagram)包含哪些要素？","opts":["A. 輸入、活動、輸出", "B. 輸入、活動、輸出，加上：用什麼做（設備/工具）、誰來做（人員）、如何做（方法/程序）、結果如何（績效指標）", "C. 顧客要求和顧客滿意", "D. 風險和機會"],"ans":"B","expl":"龜形圖(Turtle Diagram)是過程方法稽核的視覺化工具，包含7個要素：頭=輸入(Inputs)；尾=輸出(Outputs/Outcomes)；四條腿=①With What（設備、工具、基礎設施）②Who（能力、訓練、意識）③How（方法、程序、指令）④How Well（績效指標、KPI）；背部=過程活動。稽核員使用龜形圖確保全面評估過程的各個面向。"},
{"n":590,"q":"[基礎] ISO 45001:2018（職業安全衛生）與 ISO 9001:2015 的「高階結構」(High Level Structure)相同的目的是？","opts":["A. 強制組織必須整合管理系統", "B. 使不同ISO管理系統標準易於整合（共用條文結構、術語和定義）", "C. 降低認證費用", "D. 簡化稽核流程"],"ans":"B","expl":"ISO Annex SL（現為Annex L）統一了所有ISO管理系統標準的高階結構(HLS)：10個章節的相同框架（背景→領導力→規劃→支援→運作→績效評估→改善）。好處：組織可整合ISO 9001（品質）、ISO 14001（環境）、ISO 45001（安全衛生）為一個整合管理系統(IMS)，共用文件、稽核、管理評審，降低管理成本。"},
{"n":591,"q":"[進階] IATF 16949 特別要求的「顧客特定要求」(CSR, Customer Specific Requirements)的處理方式是？","opts":["A. 僅需知悉，不需執行", "B. 必須識別、文件化並納入品質管理系統執行，且優先於IATF 16949要求", "C. 可以與客戶協商修改", "D. 只適用於新客戶"],"ans":"B","expl":"CSR（顧客特定要求）在IATF 16949框架中的地位：CSR優先於IATF 16949技術要求。常見CSR來源：GM的BIQS(Buick-Inspired Quality Scrutiny)、Ford的Q1認可、BMW的VDA 6.3、VW的Formel Q等。供應商必須識別適用的CSR，將其整合入QMS，並確保供應鏈理解和執行。未識別CSR是IATF 16949稽核常見缺失。"},
{"n":592,"q":"[高難] 「稽核抽樣」(Audit Sampling)中，「判斷抽樣」(Judgmental Sampling)的適用情境是？","opts":["A. 需要統計推論，外推至母群體", "B. 稽核員根據專業判斷選擇高風險或代表性樣本，不用於統計外推", "C. 完全隨機選取", "D. 按照時間順序抽樣"],"ans":"B","expl":"稽核抽樣類型：①判斷抽樣=稽核員主觀選擇（高風險、有問題跡象、關鍵時間點）→結論不能統計外推，但效率高；②統計抽樣（隨機抽樣）=客觀選取，結論可外推至母群體，需較大樣本。ISO 19011指出，大多數品質稽核使用判斷抽樣，因稽核時間有限且目的是發現問題，非統計估算。財務審計則更多使用統計抽樣。"},
{"n":593,"q":"[基礎] ISO 9001:2015 要求的「內部稽核」最低頻率為何？","opts":["A. 每月一次", "B. 每季一次", "C. 標準未規定固定頻率，由組織根據過程重要性和風險自行規劃", "D. 每年一次"],"ans":"C","expl":"ISO 9001:2015 條文9.2規定內部稽核應「按照計劃的時間間隔」進行，並考慮：①相關過程的重要性②品質管理系統的變化③前期稽核結果。標準未要求固定頻率（如每年一次），而是要求組織根據風險和重要性制定稽核計劃。一般做法：低風險過程每年一次，高風險或問題頻繁的過程可能每季或每半年一次。"},
{"n":594,"q":"[進階] 「根本原因分析」中，使用「5-Why分析」時的常見陷阱是？","opts":["A. 問太多「為什麼」", "B. 過早停止在症狀層面、沿單一線索追問而忽略多重原因、或以人為失誤作為根本原因", "C. 過於深入導致結論不實際", "D. 需要太多人參與"],"ans":"B","expl":"5-Why的常見問題：①Stop Too Early=只到「操作員沒有按程序」，根本原因應追問「為何程序沒有被遵守」②Single Path=只追一條問答鏈，忽略其他同樣重要的根因（應搭配魚骨圖）③Blame人=以「人員疏失」為終點，好的根因分析應追問系統/流程如何讓人容易犯錯（Reason的系統理論）。理想根本原因應是可直接採取系統性對策的「可控制因子」。"},
{"n":595,"q":"[高難] 「過程稽核」(VDA 6.3)中，「P4」代表的稽核要素是？","opts":["A. 供應商管理", "B. 生產過程分析", "C. 員工能力", "D. 顧客關係"],"ans":"B","expl":"VDA 6.3（德國汽車工業品質管理標準）過程審核7個要素：P1=潛在分析（已去除）→P2=設計/產品與製程開發→P3=零件、材料及服務的供應商管理→P4=生產製程/製程分析（核心，生產現場6M評估）→P5=顧客服務/顧客滿意度→P6=效能、效率→P7=系統管理。P4最受重視，使用「問題催化劑」方法評估6M（人機料法環測）各項管理狀況。"},
{"n":596,"q":"[基礎] 「矯正措施有效性」驗證的最佳方法是？","opts":["A. 稽核員簽核", "B. 在相同或相似條件下確認問題不再發生，並追蹤一段時間", "C. 完成書面報告", "D. 管理階層批准"],"ans":"B","expl":"矯正措施有效性驗證步驟：①措施實施後在實際條件下重新觀察②追蹤適當時間（確保穩定，通常1-3個月）③確認類似問題未在其他區域出現（水平展開）④更新FMEA、控制計劃、SOP等文件。書面文件和管理批准是必要記錄，但不是有效性驗證本身。ISO 9001:2015 條文10.2(d)要求評估糾正措施的有效性。"},
{"n":597,"q":"[進階] 「稽核員資格」依據 ISO 19011，哪項「不」是必要條件？","opts":["A. 稽核相關知識和技能", "B. 個人特質（如誠信、洞察力、溝通能力）", "C. 持有ASQ CQA或RAB/CQI認證", "D. 稽核相關工作經驗"],"ans":"C","expl":"ISO 19011:2018 對稽核員能力要求：①個人特質（誠信、分析能力、外交手腕等）②通用稽核知識和技能（稽核原則、方法、文件）③管理系統特定知識（如ISO 9001內容）④行業特定知識（被稽核組織所在行業）⑤通過稽核取得的能力（在資深稽核員帶領下的實際稽核)。第三方認證（CQA等）是加分項，但ISO 19011本身不要求特定認證，由稽核計劃管理人員決定資格要求。"},
{"n":598,"q":"[高難] ISO 9001:2015 「過程方法」中，「PDCA」與「風險思維」的結合體現在？","opts":["A. 只在Risk Management條文中", "B. PDCA的P階段包含風險識別與機會評估，形成整合的動態管理循環", "C. 風險思維取代了PDCA", "D. 兩者沒有關係"],"ans":"B","expl":"ISO 9001:2015的整合架構：Plan=條文4-6（背景分析→領導力→規劃，包含風險與機會評估）；Do=條文7-8（支援與運作）；Check=條文9（績效評估）；Act=條文10（改善）。風險思維貫穿整個PDCA，特別在P階段的6.1（風險與機會應對措施）和A階段的10.3（持續改善）。這體現了ISO 9001從「事後糾正」轉向「預防為主」的理念轉變。"},
{"n":599,"q":"[基礎] 「顧客滿意度調查」的主要局限性是？","opts":["A. 成本太高", "B. 調查數據可能有回應偏差，且只反映表達意見的顧客，沉默顧客的不滿無法捕捉", "C. 只能用電話調查", "D. 結果不能量化"],"ans":"B","expl":"顧客滿意度測量局限：①回應率偏低（通常<30%），有回應者可能不具代表性；②極端顧客（非常滿意或非常不滿）更可能回應（Selection Bias）；③沉默的大多數不回應，流失的顧客也不填問卷；④顧客表達的滿意不代表忠誠度（KANO模型）。補充方法：NPS（淨推薦分數）、顧客流失率分析、社群媒體監控、顧客投訴分析、銷售數據追蹤。"},
{"n":600,"q":"[進階] ISO 14001:2015「環境因素」評鑑中，「重大環境因素」的識別準則通常包含？","opts":["A. 只有法規合規性", "B. 環境影響的規模/嚴重性/可逆性，加上法規要求、利益相關者關切和商業機會", "C. 只有公司能管控的因素", "D. 只包含廢水和廢氣"],"ans":"B","expl":"重大環境因素識別矩陣通常評估：①規模（影響範圍大小）②嚴重性（環境損害程度）③發生概率③持續時間④可逆性⑤法規要求（是否有法令）⑦利益相關者關切。任何一項得分高即可能認定為重大環境因素，並據此設定環境目標和管理計劃。ISO 14001鼓勵採用生命週期觀點評估環境因素（從原料到廢棄）。"},
{"n":601,"q":"[基礎] 「單分鐘換模」(SMED, Single Minute Exchange of Die)的目標是將換線時間縮短至？","opts":["A. 1分鐘以內", "B. 10分鐘以內（個位數分鐘，即<10分鐘）", "C. 30分鐘以內", "D. 沒有固定目標，盡量縮短"],"ans":"B","expl":"SMED（新鄉重夫1950年代發展）：「單分鐘」指「個位數分鐘」（Single Digit Minute = <10分鐘），而非字面上的1分鐘。SMED步驟：①觀察記錄現況換線動作②區分內部作業（停機才能做）和外部作業（機器運作中可做）③將內部作業轉為外部（關鍵改善）④縮短內部作業時間（平行作業、標準化）。換線時間縮短使小批量生產可行，是JIT和精益的基礎。"},
{"n":602,"q":"[進階] 「拉動式系統」(Pull System)的核心原理是？","opts":["A. 依據預測計劃生產", "B. 下游工站消耗後，向上游補充信號（看板），只在需要時生產", "C. 將所有庫存推送到倉庫", "D. 自動化所有工站"],"ans":"B","expl":"推動式(Push) vs 拉動式(Pull)：Push=依銷售預測預先生產，製造不論下游是否需要（導致庫存堆積，JIT的天敵）；Pull=下游消耗後發出補充信號（看板Kanban），只在需要時按需要量生產。超市補貨模型=經典Pull：顧客拿走後貨架才補充。Pull系統消除「過量生產」浪費，這是豐田生產系統(TPS)七大浪費中最嚴重的浪費。"},
{"n":603,"q":"[高難] 在「價值流圖」(VSM)中，「製程週期效率」(Process Cycle Efficiency, PCE)的定義是？","opts":["A. 設備可用時間 / 總時間", "B. 增值時間(VA Time) / 總前置時間(Total Lead Time)", "C. 良品數 / 總產數", "D. 實際產出 / 理論產出"],"ans":"B","expl":"PCE = 增值時間(Value-Added Time) / 總前置時間(Total Lead Time)。精益目標：最大化PCE。一般製造業PCE通常只有1-10%（大部分時間是等待、搬運、檢驗等非增值活動）。六標準差世界級目標：PCE>25%（製造業）；PCE>50%（服務業）。提高PCE的方法：消除七大浪費，特別是減少等待時間和在製品(WIP)。"},
{"n":604,"q":"[基礎] 「七大浪費」(7 Wastes / Muda)中，「過量生產」(Overproduction)被認為最嚴重的原因是？","opts":["A. 浪費原材料", "B. 掩蓋其他所有浪費，消耗空間和資金，且產生庫存管理問題", "C. 最難識別", "D. 直接影響品質"],"ans":"B","expl":"過量生產是「浪費之母」：過量生產→堆積庫存→庫存掩蓋問題（等待、搬運、過時、缺陷被埋沒）→需要更多空間和資金→增加管理複雜度。TPS七大浪費(TIMWOOD)：Transportation搬運、Inventory庫存、Motion動作、Waiting等待、Overproduction過量生產、Overprocessing過度加工、Defects缺陷。記憶訣：TIM WOOD或DOTWIMP。"},
{"n":605,"q":"[進階] 「六標準差 DMAIC」中，「量測」(Measure)階段的主要輸出物是？","opts":["A. 改善方案", "B. 已驗證的量測系統、基準線製程能力(Baseline Cpk)、製程地圖", "C. 根本原因清單", "D. 控制計劃"],"ans":"B","expl":"DMAIC各階段輸出：Define=問題定義、項目章程、SIPOC、VOC；Measure=量測系統確認(MSA/GR&R)、基準線製程能力、詳細製程地圖/過程參數；Analyze=根本原因、關鍵輸入變量(KIV)、統計顯著性驗證；Improve=改善方案、實驗設計結果、最佳化方案；Control=控制計劃、SPC管制圖、SOP更新、維持計劃。"},
{"n":606,"q":"[高難] 「田口損失函數」(Taguchi Loss Function)的公式 L(y) = k(y-m)² 中，k的意義是？","opts":["A. 規格寬度", "B. 品質損失係數，由損失金額和規格公差計算得出（k = A₀/Δ²）", "C. 標準差", "D. 製程平均值"],"ans":"B","expl":"田口損失函數：L(y)=k(y-m)²，y=實際值，m=目標值，k=損失係數。k的計算：若y=m+Δ（規格界限）時，社會損失=A₀元，則k=A₀/Δ²。例如：規格公差±0.5mm，超差時維修費$200，則k=200/0.25=800$/mm²。重要涵義：品質不是「在規格內就好」，而是「偏離目標值就有損失」，偏離越大損失越大（拋物線）。這是田口哲學與傳統「合格/不合格」二元觀的根本差異。"},
{"n":607,"q":"[基礎] 「整備時間」(Setup Time)與「週期時間」(Cycle Time)的差異是？","opts":["A. 完全相同", "B. 整備時間=生產前的準備換線時間；週期時間=生產一個單位所需的時間", "C. 週期時間包含整備時間", "D. 整備時間只計算機器，週期時間只計算人工"],"ans":"B","expl":"關鍵時間指標：整備時間(Setup/Changeover Time)=從生產A產品最後一件到開始生產B產品第一件合格品的時間（包含換模、調機、試車）；週期時間(Cycle Time)=連續生產時兩件產品之間的時間間隔（1/生產速率）；節拍時間(Takt Time)=客戶需求速率=可用時間/客戶需求量。精益目標：Cycle Time ≤ Takt Time（供需平衡）。"},
{"n":608,"q":"[進階] 「全面設備效率」(OEE)的三個組成部分分別衡量什麼？","opts":["A. 設備、人員、材料的效率", "B. 可用率（停機損失）× 效能率（速度損失）× 品質率（缺陷損失）", "C. 計劃、實際、理想的差距", "D. 設備投資報酬率"],"ans":"B","expl":"OEE=可用率(Availability)×效能率(Performance)×品質率(Quality)。可用率=實際運作時間/計劃運作時間（排除計劃外停機）；效能率=實際產出/理論最大產出×可用時間（排除速度降低和小停機）；品質率=良品數/總產數（排除缺陷和啟動損失）。世界級OEE≥85%（各項≥90%、95%、99%）。六大損失(Six Big Losses)：設備故障、換模設定、短暫停機、速度降低、啟動缺陷、運作缺陷。"},
{"n":609,"q":"[高難] 「精益六標準差」(Lean Six Sigma)中，精益和六標準差各自解決的核心問題是？","opts":["A. 精益解決成本；六標準差解決品質", "B. 精益消除浪費（速度/流動問題）；六標準差減少變異（品質/準確度問題）", "C. 兩者解決相同問題", "D. 精益用於製造；六標準差用於服務"],"ans":"B","expl":"精益(Lean)和六標準差(6σ)的互補性：精益=速度（消除浪費，縮短前置時間，提高流動效率）；六標準差=品質（減少變異，提高製程能力）。兩者互補不可缺：精益縮短流程暴露問題，六標準差解決深層變異問題。聯合應用：LSS以DMAIC框架加入精益工具（VSM、Kaizen、5S）在Improve階段。"},
{"n":610,"q":"[基礎] 「防錯裝置」(Poka-Yoke)的分類包含？","opts":["A. 只有物理阻擋", "B. 接觸型（形狀/尺寸不符無法裝入）、計數型（確認次數/數量）、順序型（確認步驟順序）", "C. 只用於人工操作", "D. 只適用於最終檢驗"],"ans":"B","expl":"Poka-Yoke（防誤/防呆）類型：①接觸型=利用形狀、大小、顏色防止錯誤組裝（如USB介面的不對稱設計）；②計數型=感測器確認作業次數（如機器計數確認每個孔都鑽到）；③順序型=確保步驟按正確順序（如電腦關機前必須先儲存）。防誤等級：最高=預防型（物理上不可能犯錯）；次之=偵測型（犯錯後立即警示）；最低=事後檢驗。"},
{"n":611,"q":"[進階] 「視覺管理」(Visual Management)最高層次的目標是？","opts":["A. 貼標籤和顏色管理", "B. 任何人在30秒內無需溝通即可判斷現場狀態（正常/異常），並主動觸發糾正行動", "C. 用圖表取代文字", "D. 裝飾工廠環境"],"ans":"B","expl":"視覺管理層次（從低到高）：①信息分享（看板、指示牌）②工作指導（SOP圖示化）③製程管制（生產進度顯示板）④確保合規（紅線/黃線/物品定位）⑤自動觸發行動（Andon系統=問題發生即亮燈停線，現場人員立即響應）。最高層次：透過視覺管理使異常「不可能被忽視」並「自動啟動對策」，實現真正的自動化(Jidoka)。"},
{"n":612,"q":"[高難] 「統計製程管制」在精益生產中的角色是？","opts":["A. 相互排斥，精益不需要SPC", "B. SPC是精益「內建品質」(Built-in Quality/Jidoka)的量化工具，確保製程統計穩定後才建立流動", "C. SPC只用於最終檢驗", "D. SPC和精益分別適用於不同製程"],"ans":"B","expl":"TPS兩大支柱：JIT（及時生產）和Jidoka（自働化/內建品質）。SPC是Jidoka的現代工具：通過管制圖即時監控製程穩定性，在問題發展成缺陷前發出信號，讓操作員停機處理（而非繼續流到下一站）。精益+SPC的綜效：精益縮短流程→更小批量→更快回饋→SPC異常更早發現→加速持續改善。"},
{"n":613,"q":"[基礎] 「標準工時」(Standard Time)的計算公式為？","opts":["A. 觀測時間×評比係數", "B. 正常時間×(1+寬放率)，其中正常時間=觀測時間×評比係數", "C. 最快完成時間", "D. 平均作業時間"],"ans":"B","expl":"標準工時計算：觀測時間（秒錶量測平均值）×評比係數（Performance Rating，評估操作員速度相對標準速度的比率）=正常時間；正常時間×(1+寬放率)=標準工時。寬放包含：個人需求寬放（上廁所等）、疲勞寬放、遲延寬放。標準工時是生產計劃、成本估算、效率評估和OEE計算的基礎。"},
{"n":614,"q":"[進階] 「關鍵鏈項目管理」(Critical Chain Project Management, CCPM)與傳統CPM的主要差異是？","opts":["A. CCPM不使用甘特圖", "B. CCPM考慮資源約束和多任務並行，使用緩衝管理取代個別任務安全時間", "C. CCPM只適用於IT項目", "D. CCPM不需要WBS"],"ans":"B","expl":"CCPM（高德拉特發展）：傳統CPM每個任務都有安全時間→帕金森定律（工作擴張填滿可用時間）→學生症候群（拖到最後才開始）→項目延誤。CCPM解法：消除任務安全時間→集中到「緩衝區」（項目緩衝=Critical Chain末端；接駁緩衝=非Critical路徑接入點）→監控緩衝消耗率管理項目風險。通常縮短25-50%的項目工期。"},
{"n":615,"q":"[高難] 在精益環境中，「一個流」(One-Piece Flow)的實現需要哪些前提條件？","opts":["A. 大型設備和高速生產", "B. 快速換線(SMED)、可靠設備(TPM)、多能工培訓、小型靈活設備，以及客戶穩定需求", "C. 100%自動化", "D. 單一產品線"],"ans":"B","expl":"一個流的實現前提：①SMED=換線快速（小批量可行）②TPM=設備高可靠度（不頻繁故障，否則一個流停線）③多能工(Multi-skilling)=人員可在不同工站支援平衡產能④設備小型化/靈活化（可依Takt Time配置在U形或直線佈局）⑤標準化作業⑥合理的需求節拍。一個流的好處：在製品最少、前置時間最短、品質問題立即發現（只差一件）。"},
{"n":616,"q":"[基礎] 「持續流動」(Continuous Flow)的最大障礙通常是？","opts":["A. 操作員不夠熟練", "B. 設備不可靠（故障、計劃外停機）和過長的換線時間", "C. 品質問題", "D. 原料採購問題"],"ans":"B","expl":"持續流動的殺手：設備故障（使整線停產）和長換線時間（迫使大批量生產）是最常見的障礙。因此TPM（全面生產維護）和SMED（快速換線）是實現精益流動的基礎工具。其他障礙：供應商不穩定、需求波動大、品質問題（需停線）、空間佈局不佳（搬運距離長）。"},
{"n":617,"q":"[進階] 「約束理論」(Theory of Constraints, TOC)中，瓶頸(Bottleneck)的定義是？","opts":["A. 最貴的設備", "B. 產能≤市場需求的資源（限制系統整體產出的約束點）", "C. 最常出問題的設備", "D. 員工最不喜歡的工站"],"ans":"B","expl":"TOC核心（高德拉特）：系統整體產出受最弱環節（瓶頸/約束）限制。5個聚焦步驟：①識別約束→②充分發揮約束（不讓瓶頸閒置）→③讓非約束服從瓶頸（為瓶頸服務，不做無謂優化）→④提升約束能力→⑤回到第一步（避免惰性使新約束出現）。TOC、精益和六標準差的整合：TOC定義改善焦點（瓶頸）→精益消除浪費→六標準差減少變異。"},
{"n":618,"q":"[高難] 「需求平衡化」(Heijunka)的目的是？","opts":["A. 最大化機器使用率", "B. 平滑化生產排程（混流生產），降低需求波動對上游供應商和製程的衝擊", "C. 按顧客訂單批量生產", "D. 自動化排程"],"ans":"B","expl":"Heijunka（平準化）：將不均衡的客戶訂單（如A產品100件/週集中某天，B產品50件/週另一天）分散到每天均勻生產（每天A20件+B10件），配合快速換線(SMED)。好處：①降低對供應商的需求波動（長鞭效應）②使緩衝庫存最小③生產力穩定④容易偵測問題。與「鞭打效應」(Bullwhip Effect)的關係：Heijunka抑制需求信號放大。"},
{"n":619,"q":"[基礎] 「六標準差黑帶」(Black Belt)的主要職責是？","opts":["A. 批准改善項目預算", "B. 全職領導DMAIC改善項目、培訓綠帶、使用統計工具解決複雜問題", "C. 負責日常生產管理", "D. 替代管理階層決策"],"ans":"B","expl":"六標準差角色體系：冠軍(Champion)=高管贊助者，提供資源和消除障礙；主黑帶(MBB)=培訓黑帶，開發方法論；黑帶(BB)=全職，領導重大項目，精通統計；綠帶(GB)=兼職，在本部門推動改善，由黑帶指導；黃帶(YB)/白帶=了解基本概念，參與項目。一個黑帶通常每年帶領3-6個項目，每個項目節省$150,000-$250,000。"},
{"n":620,"q":"[進階] 「控制圖」在DMAIC「控制」階段的功能是？","opts":["A. 探索性分析，發現根本原因", "B. 監控已改善的製程，確保改善成果持久，偵測製程退化", "C. 計算改善前的基準能力", "D. 替代抽樣計劃"],"ans":"B","expl":"控制階段(Control)使用管制圖的目的：改善實施後，SPC管制圖成為「守護成果」的工具，確保製程保持在新的改善水平，及早發現退化趨勢。這與Measure階段（建立基準線）不同。控制階段交接物：控制計劃（含管制圖規格）、更新的SOP、反應計劃（管制圖超出管制界限時的行動步驟）、效益追蹤計劃。"},
{"n":621,"q":"[基礎] ISO 31000:2018 風險管理框架的核心原則中，「整合性」(Integrated)要求？","opts":["A. 風險管理單獨運作", "B. 風險管理整合到組織的所有活動和決策過程中", "C. 只在財務部門執行", "D. 年度一次性風險評估"],"ans":"B","expl":"ISO 31000:2018 八項原則：整合(Integrated)、結構化和全面(Structured & Comprehensive)、客製化(Customized)、包容(Inclusive)、動態(Dynamic)、最佳可用信息(Best Available Information)、人和文化因素(Human & Cultural Factors)、持續改善(Continual Improvement)。「整合」是核心：風險管理不是獨立的活動，而是管理和決策的基本部分，從戰略到運作的所有層面。"},
{"n":622,"q":"[進階] 「BOW-TIE分析」(領結分析)結合了哪兩種風險分析工具？","opts":["A. FMEA和FTA", "B. FTA（故障樹，預防側）和ETA（事件樹，後果側）", "C. HAZOP和FMEA", "D. RCA和PDCA"],"ans":"B","expl":"Bow-Tie分析：中央結=危害事件(Hazard Event)；左側（預防）=FTA邏輯，分析觸發事件的多種原因及其控制措施（威脅屏障）；右側（恢復）=ETA邏輯，分析事件發生後的不同後果及其緩解措施（後果屏障）。直觀優點：一張圖同時展示「為何發生」和「發生後怎樣」，適合溝通風險場景。廣用於石化、航空、食品安全等高風險行業。"},
{"n":623,"q":"[高難] AIAG-VDA FMEA（2019版）相較於舊版FMEA的主要改變是？","opts":["A. 廢除RPN", "B. 引入「行動優先性」(AP)系統（High/Medium/Low），以嚴重度為首要考量，並加入「預防管制」和「偵測管制」的分離評估", "C. 減少欄位數量", "D. 不再需要計算數字評分"],"ans":"B","expl":"AIAG-VDA FMEA 2019主要變化：①AP取代RPN作為優先化工具（S>7時，即使O和D很低，AP仍為High）②將管制措施分為「預防管制」(PC)和「偵測管制」(DC)，O和D分別針對各自管制措施評估③加入「步驟7：結果文件化」④定義了更結構化的表格格式⑤強調FMEA是設計/製程開發的連續性活動，非靜態文件。"},
{"n":624,"q":"[基礎] 「HACCP」(危害分析關鍵控制點)是哪類產業必需的品質/安全系統？","opts":["A. 汽車工業", "B. 食品、飲料、藥品等消費品和食品相關行業", "C. 航太工業", "D. 電子製造業"],"ans":"B","expl":"HACCP（由NASA於1960年代為太空食品開發）現為食品安全的國際標準做法，被FDA、EU和多數國家法規要求。7大原則：①危害分析②識別CCP（關鍵控制點）③建立關鍵限值④建立監控程序⑤建立矯正措施⑥建立驗證程序⑦建立記錄保存系統。現代版：ISO 22000整合HACCP和ISO管理系統要求；FSSC 22000是食品業的ISO認證框架。"},
{"n":625,"q":"[進階] 「風險矩陣」(Risk Matrix)的局限性是？","opts":["A. 只能用於定性評估", "B. 矩陣中的「乘法效應」可能誤導（如高嚴重度×低概率≠低概率×高嚴重度的真實相同風險），且定性評估帶有主觀性", "C. 無法比較不同類型的風險", "D. 不適合小企業"],"ans":"B","expl":"風險矩陣的已知問題（Tony Cox, 2008研究）：①「弱排序」問題：在矩陣中相同格子的不同風險不一定等價②評分者偏差：嚴重度和概率的定性評估主觀性大③最壞格子(高×高)中的風險可能差異懸殊。改善方法：使用定量風險評估(QRA)；建立嚴格的評分準則；校準評分者；補充成本效益分析確認優先序。"},
{"n":626,"q":"[高難] 「HAZOP分析」(危害與可操作性研究)的核心方法是使用引導詞(Guidewords)，以下哪組是標準HAZOP引導詞？","opts":["A. 大/小、快/慢、有/無", "B. MORE/LESS/NO/REVERSE/OTHER THAN/AS WELL AS/PART OF", "C. 高風險/中風險/低風險", "D. 失效/降級/超載"],"ans":"B","expl":"HAZOP標準引導詞（IEC 61882）：NO/NOT（完全缺失）、MORE（數量增加）、LESS（數量減少）、AS WELL AS（額外成分）、PART OF（部分成分缺失）、REVERSE（相反）、OTHER THAN（不同於）。例如：對流量分析→NO Flow（無流量）、MORE Flow（流量過多）、REVERSE Flow（逆流）。HAZOP廣用於化工製程設計審查，由多學科團隊參與，識別設計中的偏差及其後果。"},
{"n":627,"q":"[基礎] 「特殊特性」(Special Characteristics)在IATF 16949中的定義是？","opts":["A. 所有產品特性", "B. 對安全性、法規要求或產品功能有重大影響的特性，需要特別的管制措施", "C. 只包含尺寸特性", "D. 客戶最常測量的特性"],"ans":"B","expl":"特殊特性分類：CC（Critical Characteristic/關鍵特性）=影響安全或法規合規，如汽車轉向系統尺寸、煞車性能；SC（Significant Characteristic/重要特性）=影響功能、配合或製程，需要特別管制但非直接安全。AIAG符號：▽=CC，●=SC（各OEM有不同符號）。對特殊特性的要求：100%檢驗或Cpk≥1.67；在控制計劃中特別標注；PFMEA中重點分析。"},
{"n":628,"q":"[進階] 「邊界圖」(Boundary Diagram)在DFMEA中的作用是？","opts":["A. 定義工廠的物理邊界", "B. 明確FMEA的分析範圍（分析系統的組成，以及與外部系統的界面和交互作用）", "C. 顯示製程流程", "D. 標示危險區域"],"ans":"B","expl":"邊界圖（Block Diagram/系統邊界圖）在DFMEA準備階段建立：①列出系統、子系統、零件層次②識別系統內部和界面（連接點）③識別外部系統（環境、配合件、使用者）。邊界清楚後，DFMEA才能：識別功能、失效模式（功能無法實現）、原因（設計不足）和影響（對上級系統）。P圖（Parameter Diagram/參數圖）進一步識別：信號、控制因子、噪聲因子和響應。"},
{"n":629,"q":"[高難] 「FMEA」中「偵測度」(Detection, D)評分高（如D=9）代表什麼，應如何改善？","opts":["A. 偵測能力強，不需改善", "B. 現行管制措施幾乎無法偵測到失效（偵測能力差），應增加更有效的偵測手段", "C. 失效發生率高", "D. 嚴重度高"],"ans":"B","expl":"AIAG/FMEA偵測評分：1=幾乎確定能偵測（如100%自動防誤檢查）；9-10=幾乎無法偵測（產品出廠後才發現）。降低D值的方法：①增加防誤裝置(Poka-Yoke)②增加量測/測試頻率③使用更靈敏的偵測方法④改善設計使失效模式更易偵測（如增加視窗、監測點）。注意：降低D可降低RPN，但高S的情況下更應優先改善O（降低發生率）或S（設計變更）。"},
{"n":630,"q":"[基礎] 「產品責任」(Product Liability)與「品質保固」(Warranty)的主要差異是？","opts":["A. 完全相同", "B. 品質保固=製造商自願承諾在特定期間修理/替換缺陷品；產品責任=法律義務，缺陷產品造成人身傷害或財產損失的賠償責任", "C. 產品責任只適用於食品", "D. 品質保固期間無產品責任"],"ans":"B","expl":"產品責任理論：嚴格責任（不需證明疏失，只需證明產品缺陷和損害因果關係）、疏失（未盡合理注意義務）、違反保固。品質管理對產品責任的影響：健全的設計FMEA、測試記錄、追蹤性記錄、符合標準等，是產品責任訴訟中的重要抗辯證據。ISO 9001的記錄保存要求部分即基於此考量。"},
{"n":631,"q":"[進階] 「功能安全」(Functional Safety, IEC 61508)中，「安全完整性等級」(SIL)的評定基於？","opts":["A. 產品的市場價值", "B. 危害事件發生的概率×後果嚴重度×暴露時間/迴避可能性=風險，與可容忍風險比較的差距決定所需SIL", "C. 設備的複雜程度", "D. 客戶的安全要求"],"ans":"B","expl":"SIL（安全完整性等級）1-4：SIL1=最低（PFD 10⁻²~10⁻¹）；SIL4=最高（PFD 10⁻⁵~10⁻⁴），PFD=要求時失效概率。評定方法：ALARP（盡可能低的合理可行原則）；風險圖（考慮後果、暴露、迴避可能、需求頻率）；保護層分析(LOPA)。汽車功能安全對應：ISO 26262，使用ASIL（A到D）評級。"},
{"n":632,"q":"[高難] 「FMEA聯繫」(FMEA Linkage)指DFMEA與PFMEA之間的關係是？","opts":["A. 兩者完全獨立", "B. DFMEA的設計失效原因可以成為PFMEA的失效影響；DFMEA中高風險特性應轉為PFMEA的特殊特性，確保製程管制", "C. PFMEA包含DFMEA", "D. 先做PFMEA再做DFMEA"],"ans":"B","expl":"FMEA聯繫的邏輯：DFMEA識別設計特性的風險→高風險設計特性→標注為特殊特性(CC/SC)→特殊特性轉入PFMEA作為重點分析對象→PFMEA分析製造過程如何影響這些特殊特性→高PFMEA風險項→控制計劃的特殊管制措施→SPC監控或100%檢驗。這一連串聯繫確保設計風險在製程中得到充分管制。"},
{"n":633,"q":"[基礎] 「供應鏈風險管理」中，「單一供應商」(Single Sourcing)策略的最大風險是？","opts":["A. 採購成本較高", "B. 供應中斷風險（自然災害、罷工、破產等導致供應完全中斷，無替代來源）", "C. 品質難以控制", "D. 交期難以管理"],"ans":"B","expl":"單一供應商的風險：2011年日本海嘯顯示供應鏈集中的代價（汽車業全球停產）；2020年COVID-19暴露對單一地區/供應商的脆弱性。風險緩解策略：雙重供應商(Dual Sourcing)、在製品庫存緩衝(Safety Stock)、地理多元化、供應商稽核與開發、BCP（業務持續計劃）。BS/ISO 22301（業務持續管理）提供相關框架。"},
{"n":634,"q":"[進階] 「風險接受準則」(Risk Acceptance Criteria)在ISO 31000框架中應如何設定？","opts":["A. 由風險管理部門單獨決定", "B. 由最高管理階層在組織的風險偏好(Risk Appetite)和利益相關者的價值觀基礎上設定", "C. 按照行業慣例固定設定", "D. 不需要明確定義"],"ans":"B","expl":"風險接受準則的設定原則：①反映組織的戰略目標和風險偏好②考慮法規要求和利益相關者期望③用可量化的指標表達（如財務損失閾值、MTBF下限）④定期審查和更新⑤在組織所有層面溝通。ALARP原則（As Low As Reasonably Practicable）：風險應降低到「合理可行的最低水平」，在可容忍區域和廣泛可接受區域之間的中間區域需要在成本和效益間平衡。"},
{"n":635,"q":"[高難] 「應對措施優先化」中，以「成本效益分析」選擇最佳風險對策的關鍵指標是？","opts":["A. 最低成本的對策", "B. 「每降低單位風險的成本」最低，或凈現值(NPV)最高的對策", "C. 最能減少可能性的對策", "D. 最快實施的對策"],"ans":"B","expl":"風險對策選擇框架：對每種對策計算：①實施成本②風險降低量（期望損失的減少=概率×後果）③凈效益=風險降低量-實施成本④成本效益比=風險降低量/實施成本。NPV方法：考慮長期效益和折現率。ALARP分析：若某對策「grossly disproportionate」（明顯不成比例地昂貴）相對於效益，則不強制實施。這是英國HSE和航空安全委員會使用的正式方法。"},
{"n":636,"q":"[基礎] 「5M1E」(六大影響因素)分別代表哪六項？","opts":["A. Man, Machine, Material, Method, Measurement, Environment", "B. Man, Machine, Money, Method, Market, Environment", "C. Man, Machine, Material, Method, Market, Environment", "D. Man, Machine, Material, Management, Measurement, Energy"],"ans":"A","expl":"5M1E（也稱6M）：Man（人員）、Machine（機器設備）、Material（原材料）、Method（作業方法）、Measurement（量測）、Environment（環境）。這6個類別是魚骨圖(石川圖)的標準骨架，用於系統性頭腦風暴識別問題的可能原因。製造業有時加第7個M：Money（資金），稱為7M。服務業可能調整為8P：Price、Promotion、People、Process、Physical evidence、Product、Place、Productivity。"},
{"n":637,"q":"[進階] 「共因失效」在「核電廠安全分析」中的特殊處理方法是？","opts":["A. 增加更多冗余設備", "B. 多樣性設計（不同技術原理、不同製造商）、實體隔離（防火隔牆）、獨立電源和冷卻系統", "C. 降低設計要求", "D. 增加人工監控"],"ans":"B","expl":"核電廠的共模失效防護：多樣性(Diversity)=採用不同物理原理的備用安全系統（如機械式+電氣式，不同廠商），確保單一失效機制不能同時影響所有冗余；實體隔離=防火牆、分隔間，防止火災/洪水的共模效應；獨立性=每個冗余通道有獨立電源、冷卻、控制。這些原則被NRC（美國核管委）規範（10 CFR 50）強制要求，也是IEC 61511（功能安全）的核心概念。"},
{"n":638,"q":"[高難] 在「FMEA」分析中，「設計FMEA」的「失效模式」應以什麼觀點描述？","opts":["A. 製造缺陷的描述", "B. 設計意圖無法實現的具體方式（功能喪失、功能降低、功能間歇、功能過度、非預期功能）", "C. 顧客可觀察到的現象", "D. 失敗的物理機制"],"ans":"B","expl":"DFMEA失效模式的正確描述方式（根據AIAG-VDA 2019）：設計的「功能」無法被滿足的方式，分五類：①完全失去功能(No Function)②功能降低(Degraded Function)③功能間歇(Intermittent Function)④非設計功能(Unintended Function)⑤過度功能(Over Function)。例如：閥門的功能是「阻斷流體」→失效模式：「無法阻斷」（無功能）、「洩漏」（降低）、「時開時關」（間歇）。"},
{"n":639,"q":"[基礎] 「緊急應變計劃」(Emergency Response Plan)中，「演練」(Drill/Exercise)的主要目的是？","opts":["A. 展示給顧客看", "B. 驗證計劃的可行性，訓練人員熟悉應急程序，識別計劃中的不足之處", "C. 應付法規要求", "D. 記錄訓練時數"],"ans":"B","expl":"應急演練類型：桌面演練(Tabletop)=討論式，不需要實際行動；功能演練(Functional)=測試特定職能（如通訊系統）；全規模演練(Full-Scale)=完整模擬，所有系統和人員都參與。NFPA 1600（美國緊急管理標準）和ISO 22301（業務持續管理）均要求定期演練，且每次演練後應進行改善行動追蹤（就像FMEA一樣）。"},
{"n":640,"q":"[進階] 「品質功能展開」(QFD)第一矩陣（產品規劃矩陣/品質屋）中，「屋頂矩陣」(Roof Matrix)的功能是？","opts":["A. 顯示顧客需求的重要性", "B. 顯示工程特性之間的「相關性」（正向或負向衝突），識別需要做工程取捨的地方", "C. 比較競爭對手產品", "D. 計算技術難度"],"ans":"B","expl":"品質屋結構：左牆=顧客需求(VOC)；天花板=工程特性；屋體（關係矩陣）=VOC與工程特性的關係（強/中/弱）；屋頂=工程特性間相關性（正向=兩特性同步改善，如剛性和強度；負向=矛盾，如燃油效率和加速性能）；地下室=目標值、競爭力分析、重要度。屋頂的負向相關提示工程師需要使用TRIZ（創新問題解決理論）或田口方法尋找突破性解。"},
{"n":641,"q":"[基礎] 「常態分布」中，±3σ範圍包含多少百分比的數據？","opts":["A. 68.27%", "B. 95.45%", "C. 99.73%", "D. 99.99%"],"ans":"C","expl":"常態分布重要百分比（必背）：±1σ=68.27%；±2σ=95.45%；±3σ=99.73%；±4σ=99.9937%；±6σ=99.9999998%（即3.4 PPM缺陷）。製程能力與常態分布：Cpk=1.0→±3σ規格，理論上每百萬有2700個缺陷（雙尾）；Cpk=1.33→±4σ；Cpk=1.67→±5σ；Cpk=2.0→±6σ。"},
{"n":642,"q":"[進階] 「韋伯分析」(Weibull Analysis)的主要應用是？","opts":["A. 分析離散型數據", "B. 利用壽命數據估計產品的可靠度分布參數，預測失效時間和規劃預防保養", "C. 測試平均值差異", "D. 建立抽樣計劃"],"ans":"B","expl":"韋伯分析步驟：①收集失效時間數據（含刪失數據/未失效數據）②排序並計算累積失效概率③在韋伯概率紙上繪圖（或用MLE估計參數）④得到β（形狀）和η（特征壽命）⑤計算任意時間點的可靠度R(t)、B10壽命（10%失效時間）。B10壽命是汽車行業常用指標（10%的產品在B10時間前失效），常與保固決策掛鉤。"},
{"n":643,"q":"[高難] 「最大概似估計法」(MLE, Maximum Likelihood Estimation)相較於「矩估計法」(MOM)的優點是？","opts":["A. 計算更簡單", "B. 對不完整數據（刪失數據/Censored Data）處理更佳，且漸進有效（大樣本下最小變異）", "C. 適用於小樣本", "D. 不需要假設分布"],"ans":"B","expl":"MLE vs MOM：MOM=將樣本矩（均值、變異）等同於理論矩求解參數，直觀簡單但效率不高；MLE=最大化似然函數，找出使觀測數據出現概率最大的參數值。MLE優勢：①自然處理刪失數據（壽命測試中未失效的樣本）②大樣本下具有漸進無偏性和最小變異（CRLB最優）③可建立參數信賴區間（Fisher信息矩陣）。韋伯分析、可靠度估計均常用MLE。"},
{"n":644,"q":"[基礎] 「樣本代表性」最重要的保證方式是？","opts":["A. 樣本數量足夠大", "B. 隨機抽樣（使每個個體有相等或已知的被選概率）", "C. 由專家選擇典型樣本", "D. 從最容易取得的位置抽樣"],"ans":"B","expl":"抽樣類型：①簡單隨機抽樣=每個個體等概率被選；②系統抽樣=每k個抽1個（注意週期性偏差）；③分層抽樣=按重要類別分層後各層隨機抽樣；④整群抽樣=隨機選整群（班次/地區）再全查。方便抽樣（只取容易抽到的）和判斷抽樣（主觀選取）不保證代表性，不能進行統計外推，這是最常見的統計謬誤之一。"},
{"n":645,"q":"[進階] 「卡方適合度檢定」(Chi-Square Goodness-of-Fit Test)的目的是？","opts":["A. 比較兩組平均值", "B. 測試觀測數據的頻率分布是否符合特定理論分布（如常態、均勻、泊松）", "C. 分析連續型數據", "D. 估計製程能力"],"ans":"B","expl":"卡方適合度檢定：H₀=數據符合指定分布；統計量χ²=Σ(O-E)²/E，O=觀測頻率，E=期望頻率；自由度=類別數-1-估計參數數。應用：①測試管制圖數據是否符合常態分布②驗證Poisson分布假設（c圖前提）③骰子是否公平。注意：當E<5時，卡方近似不準，需合并類別或改用Fisher精確檢定。"},
{"n":646,"q":"[高難] 「bootstrapping」在統計分析中的應用是？","opts":["A. 一種設備啟動程序", "B. 無需假設數據分布，通過大量有放回重抽樣建立統計量的抽樣分布，用於建立信賴區間", "C. 一種生產排程方法", "D. 只用於大樣本"],"ans":"B","expl":"Bootstrap方法（Efron, 1979）：從樣本中有放回地重抽B次（如B=10,000次），每次計算感興趣的統計量→建立統計量的經驗分布→用百分位數建立信賴區間。優點：不假設常態分布，適合小樣本和複雜統計量（如中位數、相關係數的CI）。在可靠度和機器學習中廣泛應用，是現代計算統計的基礎工具。"},
{"n":647,"q":"[基礎] MIL-STD-1916（美國軍規）的抽樣哲學與MIL-STD-105E的根本差異是？","opts":["A. 兩者相同", "B. MIL-STD-1916基於「零缺陷」哲學，鼓勵預防而非只靠抽樣，並提供優先使用預防的框架", "C. MIL-STD-1916只用於電子產品", "D. MIL-STD-1916的樣本量更小"],"ans":"B","expl":"MIL-STD-1916（1996）取代MIL-STD-105E作為美國國防合約的抽樣標準：①零缺陷理念=任何缺陷都不可接受（接受數Ac=0）②五個偏好優先順序：防誤裝置>SPC>連續抽樣>批次接受抽樣>100%全數檢驗③提供CVD（代碼值）系統調整檢驗嚴格度。相比之下，MIL-STD-105E（現為ISO 2859-1/ANSI Z1.4）接受AQL不等於零的批次。"},
{"n":648,"q":"[進階] ANSI/ASQ Z1.4（MIL-STD-105E的繼承）中，「加嚴檢驗」(Tightened Inspection)的觸發條件是？","opts":["A. 連續5批中有2批被拒絕", "B. 連續2批中有2批或5批中有2批（視版本）被拒絕，即切換到加嚴", "C. AQL超過規定值", "D. 顧客投訴"],"ans":"A","expl":"Z1.4切換規則：由正常(Normal)→加嚴(Tightened)：連續5批中有2批被拒收；加嚴→正常：連續5批全部接受；正常→減量(Reduced)：連續10批都接受+過去生產穩定+主管批准；減量→正常：1批被拒收，或製程不穩定，或接受但不合格品落在接受/拒絕臨界。若加嚴狀態下連續5批以上不能切回正常，應停止生產並改善。"},
{"n":649,"q":"[高難] 「概率比序貫檢定」(Probability Ratio Sequential Test, PRST)的優點是？","opts":["A. 固定樣本量，計算簡單", "B. 可在確定性達到前提早終止（批次品質很好或很差時），平均所需樣本量(ASN)低於固定樣本抽樣", "C. 適合所有類型的數據", "D. 不需要設定AQL"],"ans":"B","expl":"序貫概率比檢定(Wald, 1947)：不事先固定樣本量，每個樣本後計算概率比並決定：接受/拒絕/繼續抽樣。優點：批次品質極好或極差時，提早達到決策，節省平均50%的樣本量(ASN比固定樣本計劃低)。缺點：最大可能樣本量不固定（理論上無上限），在製程邊界品質時樣本量最大。多用於醫藥臨床試驗的中期分析。"},
{"n":650,"q":"[基礎] 「製程能力指數」Cpk 的最低可接受值，在一般工業應用中通常為？","opts":["A. Cpk ≥ 0.67", "B. Cpk ≥ 1.00", "C. Cpk ≥ 1.33", "D. Cpk ≥ 2.00"],"ans":"C","expl":"行業標準Cpk要求：Cpk≥1.00=最低及格（製程在規格內，但幾乎沒有安全餘量）；Cpk≥1.33=一般工業要求（±4σ，每百萬約64個缺陷）；Cpk≥1.67=IATF 16949/汽車業對特殊特性的要求（±5σ）；Cpk≥2.00=六標準差目標（±6σ，短期）。AIAG PPAP要求初始製程研究：Cpk≥1.67接受，1.33-1.67需顧客批准，<1.33不接受。"},
{"n":651,"q":"[進階] 「假設檢定」中，「統計顯著性」與「實際顯著性」的差異說明了什麼？","opts":["A. 兩者等同", "B. 大樣本時統計上顯著（p<0.05）的差異可能實際意義很小（Effect Size小），需同時考慮效果量", "C. 實際顯著性比統計顯著性更重要", "D. 只有p值決定是否採取行動"],"ans":"B","expl":"統計顯著 ≠ 實際重要：以製程改善為例，n=10,000時，平均值改善0.001mm也可能p<0.0001（統計高度顯著），但實際上0.001mm可能遠小於量測精度，改善毫無實際意義。效果量指標：Cohen's d（均值差的標準化量測）；Eta²（ANOVA中因子解釋的變異比例）；Practical significance threshold應由工程/業務需求決定，不應只看p值。"},
{"n":652,"q":"[高難] 「Box-Cox轉換」的目的是？","opts":["A. 增加數據點", "B. 將非常態分布的數據轉換為近似常態分布，以便使用基於常態假設的統計方法", "C. 降低離群值影響", "D. 合并小樣本"],"ans":"B","expl":"Box-Cox轉換：y'=（yᵏ-1）/λ（λ≠0時），或y'=ln(y)（λ=0時）。最優λ值通過最大化似然函數確定。常見λ值：λ=0→對數轉換（右偏正數據）；λ=0.5→平方根轉換（泊松分布）；λ=-1→倒數轉換。轉換後應用管制圖或能力分析，但報告結果需轉回原始單位解讀。也可用Johnson轉換系統或Yeo-Johnson轉換（允許零和負數）。"},
{"n":653,"q":"[基礎] 「信賴區間」寬度受哪些因素影響？","opts":["A. 只受樣本量影響", "B. 樣本量n（越大越窄）、總體變異σ（越大越寬）、信賴水準（越高越寬）", "C. 只受總體變異影響", "D. 只受信賴水準影響"],"ans":"B","expl":"信賴區間（CI）寬度：CI = X̄ ± z×σ/√n。縮窄CI的方法：①增加樣本量n（效果：寬度∝1/√n，需增4倍n才能使寬度減半）②降低信賴水準（由99%改為90%，但犧牲精確度）③減少總體變異（通過製程改善降低σ）。總體標準差未知時用s（樣本標準差）和t分布，n小時t分布比z分布更寬（考慮了估計s的不確定性）。"},
{"n":654,"q":"[進階] 「Kruskal-Wallis檢定」是哪種情況下使用的統計方法？","opts":["A. 比較兩組連續型數據的均值", "B. 比較三組或以上的數據中位數（單因子ANOVA的非參數替代方法）", "C. 分析類別數據的獨立性", "D. 測試常態性"],"ans":"B","expl":"非參數統計檢定選用：①兩組比較→Mann-Whitney U檢定（t檢定的非參數版）；②三組以上→Kruskal-Wallis檢定（One-way ANOVA非參數版）；③重複測量→Friedman檢定（重複測量ANOVA非參數版）；④相關性→Spearman秩相關（Pearson相關非參數版）。適用時機：數據嚴重偏態、順序尺度、小樣本且無法假設常態分布。"},
{"n":655,"q":"[高難] 「多變量管制圖」T²（Hotelling's T²管制圖）相較於個別管制多個變量的優點是？","opts":["A. 計算更簡單", "B. 考慮變量間的相關結構，提供整體製程狀態的單一統計量，避免多重比較的假陽性問題", "C. 需要更少的數據", "D. 不需要假設常態分布"],"ans":"B","expl":"多重管制圖問題：若同時監控10個變量，各自用99.73%管制界限（α=0.27%），整體誤報率=1-(1-0.0027)^10≈2.7%，遠高於預期。T²管制圖：同時監控多個相關變量，整體α仍為設定值（如0.27%），且考慮變量間的共變異數矩陣（相關結構）。當T²超出管制界限時，可用分解方法識別是哪個（些）變量的異常導致。廣用於化工、製藥的連續製程監控。"},
{"n":656,"q":"[基礎] 「散佈圖」中，兩個變量相關係數r接近0但散佈圖顯示明顯曲線關係，說明？","opts":["A. 兩者無關", "B. Pearson相關係數只量測線性相關，非線性關係可能被遺漏，應進行回歸分析或用Spearman相關", "C. 數據有錯誤", "D. 樣本量不足"],"ans":"B","expl":"Pearson相關係數r的局限：只量測線性(linear)單調關係的強度和方向。反例：y=x²（拋物線），在x從-a到+a範圍：r≈0，但關係非常強（且確定）。解決方案：①視覺化散佈圖（不能只看r）②Spearman秩相關（量測任何單調關係）③非線性回歸④多項式回歸。「Anscombe四重奏」是著名示範，4組不同形態的數據有幾乎相同的均值、變異數和r值。"},
{"n":657,"q":"[進階] 「重複性與再現性」(GRR)研究中，「操作員×零件交互作用」(Operator × Part Interaction)顯著代表？","opts":["A. 操作員比零件更重要", "B. 不同操作員對不同零件的量測產生不一致的偏差模式（某操作員量測某種零件偏高，另一零件偏低）", "C. 操作員技能不足", "D. 量測設備故障"],"ans":"B","expl":"GRR交互作用（在ANOVA分析法中可偵測，傳統Range法不能）：若操作員A對大零件的量測系統偏高，對小零件偏低，而操作員B則反之→交互作用顯著。這表示量測系統受到「操作員+零件組合」的影響，不僅是兩者的獨立加成效果。處理方式：加強培訓標準化量測程序；改善工件夾持方式；改進量測設備設計（減少主觀判斷）。"},
{"n":658,"q":"[高難] 「製程潛在能力指數」(Pp)與「製程能力指數」(Cp)的計算差異，以及選用時機？","opts":["A. 完全相同，只是名稱不同", "B. Pp=整體標準差(σ_overall)計算，包含所有變異源；Cp用σ_within(組內)估計，Pp用於長期/整體評估，Cp用於短期/潛在評估", "C. Pp只用於非常態數據", "D. Cp是Pp的改善版本"],"ans":"B","expl":"深入比較：σ_within（Cp用）=R̄/d₂或S̄/c₄，只反映子組內（短期）隨機變異，排除子組間差異（如批次間、班次間）；σ_overall（Pp用）=√[Σ(xi-x̄)²/(n-1)]，包含所有變異來源。Cp≥Pp（因σ_within≤σ_overall）；Cp>>Pp表示有大的批次間或長期漂移問題。選用：初始製程研究（PPAP）通常要求Ppk≥1.67（整體性能）；穩定製程的日常監控用Cpk；Ppk是對外報告的能力指標。"},
{"n":659,"q":"[基礎] 「直方圖」(Histogram)中，「雙峰分布」(Bimodal Distribution)通常暗示？","opts":["A. 製程非常穩定", "B. 數據來自兩個不同的分布（如兩台設備、兩班次、兩種原料），需要分層分析", "C. 規格設定有問題", "D. 數據量不足"],"ans":"B","expl":"直方圖形狀診斷：①鐘形/對稱=可能近似常態，製程穩定；②右偏（正偏態）=大值出現較少（如壽命、成本）；③左偏=小值出現較少（如純度%）；④雙峰=兩個分布混合（需層別分析，找出兩峰的差異因素）；⑤高原形=均勻分布；⑥「梳子形」=間隔一個無資料=數據分組方式問題或週期性現象；⑦截斷形=100%全數篩選後的數據（合格品只剩截斷分布）。"},
{"n":660,"q":"[進階] 「二項式分布」n=100，p=0.05 的期望值和標準差分別為？","opts":["A. E=5, SD=0.475", "B. E=5, SD=2.179", "C. E=5, SD=4.75", "D. E=0.5, SD=0.475"],"ans":"B","expl":"二項分布：E[X]=np=100×0.05=5；Var[X]=np(1-p)=100×0.05×0.95=4.75；SD=√4.75≈2.179。當n很大且np≥5且n(1-p)≥5時，二項分布可用常態分布近似（連續性校正）；當n大且p小時，可用泊松分布近似（λ=np=5）。np管制圖正是基於二項分布，管制界限=np±3√(np(1-p))。"},
{"n":661,"q":"[基礎] 「螢光滲透探傷」(Fluorescent Penetrant Testing)比「著色滲透探傷」的優點是？","opts":["A. 成本更低", "B. 在紫外線（黑燈）下靈敏度更高，可偵測更微細的缺陷", "C. 可偵測內部缺陷", "D. 不需要清潔"],"ans":"B","expl":"PT（滲透探傷）兩種類型：著色PT（紅色滲透液，白色顯像劑，白光觀察，可見對比）；螢光PT（螢光滲透液，UV/黑光下觀察，亮黃綠色缺陷指示，靈敏度高約10倍）。PT只能偵測「開放到表面」的缺陷（裂紋、折疊、氣孔），不能偵測內部缺陷（需UT或RT）。適用材料：非磁性金屬（鋁、鈦、銅）和非金屬（陶瓷、塑膠），磁性材料則優先考慮MT。"},
{"n":662,"q":"[進階] 「超音波探傷」(UT, Ultrasonic Testing)的「A掃描」(A-scan)顯示的信息是？","opts":["A. 缺陷的3D影像", "B. 超音波脈衝的幅度對時間（距離）的波形，從中判斷缺陷位置和大小", "C. 材料厚度分布圖", "D. 表面形貌"],"ans":"B","expl":"UT掃描模式：A掃描=波形圖（幅度vs時間），顯示入射波、缺陷回波、底波的位置和幅度；B掃描=截面影像（側視圖），掃描線沿一個方向移動，顯示深度分布；C掃描=俯視平面圖，掃描整個面積，顯示缺陷的俯視投影；D掃描=前視圖（End view）。相控陣超音波(PAUT)=多元素換能器可電子掃描，一次得到多個角度數據，大大提高效率。"},
{"n":663,"q":"[高難] 「渦流探傷」(ET, Eddy Current Testing)的「提離效應」(Lift-off Effect)是指？","opts":["A. 探頭與工件距離增加使信號強度下降，干擾缺陷判讀", "B. 探頭壓力過大的效果", "C. 工件溫度的影響", "D. 頻率選擇不當的影響"],"ans":"A","expl":"ET提離效應：渦流探頭與導電工件表面距離（提離距離）變化時，感應電流和探頭阻抗顯著變化，在阻抗圖上沿「提離曲線」移動，會掩蓋真實缺陷信號。緩解方法：①彈簧加壓保持恆定接觸距離②使用對提離效應不敏感的探頭配置③在不同頻率下分離缺陷信號和提離信號（多頻ET）④使用旋轉探頭（自動化）保持距離恆定。"},
{"n":664,"q":"[基礎] 「磁粉探傷」(MT, Magnetic Particle Testing)只適用於哪類材料？","opts":["A. 所有金屬", "B. 鐵磁性材料（鐵、鋼、鎳、鈷及其合金）", "C. 非金屬材料", "D. 銅和鋁合金"],"ans":"B","expl":"MT原理：施加磁場使鐵磁性材料磁化；在表面或近表面缺陷處，磁力線洩漏（漏磁場）；磁粉（乾粉或濕懸浮液）被漏磁場吸附，顯示缺陷形狀。限制：①只適用於鐵磁性材料（不適用於奧氏體不銹鋼、鋁、銅、鈦等）②主要偵測表面和近表面缺陷（深度<6mm）③需要退磁處理（去除殘磁）④缺陷必須有足夠的漏磁場（缺陷方向與磁場方向垂直時最敏感）。"},
{"n":665,"q":"[進階] 「放射線探傷」(RT, Radiographic Testing)中，缺陷的可偵測性主要取決於？","opts":["A. 工件尺寸", "B. 缺陷對X射線的吸收差異（取決於缺陷的體積密度差和方向性）", "C. 操作員經驗", "D. 射線源強度"],"ans":"B","expl":"RT缺陷顯像原理：X射線或γ射線穿過工件時，缺陷（氣孔、夾渣等）密度低→吸收少→底片曝光多→底片顯示深色影像。可偵測性關鍵：①缺陷方向：縱向（與射線方向平行）最難偵測，橫向（垂直射線）最易；②厚度差：通常≥工件厚度的2%才可偵測；③幾何清晰度（源大小、源距離、工件-底片距離）。RT對體積型缺陷（氣孔、夾渣）好，對薄型缺陷（裂紋，若與射線方向平行）較差。"},
{"n":666,"q":"[高難] 「相控陣超音波」(PAUT)的技術優勢包括？","opts":["A. 成本低廉", "B. 電子掃描（無需機械移動探頭）、多角度同步掃描、即時成像（S掃描或扇形掃描）、提高效率和缺陷定量精度", "C. 只用於薄板", "D. 不需要校準"],"ans":"B","expl":"PAUT（相控陣超音波）原理：多個換能器元素（16-256個）用電子延遲控制激發時序，合成可控制角度和焦點的超音波束。優點：①扇形掃描(S-scan)=一次掃描覆蓋多個角度，相當於多個傳統UT探頭②快速（電子掃描不需移動探頭）③更好的缺陷定量和定性③可即時建立2D截面影像④適合複雜幾何形狀。已逐漸取代傳統射線照相用於焊縫檢驗（更安全，無放射性）。"},
{"n":667,"q":"[基礎] 「硬度測試」中，「布氏硬度」(Brinell Hardness, HB)的壓頭是？","opts":["A. 金剛石圓錐", "B. 淬硬鋼球或碳化鎢球", "C. 正四棱錐金剛石", "D. 正方形底金剛石錐"],"ans":"B","expl":"硬度測試壓頭比較：布氏(HB)=鋼球或碳化鎢球，測量壓痕直徑，適合軟材料；洛氏(HR)=金剛石圓錐（HRC）或鋼球（HRB），測量壓痕深度，速度快（工廠常用）；維氏(HV)=正四棱錐金剛石，測量對角線，全範圍適用，可用小壓痕；努氏(HK)=細長四棱錐金剛石，適合薄膜或硬化層；肖氏(Shore)=回彈型，適合橡膠。各硬度值有近似換算公式（ASTM E140）。"},
{"n":668,"q":"[進階] 「自動光學檢測」(AOI, Automated Optical Inspection)在PCB製造中的主要功能是？","opts":["A. 測試電路連通性", "B. 利用機器視覺系統偵測元件缺失/錯位、焊錫橋接、少錫、錯件等外觀缺陷", "C. 測量PCB翹曲度", "D. 測試訊號完整性"],"ans":"B","expl":"AOI在PCB製程：①偵測類型：元件缺失、元件極性錯誤、錯件、偏移、焊錫橋接(Short)、少錫(Open)、假焊等②系統組成：高分辨率CCD攝像頭+LED多角度照明+影像處理軟體+CAD數據比對③出現位置：錫膏印刷後(SPI)、插件後、回焊後（最常用）④過殺率(False Call Rate)和漏檢率(Escape Rate)是AOI的關鍵績效指標。與ICT（在電路測試）互補使用。"},
{"n":669,"q":"[高難] 「坐標量測機」(CMM)的「探針校正」(Probe Qualification/Calibration)包含哪些內容？","opts":["A. 只校正探針的直徑", "B. 確定探針末端球的有效直徑(R_eff)、探針末端相對於旋轉中心的偏置向量，並補償探針撓曲誤差", "C. 只校正X、Y、Z軸", "D. 量測探針的力"],"ans":"B","expl":"CMM探針校正（使用參考球）：①找R_eff（探針末端有效半徑，考慮探針系統的幾何偏差）②找探針中心坐標（相對於主探針或旋轉中心，用於多探針切換的位置補償）③評估探針的「形態誤差」（探針末端的非圓性）④星形探針需分別校正每個方向的探針。R_eff補償：CMM量測時從接觸點延探針方向縮回R_eff，得到工件表面真實點坐標。不準確的R_eff導致系統誤差。"},
{"n":670,"q":"[基礎] 「量測追溯紀錄」在品質稽核中的重要性是？","opts":["A. 只是行政作業", "B. 證明量測數據的有效性（量具已校準且溯源至SI），支持品質決策的可信度，並在爭議時提供法律證據", "C. 只在顧客要求時需要", "D. 只適用於實驗室"],"ans":"B","expl":"量測追溯要求（ISO 9001 7.1.5和ISO/IEC 17025）：校準記錄應包含：①量具識別（型號、序號）②校準日期和下次校準日期③校準結果（量測不確定度）④校準機構（ILAC/TAF認可）⑤溯源至SI的聲明。記錄保存期：通常為量具壽命+若干年（或顧客/法規要求）。品質爭議時，量測記錄是判定產品合格性的關鍵證據。"},
{"n":671,"q":"[進階] 「X射線螢光分析」(XRF, X-Ray Fluorescence)在品質管理中的應用是？","opts":["A. 偵測金屬裂紋", "B. 非破壞性分析材料元素組成（成分分析、RoHS有害物質篩選、鍍層厚度量測）", "C. 表面粗糙度量測", "D. 硬度測試"],"ans":"B","expl":"XRF工作原理：X射線激發工件材料原子內層電子→外層電子填補→發射特征X射線（各元素特征波長不同）→偵測分析元素種類和含量。品質應用：①RoHS有害物質快速篩選（鉛、鎘、汞等）②合金材料成分驗證③鍍層厚度和成分分析（鍍金、鍍鉻、鍍鎳）④礦石/原料品質控制。優點：非破壞性、快速（<1分鐘）、可同時分析多種元素。局限：對輕元素（Be、B、C、N）靈敏度低；不能分析相結構（需XRD）。"},
{"n":672,"q":"[高難] 「GD&T」中「全跳動」(Total Runout)與「圓跳動」(Circular Runout)的差異是？","opts":["A. 完全相同", "B. 圓跳動只控制每個截面的跳動（2D）；全跳動同時控制整個表面（包括截面和沿軸向），是更嚴格的複合公差", "C. 全跳動只適用於端面", "D. 圓跳動比全跳動更嚴格"],"ans":"B","expl":"跳動公差比較：圓跳動（Circular Runout）=每個截面分別量測，探針在固定軸向位置旋轉一圈，指示器讀值範圍即為該截面跳動量；全跳動（Total Runout）=探針在整個表面掃描（旋轉+軸向移動），整個表面所有點相對於基準軸的最大偏差。全跳動>圓跳動（因為全跳動包含圓度+同軸度+圓柱度所有誤差）。量測：使用旋轉夾具加指示表（圓跳動），或CNC CMM（全跳動）。"},
{"n":673,"q":"[基礎] 「外觀品質標準」(Visual Quality Standard)中，「限度樣品」(Limit Sample/Boundary Sample)的功能是？","opts":["A. 作為製程的標準品", "B. 定義可接受/不可接受的外觀邊界，統一不同檢驗員的判斷標準", "C. 用於破壞性測試", "D. 替代書面規格"],"ans":"B","expl":"限度樣品（也稱界限樣品）類型：①OK/NG邊界樣品=剛好在合格/不合格邊界的實物樣品②Positive/Negative樣品=明確合格或不合格的參考樣品③金樣品(Golden Sample)=完美無缺的理想樣品。用途：外觀瑕疵（刮傷、色差、縮水）的目視檢驗標準化；訓練新進檢驗員；解決顧客/供應商爭議。管理要求：需顧客批准（PPAP AAR）；定期更換（以免老化）；防止污損/損壞；明確標識和管制。"},
{"n":674,"q":"[進階] 「材料試驗」中，「拉伸測試」(Tensile Test)的「工程應力-應變曲線」中，「頸縮」(Necking)現象代表？","opts":["A. 材料開始彈性變形", "B. 局部截面積急速縮小，真應力繼續增加，但工程應力（基於原始截面積）開始下降，直到斷裂", "C. 材料達到最大承載力", "D. 降伏強度點"],"ans":"B","expl":"拉伸曲線重要點：①比例限(Proportional Limit)=應力-應變線性關係終點②彈性限③降伏強度(Yield Strength, σy)=0.2%offset method④抗拉強度(UTS)=工程應力最高點，此後頸縮開始⑤斷裂強度。頸縮(Necking)：UTS後，材料局部產生明顯收縮→局部面積急減→真應力繼續上升→工程應力（F/A₀）因面積相對減小而下降→斷裂。真應力vs工程應力：真應力始終上升（strain hardening直到斷裂）。"},
{"n":675,"q":"[高難] 「測試計劃」(Test Plan)的「等效性確認」(Equivalency Validation)在哪種情況下需要？","opts":["A. 每次測試都需要", "B. 更換測試方法、設備或場地時，需確認新方法與原認可方法具有等效的測試結果", "C. 供應商要求時", "D. 只在第三方實驗室"],"ans":"B","expl":"等效性確認（Method Transfer）的情境：①實驗室從一個地點搬到另一個地點②換用新型設備替代舊設備③使用替代測試方法（如用XRF替代濕法化學分析）④換用不同品牌的試劑/耗材。確認方法：同樣一批樣品在兩種方法下測試，統計比較（t檢定、相關性分析）；FDA對製藥和醫療設備的測試方法轉移有嚴格的文件和統計要求（USP章節<1224>）。"},
{"n":676,"q":"[基礎] 「光學投影儀」(Optical Comparator/Profile Projector)的量測原理是？","opts":["A. 接觸式量測", "B. 將工件輪廓放大投影到螢幕上，與標準圖形或直接量測投影像的尺寸", "C. 雷射掃描", "D. 超音波量測"],"ans":"B","expl":"光學投影儀（輪廓儀）：使用光源+工件+精密光學系統，將工件輪廓影像放大（通常10-100倍）投射到毛玻璃螢幕或CCD屏幕。量測方法：①疊加比對法：將放大的工件輪廓與標準圖（Chart）疊合，直接判斷符合程度；②直接量測法：在螢幕上量測影像尺寸，除以放大倍率得到真實尺寸。適合：小型複雜輪廓（螺紋、鍵槽、凸輪、刀具）的快速非接觸量測。"},
{"n":677,"q":"[進階] 在「非破壞性測試」選用原則中，對於「薄板焊縫的表面裂縫」，最優先選用的方法是？","opts":["A. 超音波探傷(UT)", "B. 磁粉探傷(MT)（鐵磁性）或滲透探傷(PT)（非鐵磁性），因為靈敏度高、對表面缺陷有效且操作簡便", "C. 放射線探傷(RT)", "D. 渦流探傷(ET)"],"ans":"B","expl":"NDT選用指引（表面缺陷）：MT=鐵磁性材料表面/近表面，靈敏度最高（比PT高）；PT=所有非多孔材料表面開口缺陷，不受材料電磁性限制；UT=適合內部體積型缺陷，對薄板表面裂紋（方向平行射線束）靈敏度較差；RT=適合體積型缺陷（氣孔、夾渣），對裂紋方向有要求；ET=表面和近表面，特別適合管材和棒材的快速掃描。選擇時考慮：材料性質+缺陷類型+位置+工件幾何+成本+可接近性。"},
{"n":678,"q":"[高難] 「視覺系統」(Machine Vision System)在品質控制中的「靈敏度」與「特異性」取決於？","opts":["A. 只取決於相機解析度", "B. 演算法的閾值設定（高閾值→高特異性/低靈敏度，低閾值→高靈敏度/低特異性），以及照明和光學系統的品質", "C. 工廠環境溫度", "D. 視覺系統品牌"],"ans":"B","expl":"機器視覺的ROC曲線/混淆矩陣：靈敏度(Sensitivity)=True Positive Rate=TP/(TP+FN)（偵測到真缺陷的比率）；特異性(Specificity)=True Negative Rate=TN/(TN+FP)（正確接受良品的比率）。靈敏度和特異性存在tradeoff：降低判定閾值→更容易判為NG→靈敏度↑（減少漏檢），但特異性↓（增加誤判/過殺）。最佳閾值取決於漏檢和誤判的相對成本，通常用Youden Index（靈敏度+特異性-1最大化）或成本最小化來選取。"},
{"n":679,"q":"[基礎] 「測試設備校驗」周期決定的主要依據是？","opts":["A. 固定每年一次", "B. 設備使用頻率、歷史穩定性（前次校準結果）、環境條件、製造商建議及相關法規要求", "C. 設備採購成本", "D. 客戶要求"],"ans":"B","expl":"校驗周期優化（ISO 17025 6.4.1/ISO 9001 7.1.5）：不應機械地固定為「每年一次」，而應動態調整：①若設備穩定且長期校準結果良好→可延長校準間隔（減少成本）②若設備常出現超差或使用頻繁→縮短校準間隔③高溫/振動環境→縮短間隔④法規或顧客合同有明確要求→必須遵守。超過校驗期仍繼續使用→需追溯影響分析，評估和處理此期間的量測數據有效性。"},
{"n":680,"q":"[進階] 「計量」(Metrology)中，「國家量測標準」與「工作量規」之間的「傳遞不確定度」(Transfer Uncertainty)概念是指？","opts":["A. 更換量規的搬運風險", "B. 每一級校準引入的不確定度都會傳遞累積到下一級，工作量規的不確定度是整條溯源鏈上所有不確定度的合成", "C. 量規溫度傳導", "D. 數字傳輸的誤差"],"ans":"B","expl":"溯源鏈的不確定度累積：每下一級校準，不確定度因新增的隨機和系統誤差而增加。例如：SI（公尺的定義）→BIPM（國際計量局）→NMI（各國國家計量院）→校準實驗室→工廠參考標準→工作量規。通用規則：工作量規的不確定度應不超過被量測特性公差的1/10（稱為「4:1法則」或「10:1法則」）。完整的不確定度評估應考慮整條溯源鏈的合成不確定度，而非只看最後一次校準的不確定度。"},
{"n":681,"q":"[基礎] 「製程稽核」時，發現操作員未按SOP操作，應如何判定和建議？","opts":["A. 立即記錄主要不符合，停線", "B. 確認是否有SOP/訓練記錄，結合頻率和影響評估嚴重性，可能為次要不符合，建議追查系統原因（如訓練不足、SOP不合理）", "C. 忽略，屬於個人行為", "D. 直接罰款操作員"],"ans":"B","expl":"稽核員的判斷思維：單一操作員偶發未按SOP→可能是次要不符合（Minor NC）；若多人、多次、系統性不按SOP→可能為主要不符合（Major NC）。根本原因探討：SOP是否合理可行？操作員是否曾接受培訓？是否有績效監控？稽核不應停留在「人的問題」，應追查系統和管理原因。記錄客觀事實，不臆測動機。"},
{"n":682,"q":"[進階] 「6M魚骨圖」分析後應如何確認真正根本原因？","opts":["A. 團隊投票選出最可能的原因", "B. 使用統計工具（如假設檢定、DOE、回歸分析）或物理驗證（重現失效/修復後確認消失）驗證根因假設", "C. 請最有經驗的人判斷", "D. 選擇最容易修正的原因"],"ans":"B","expl":"魚骨圖+5-Why只是「假設產生工具」，不能確認根本原因。驗證方法：①統計方法：相關分析、配對t檢定（改善前後）、DOE（確認因子顯著性）②工程驗證：模擬/重現失效（在假設原因下，失效是否出現？）、修復後確認（消除假設原因後，失效是否消失？）③生產驗證：在小批量試生產中確認。「可以通過消除這個原因來防止問題再次發生」是根本原因確認的黃金準則。"},
{"n":683,"q":"[高難] 「統計容差分析」(Statistical Tolerancing)相較於「最壞情況容差分析」(Worst-Case Tolerancing)的主要優點是？","opts":["A. 保證100%組裝性", "B. 基於概率，允許更寬鬆的零件公差，降低製造成本，同時接受極低概率的組裝失效", "C. 計算更簡單", "D. 不需要了解製程能力"],"ans":"B","expl":"容差分析比較：最壞情況法=所有零件同時在公差極限，Δ_total=Σ|δᵢ|，確保100%組裝，但公差嚴格（成本高）；RSS統計法=假設各零件尺寸獨立且近似正態，Δ_total=√(Σδᵢ²)，公差可比最壞情況寬√n倍，但接受1-6sigma的組裝失效風險（視κ係數設定）。選用原則：安全關鍵→最壞情況法；大批量消費品→統計法（接受極低失效率以降低成本）。"},
{"n":684,"q":"[基礎] 「產品追溯性」(Traceability)系統在品質管理中的主要功能是？","opts":["A. 加速生產流程", "B. 識別和追蹤產品從原料、生產、直至交付及使用的完整歷程，支援問題調查、召回和產品責任", "C. 降低成本", "D. 提高生產速度"],"ans":"B","expl":"追溯性的兩個方向：正向追溯（Traceforward）=原料批號→使用在哪些成品→發往哪些顧客（用於召回決策）；反向追溯（Traceback）=問題成品→使用哪個批次原料→哪個班次/設備生產（用於根因調查）。重要性：問題發現後縮小召回範圍（從「全面召回」到「特定批次召回」節省巨大成本）；法律責任舉證（能證明問題發生在供應商）；ISO 9001 8.5.2要求。"},
{"n":685,"q":"[進階] 「設計變更管理」(Engineering Change Management)中，「影響分析」(Impact Analysis)必須考慮哪些層面？","opts":["A. 只考慮直接設計影響", "B. 設計/繪圖更新、FMEA更新、製程重新確認、試驗要求、PPAP重新提交、材料/採購影響、成本影響和顧客通知", "C. 只考慮成本", "D. 只需要工程主管批准"],"ans":"B","expl":"設計變更影響分析（ECO/ECR流程）：①工程文件：圖面、BOM、規格書②品質文件：DFMEA、PFMEA、控制計劃、量測計劃③製程：製程參數、夾具、工裝④試驗：需重新做哪些驗證測試？⑤供應鏈：零件採購、供應商是否需要確認⑥顧客：是否需要顧客批准（PPAP重新提交）⑦庫存：舊版零件的處置。IATF 16949要求所有工程變更都需要有效的影響評估和適當的顧客批准。"},
{"n":686,"q":"[高難] 「品質門」(Quality Gate/Phase Gate Review)在產品開發中的作用是？","opts":["A. 記錄開發歷程", "B. 在每個開發階段結束時，對照預定準則（技術成熟度、品質要求、財務指標）正式評審，決定是否進入下一階段", "C. 分配開發預算", "D. 替代設計審查"],"ans":"B","expl":"品質門（Stage-Gate® 模型）：將開發流程分成若干階段（Idea→Scoping→Development→Testing→Launch），每個階段結束有「門審」(Gate Review)。審查維度：①技術準備度(TRL)②品質要求達成度③財務指標（預期ROI）④風險水平⑤資源需求。優點：強迫明確的Go/Kill/Hold決策，避免劣質項目消耗大量資源到後期才被放棄（此時修改成本最高）。與APQP的交互：APQP5個階段可對應到Stage-Gate的各個門。"},
{"n":687,"q":"[基礎] 「品質成本」(CoQ)分析中，「外部失效成本」的典型案例包含？","opts":["A. 廢品和返工", "B. 顧客投訴處理、保固維修、退貨、產品召回和商譽損失", "C. 內部測試和檢驗", "D. 訓練課程費用"],"ans":"B","expl":"品質成本四大類：①預防成本(Prevention)：訓練、FMEA、SPC系統建置、供應商開發→設計以不發生缺陷；②鑑定成本(Appraisal)：檢驗、測試、量測設備校準→確認符合要求；③內部失效(Internal Failure)：廢品、返工、再測試、工程分析→出廠前發現；④外部失效(External Failure)：顧客投訴、保固、召回、產品責任訴訟、商譽損失→顧客端發現（最昂貴）。CoQ目標：增加預防投資，大幅降低失效成本，整體CoQ下降。"},
{"n":688,"q":"[進階] 「新工廠/新生產線」的「工廠驗收測試」(FAT, Factory Acceptance Test)和「現場驗收測試」(SAT, Site Acceptance Test)的差異是？","opts":["A. 完全相同", "B. FAT=在製造商工廠驗收設備（在理想環境下測試功能和性能）；SAT=在客戶現場安裝後驗收（測試在實際環境條件下的性能）", "C. FAT是強制性的；SAT是可選的", "D. FAT測試安全；SAT測試品質"],"ans":"B","expl":"FAT vs SAT：FAT在設備交貨前在供應商工廠執行：①功能測試（依照規格書）②性能測試（速度、精度）③安全測試④文件完整性⑤人員培訓。SAT在客戶現場安裝、連接生產系統後：①重複關鍵FAT測試項目②整合測試（與上下游設備配合）③生產試運行（用實際產品測試）④最終驗收/付款依據。差異來源：工廠環境（電源品質、振動、溫濕度）與現場不同，SAT確認實際使用條件下的表現。"},
{"n":689,"q":"[高難] 「品質策略展開」(Policy Deployment / Hoshin Kanri)的核心工具「catchball」(接球法)是指？","opts":["A. 一種質量遊戲", "B. 管理層與各層級之間反覆溝通協商、上下對齊的目標設定過程，確保目標和資源分配上下一致且現實可行", "C. 品質問題的快速解決", "D. 供應商評估方法"],"ans":"B","expl":"Hoshin Kanri（方針管理）流程：高層設定突破性目標→catchball過程（目標像球一樣在管理層和部門層之間傳遞，各層次確認目標可行性、提出改善計劃、分配資源）→全組織目標對齊→定期PDCA審查（月/季/年）。Catchball的精神：不是管理層單方面分配任務，而是雙向對話，確保目標既有挑戰性又切實可行，員工有參與感和主人翁意識。與KPI/MBO的區別：Hoshin更強調策略目標的全組織一致性和改善方向的聚焦。"},
{"n":690,"q":"[基礎] 「SIPOC圖」中的5個元素按正確順序排列是？","opts":["A. 系統、輸入、製程、輸出、顧客", "B. 供應商(S)→輸入(I)→流程(P)→輸出(O)→顧客(C)", "C. 標準、指示、產品、運作、控制", "D. 銷售、庫存、採購、運作、成本"],"ans":"B","expl":"SIPOC（六標準差DMAIC Define階段的標準工具）：S=Suppliers（提供流程所需輸入的人/組織）；I=Inputs（物料、信息、資源）；P=Process（主要步驟，通常4-7個高層步驟）；O=Outputs（流程產出的產品/服務/信息）；C=Customers（接收輸出的內/外部顧客）。用途：快速定義流程範圍、識別關鍵利益相關者、作為後續詳細流程圖的框架。在DMAIC中，SIPOC在Define階段建立，是所有後續分析的基礎。"},
{"n":691,"q":"[進階] 「統計容忍區間」(Statistical Tolerance Interval)與「信賴區間」(Confidence Interval)的差異是？","opts":["A. 完全相同", "B. 信賴區間估計母體參數（如均值μ）；容忍區間估計未來個別觀測值或母體一定比例的範圍", "C. 容忍區間用於製程管制；信賴區間用於決策", "D. 容忍區間比信賴區間更窄"],"ans":"B","expl":"三種區間比較：①信賴區間（CI）：針對統計量（均值、比例）的估計，如「95%信賴均值在[10.2, 10.8]之間」；②預測區間（PI）：對「下一個單一觀測值」的預測範圍，比CI更寬（因包含個體變異）；③容忍區間（TI）：以特定信賴水準，保證至少某比例（如95%）的母體個體落在其中，如「以95%信心，95%的產品落在[9.5, 11.5]」。容忍區間在品質保證和規格制定中最直接相關。"},
{"n":692,"q":"[高難] 「機器學習」在品質預測中的「過擬合」(Overfitting)問題的解決方法是？","opts":["A. 增加更多訓練數據", "B. 正則化(Regularization)、交叉驗證(Cross-Validation)、減少模型複雜度（如剪枝）、增加訓練數據或使用集成方法(Ensemble Methods)", "C. 使用更複雜的模型", "D. 只使用訓練數據評估模型"],"ans":"B","expl":"過擬合=模型在訓練數據上表現極好，但在新數據上性能差（泛化能力弱）。解決策略：①正則化（L1/L2懲罰係數，降低模型複雜度）②交叉驗證（k-fold CV，使用獨立驗證集評估）③早停(Early Stopping，當驗證損失不再改善時停止訓練)④Dropout（神經網路）⑤增加訓練數據⑥特征選擇（減少輸入維數）⑦集成方法（隨機森林=多棵決策樹的集成，降低單一模型的過擬合）。品質預測應用：預測性維護、缺陷偵測、參數優化。"},
{"n":693,"q":"[基礎] 「品質文化」(Quality Culture)的形成最關鍵的因素是？","opts":["A. 品質手冊和程序文件", "B. 最高管理階層的承諾和示範，以及將品質價值觀融入日常行為和決策", "C. 品質部門的努力", "D. 通過ISO認證"],"ans":"B","expl":"品質文化的建立：文化=共同的價值觀、信念和行為模式。最關鍵因素：「領導力」（管理層是否真正重視品質，還是只說不做）。示範效應：管理層優先交期vs優先品質時的選擇，決定員工認為什麼才是「真的重要」。ISO 9001:2015 條文5「領導力」強調最高管理階層的職責：建立品質政策、確保資源、以身作則、推動全員參與。文化轉變需要時間（通常3-5年），且必須靠一貫的行動而非宣言。"},
{"n":694,"q":"[進階] 「知識型品質管理」中，「組織學習」(Organizational Learning)與「品質改善」的關係是？","opts":["A. 互不相關", "B. 每次品質問題都是學習機會；系統性地捕捉、分享和應用從問題和成功中獲得的知識，是持續改善的核心機制", "C. 組織學習只針對培訓", "D. 品質改善取代了組織學習"],"ans":"B","expl":"學習型組織（彼得・聖吉《第五項修練》）：①個人精進②心智模式③共同願景④團隊學習⑤系統思考。品質管理的學習機制：每個8D/CAPA報告應包含「水平展開」（相似製程/產品應用相同對策）；知識庫（問題數據庫、解決方案庫）建立；定期品質回顧（從成功和失敗中學習）；跨部門知識分享。ISO 9001:2015條文7.1.6「組織知識」要求正式管理和傳遞組織知識。"},
{"n":695,"q":"[高難] 「顯著特性圖」(Significant Characteristics Matrix)在IATF 16949體系中的用途是？","opts":["A. 計算RPN", "B. 在設計和製程各階段，追蹤CC/SC特殊特性從設計圖面到DFMEA→控制計劃→SPC→作業指導書的完整鏈結", "C. 替代PFMEA", "D. 評估供應商績效"],"ans":"B","expl":"特殊特性矩陣（特性矩陣）功能：確保特殊特性(CC/SC)在整個APQP文件體系中貫穿：①圖面標注（CC/SC符號）→②DFMEA（識別設計失效原因）→③製程流程圖（識別關鍵製程步驟）→④PFMEA（識別製程失效模式）→⑤控制計劃（特別管制措施）→⑥作業指導書（操作員層面的管制）→⑦SPC（持續監控）。特性矩陣是追蹤此鏈結完整性的工具，是IATF 16949稽核的重要查核項目。"},
{"n":696,"q":"[基礎] 「生產節拍時間」(Takt Time)為3分鐘，而某工站的週期時間為4分鐘，應採取什麼措施？","opts":["A. 讓客戶等待", "B. 平衡生產線：增加該工站資源（增加人力或設備）、改善工站效率（去除浪費）、或調整工站作業分配", "C. 忽略，偶爾超出是正常的", "D. 增加在製品庫存"],"ans":"B","expl":"當週期時間(CT)>節拍時間(TT)：該工站成為瓶頸，無法滿足客戶需求。改善選項（按精益優先序）：①消除工站浪費（動作、等待、搬運）降低CT②將部分工作移到其他工站（生產線平衡）③增加工站人力（兩人作業）④增加設備（並聯運作）⑤延長工作時間。生產線平衡效率=Σ各工站CT ÷ (工站數×TT)，目標接近100%。"},
{"n":697,"q":"[進階] 「品質改善」的「水平展開」(Yokoten)是指？","opts":["A. 水平組織架構", "B. 將一處的改善經驗（成功案例或問題解決對策）主動分享並複製應用到其他類似製程、產品或工廠", "C. 同時改善多個問題", "D. 管理層向基層的指令下達"],"ans":"B","expl":"Yokoten（日文：橫展）是Toyota生產系統的重要概念：不僅解決眼前問題，更要評估相同或類似問題是否存在於其他地方，並主動推廣改善。實施機制：①在CAPA/8D中加入「水平展開評估」步驟②建立改善案例分享平台③定期最佳實務分享會④跨廠區知識移轉。好的品質改善=個案解決（解決這個問題）+水平展開（預防類似問題在其他地方發生）。"},
{"n":698,"q":"[高難] 「設計強健性」(Design Robustness)的評估可透過哪種測試方法？","opts":["A. 標準功能測試", "B. HALT（高度加速壽命測試）和HASS（高度加速應力篩選），施加超出規格的極端應力找出設計弱點", "C. 只通過FMEA評估", "D. 顧客試用測試"],"ans":"B","expl":"HALT（Highly Accelerated Life Testing）：施加遠超規格的應力（溫度、振動、組合）快速找出設計弱點（不是估計壽命），通常在-100°C~+200°C和20Grms振動下測試。目標：找到「操作極限」和「破壞極限」，識別弱點後改善設計，直到弱點改為成本效益可接受的地方。HASS（Highly Accelerated Stress Screening）：量產中用於製程篩選，施加低於HALT破壞極限的應力（激發潛在缺陷），不破壞好的產品但篩出製造缺陷。兩者合稱HALT/HASS。"},
{"n":699,"q":"[基礎] 「防誤」(Error Proofing)的最高等級是？","opts":["A. 告警蜂鳴器", "B. 物理上不可能犯錯（設計使錯誤行為無法執行）", "C. 自動停機", "D. 強制確認"],"ans":"B","expl":"防誤等級（由低到高）：①告知型：警示燈/蜂鳴器（可忽略）②控制型：強制確認（按確認鍵才能繼續）③停止型：自動停機（錯誤時設備停止，但仍可強制啟動）④預防型：物理不可能（設計使錯誤行為物理上無法執行，如USB-A和USB-C的形狀防止插錯方向）。預防型是最高等級，完全消除人為錯誤的可能性，無論操作員是否注意。設計FMEA中，偵測評分1分（最佳）= 100%自動防誤。"},
{"n":700,"q":"[進階] 「機器能力」(Machine Capability)指數Cm與Cmk的計算與Cp/Cpk的主要差異是？","opts":["A. 完全相同", "B. Cm/Cmk是「短期機器能力」，在標準條件下（固定操作員、固定原料、短時間）評估，僅反映機器本身的固有精度，通常要求≥1.67", "C. Cm只計算一種類型的變異", "D. Cm不考慮規格寬度"],"ans":"B","expl":"機器能力研究(MCS)：在排除操作員、原料批次、環境等外部變異的條件下，評估機器本身的固有精度（短期，通常25-50個連續件）。Cm=(USL-LSL)/(6σ_machine)；Cmk=min[(USL-μ)/3σ, (μ-LSL)/3σ]。要求：新機器採購或工程變更時，Cm/Cmk≥1.67（更嚴於一般製程能力要求Cpk≥1.33）。與Cpk差異：Cpk包含所有變異源（人、料、環境）；Cm/Cmk只看機器固有變異。"},
{"n":701,"q":"[高難] 「測試覆蓋率」(Test Coverage)在軟體品質中的限制是？","opts":["A. 無限制，覆蓋率100%即可保證無缺陷", "B. 100%行覆蓋不保證所有路徑被測試（路徑覆蓋指數爆炸），且測試用例可能只測試「正常」路徑，忽略邊界條件和錯誤輸入", "C. 只適用於大型軟體", "D. 成本太高"],"ans":"B","expl":"軟體測試覆蓋率類型：行覆蓋(Line Coverage)→分支覆蓋(Branch Coverage)→路徑覆蓋(Path Coverage)→條件覆蓋(Condition Coverage)。路徑數爆炸問題：n個if-else分支→最多2ⁿ條路徑，即使10個分支=1024路徑。「殺蟲劑悖論」(Pesticide Paradox)：反覆執行相同測試用例，不能發現新缺陷（缺陷對測試產生「免疫性」）。測試策略：等效類劃分+邊界值分析+錯誤猜測，配合突變測試(Mutation Testing)評估測試套件品質。"},
{"n":702,"q":"[基礎] ISO 14001:2015 「環境目標」必須具備哪些特性？","opts":["A. 只需符合法規", "B. 與環境政策一致、可量測（可行時）、考慮到合規義務、與重大環境因素相關、定期監控", "C. 只需每年審查一次", "D. 只針對廢水和廢氣"],"ans":"B","expl":"ISO 14001:2015 條文6.2環境目標要求：①與環境政策（包含持續改善承諾）一致②可量測（即SMART，定量目標優先）③考慮到適用的合規義務（法規限值）④考慮到重大環境因素⑤溝通給相關人員⑥定期更新。環境績效指標(EPI)：廢水排放量(kg/ton產品)、能源強度(kWh/unit)、廢棄物回收率%、CO₂排放量(Scope 1/2/3)。目標應有行動計劃、責任人和完成時限。"},
{"n":703,"q":"[進階] 「IATF 16949」要求的「現場稽核」(On-site Audit)必須包含哪些要素？","opts":["A. 只有文件審查", "B. 製造現場走動（Gemba Walk）、操作員訪談、觀察實際作業、管制計劃符合性驗證和過程稽核（如VDA 6.3）", "C. 只有管理階層訪談", "D. 只有KPI審查"],"ans":"B","expl":"IATF 16949現場稽核要素：①管理系統文件審查②現場走動(Gemba)：觀察實際生產、確認管制計劃執行③過程方法稽核：評估製程的輸入、活動、輸出的完整性④操作員訪談：確認培訓有效性（能描述關鍵步驟）⑤特殊特性管控確認⑥量測設備確認（校準標籤）⑦8D/CAPA有效性追蹤⑧客戶投訴和退回件分析。IATF 16949稽核必須包含製造現場，不能只做「辦公室稽核」。"},
{"n":704,"q":"[高難] 「品質1.0→4.0」演進中，「品質4.0」的核心概念是？","opts":["A. 全面品質管制（TQC）", "B. 整合數位科技（IoT、AI、大數據、雲端）實現預測性品質、實時監控和人機協作的智慧品質管理", "C. 零缺陷", "D. ISO 9001認證"],"ans":"B","expl":"品質演進史：品質1.0=工藝師/品質檢驗（前工業化時代）；品質2.0=統計品質管制SQC（1930s-1960s，休哈特/戴明）；品質3.0=TQM全面品質管理（1980s-2000s，全員、顧客焦點、持續改善）；品質4.0=工業4.0+品質管理（2015s至今）：IoT感測器實時採集數據→邊緣計算快速決策→AI/ML預測性品質→數字孿生（Digital Twin）模擬→全供應鏈實時品質可見度。目標：從「發現缺陷」→「預測並預防缺陷」。"},
{"n":705,"q":"[基礎] 「目視管理」中「Andon」系統的功能是？","opts":["A. 記錄生產數量", "B. 操作員發現問題時拉下Andon繩/按鈕，觸發信號燈和警報，呼叫監督人員協助，防止問題繼續流向下工站", "C. 控制生產速度", "D. 排程管理"],"ans":"B","expl":"Andon系統（源自豐田）：信號燈系統（綠=正常，黃=需要協助，紅=停線）。運作邏輯：操作員發現問題→拉繩/按鈕→黃燈亮→監督人員60秒內響應→若問題無法快速解決→紅燈=停線→停線比缺陷流出更重要（符合Jidoka精神）。數據價值：Andon的拉動頻率、響應時間、停線原因是製程問題的即時指示，是持續改善的重要數據源。現代Andon已整合到MES（製造執行系統）中，可即時追蹤和分析。"},
{"n":706,"q":"[進階] 「電子品質紀錄」(eQMS)相較於紙本系統的主要優勢是？","opts":["A. 成本更低", "B. 即時追蹤性、數據搜索和分析、遠端稽核能力、版本管控自動化、電子簽名合規（FDA 21 CFR Part 11）", "C. 更容易保密", "D. 不需要培訓"],"ans":"B","expl":"eQMS（電子品質管理系統）優勢：①文件管控：版本自動鎖定、修訂歷史、自動通知受影響人員②培訓管理：線上培訓追蹤、資格自動確認、到期提醒③CAPA管理：自動提醒、進度追蹤、有效性驗證連結④稽核管理：線上稽核計劃、行動項目追蹤⑤合規：FDA 21 CFR Part 11（電子記錄和電子簽名）、歐盟GMP Annex 11。選用時考慮：適用法規、整合能力（ERP、MES連接）、驗證要求（GxP環境需要軟體驗證）。"},
{"n":707,"q":"[高難] 「供應商品質保證」(SQA)中，「供應商分級」(Supplier Segmentation)的策略意義是？","opts":["A. 只是採購成本優化", "B. 根據戰略重要性和風險水平分級（如戰略→合作開發；關鍵→密切管理；一般→定期評鑑）制定差異化管理策略，優化資源分配", "C. 只按採購金額分級", "D. 供應商越多越好"],"ans":"B","expl":"供應商分級矩陣（Stratification Matrix）常用維度：採購金額+供應商替代難度（戰略性vs商品化）。分級結果→差異化管理策略：①戰略供應商（高金額+難替代）=聯合開發、技術共享、高頻溝通、供應商開發投資②偏好供應商（高金額+易替代）=長期合約、績效激勵③關鍵供應商（低金額+難替代）=多源採購策略、安全庫存④一般供應商（低金額+易替代）=競標採購、最低管理。"},
{"n":708,"q":"[基礎] 「品質目標」(Quality Objectives)應「SMART」化，其中以下哪個是良好的品質目標範例？","opts":["A. 「持續改善品質」", "B. 「到2025年Q4，將客戶投訴件數從每月15件降低至5件以下，降幅≥67%」", "C. 「努力達到更高品質水準」", "D. 「減少不良品」"],"ans":"B","expl":"SMART品質目標剖析：S(Specific)=客戶投訴件數（具體指標）；M(Measurable)=從15件降至5件以下（可量測的基準和目標）；A(Achievable)=67%降幅需評估可行性；R(Relevant)=與顧客滿意和品質目標相關；T(Time-bound)=到2025年Q4（明確截止時間）。不良目標的通病：「持續改善」=無目標值、無時限；「更高品質」=無具體定義。ISO 9001:2015條文6.2要求品質目標必須可量測（在可行的情況下）。"},
{"n":709,"q":"[進階] 「管理評審」(Management Review)依ISO 9001:2015應包含哪些必要輸入？","opts":["A. 只有財務報告", "B. 前次管理評審行動項目狀態、外部/內部議題變化、QMS績效（含顧客滿意、稽核結果、目標達成、不符合/CA）、資源充足性、改善機會", "C. 只有生產數據", "D. 供應商績效"],"ans":"B","expl":"ISO 9001:2015條文9.3管理評審輸入（必須含）：①前次管理評審的行動項目落實狀況②影響QMS的外部和內部議題變化③QMS績效（顧客滿意和反饋、品質目標達成度、製程績效和符合性、不符合和CA、監控和量測結果、稽核結果、外部供應者績效）④資源充足性⑤風險和機會應對措施的有效性⑥持續改善機會。輸出：持續改善機會的決策、QMS任何需要變更的需求、資源需求。"},
{"n":710,"q":"[高難] 「以顧客為中心」(Customer Centricity)與「以品質為中心」(Quality Centricity)的潛在衝突及解決方式是？","opts":["A. 兩者永遠一致", "B. 顧客可能要求快速交期（犧牲品質），或低成本（降低規格）；解決方式是透明溝通權衡，找到在顧客價值和品質要求間的最佳平衡點", "C. 品質始終優先於顧客要求", "D. 顧客要求始終優先"],"ans":"B","expl":"平衡顧客需求和品質要求：KANO模型區分：必要品質（缺少不接受）、期望品質（越多越好）、魅力品質（有則驚喜）；識別哪些品質要求是顧客願意為之付費的「增值要求」。短期交期壓力vs品質：建立「品質優先」文化，管理層在兩者衝突時必須堅守品質底線（不出貨NG品），並提高製程能力（Cpk）以同時滿足品質和交期。顧客聲音(VOC)→轉為可執行的技術規格（QFD），避免「我覺得顧客想要」的假設。"},
{"n":711,"q":"[基礎] 「5S」中，「整理」(Seiri)的核心行動是？","opts":["A. 清掃地板", "B. 判斷並清除工作區域中「不需要」的物品（按紅牌作戰準則分類：立即丟棄/轉移/保留）", "C. 將物品排列整齊", "D. 建立5S標準"],"ans":"B","expl":"5S（源自日文）定義：整理(Seiri/Sort)=「取」需要的，清除不需要的→整頓(Seiton/Set in Order)=「有序排放」，每樣東西有固定位置和數量→清掃(Seiso/Shine)=清潔和點檢→清潔(Seiketsu/Standardize)=標準化前三S的做法→素養(Shitsuke/Sustain)=維持和習慣化。紅牌作戰：對不確定是否需要的物品貼紅牌，若一段時間內無人認領→移除。5S是TPM和精益的基礎，也是視覺管理的起點。"},
{"n":712,"q":"[進階] 「設備綜合效率」OEE=可用率×效能率×品質率，若可用率=90%、效能率=85%、品質率=98%，OEE為？","opts":["A. 91%", "B. 75%", "C. 88%", "D. 81%"],"ans":"B","expl":"OEE = 0.90 × 0.85 × 0.98 = 0.90×0.833 = 0.7497 ≈ 75%。這說明即使每項指標看起來還不錯（90%、85%、98%），三者相乘後OEE只有75%，遠低於世界級目標85%。OEE的乘法效應要求每個指標都要高才能整體優秀：若3項各降至80%：OEE=0.8³≈51%，非常低。提高OEE的優先序：先攻最低的那項（本例為效能率85%）。"},
{"n":713,"q":"[高難] 「數位孿生」(Digital Twin)在品質管理中的應用場景是？","opts":["A. 只用於設計階段", "B. 在虛擬環境中實時映射實物產品或製程，用於預測性品質分析、虛擬測試、故障診斷和工藝優化", "C. 只用於大型設備", "D. 替代實物測試"],"ans":"B","expl":"數位孿生(Digital Twin)特點：①實時性：實物和虛擬模型保持同步（通過IoT感測器）②雙向性：模擬結果可指導實物調整③全生命週期：從設計、製造到使用和維護。品質應用：①預測性維護（監測設備狀態，預測失效時間）②虛擬品質測試（在數字模型上測試不同參數，減少實物試驗成本）③缺陷根因分析（在虛擬環境中重現問題）④製程仿真優化。行業案例：西門子、GE、波音在航空發動機和渦輪機中廣泛應用。"},
{"n":714,"q":"[基礎] 「員工建議制度」(Suggestion System)有效運作的關鍵要素是？","opts":["A. 大量獎金激勵", "B. 快速反饋（建議是否採用的及時回覆）、實際採用率和可見的改善成果、管理層的鼓勵和認可", "C. 強制每人每月提交", "D. 匿名提交"],"ans":"B","expl":"員工建議制度的成功要素（豐田式Kaizen）：①便利性：低門檻，簡單表格（不需詳細分析）②快速回應：通常1週內得到反饋（是否採用和原因）③高採用率：豐田採用率約80%以上（vs美國企業通常<20%）④小改善優先：鼓勵微小日常改善，而非只接受大型創新⑤管理層親自感謝：即使只是口頭道謝。「提了沒人理」是最大殺手，導致員工放棄參與。"},
{"n":715,"q":"[進階] 「流程再造」(Business Process Reengineering, BPR)與「持續改善」(Kaizen/CI)的主要差異是？","opts":["A. 兩者相同", "B. BPR=激進式根本性重新設計（打掉重來，短期大幅改變）；Kaizen=漸進式持續小改善（在現有流程上改善，長期積累效果）", "C. BPR只用於製造業", "D. Kaizen需要高成本投資"],"ans":"B","expl":"BPR（Hammer & Champy, 1990s）：不是優化現有流程，而是從頭設計（「為什麼我們這樣做？」），可帶來50-90%的效率提升，但風險高（失敗率約60-70%）。Kaizen：每天小改善，風險低，員工參與感高，文化更易持續，但單次改善幅度有限。精益選擇：改善活動(Kaizen)用於解決具體問題；當整個流程已達優化極限需要突破時→考慮BPR。兩者在LSS中可互補：Kaizen Event（Kaizen Blitz）是6σ Control階段的快速改善工具。"},
{"n":716,"q":"[高難] 「統計過程監控」(SPC)中，如何確定「初始管制界限」(Initial Control Limits)？","opts":["A. 使用規格界限（USL/LSL）", "B. 收集≥25個子組的歷史數據，在確認無特殊原因後，用±3σ（R̄/d₂估計σ）建立初始界限", "C. 使用行業標準界限", "D. 由管理層設定"],"ans":"B","expl":"管制界限建立步驟：①收集代表性歷史數據（至少25個子組，每組n=4-5個）②繪製初步管制圖（用試行界限）③識別並調查特殊原因（超限點、趨勢等）④排除特殊原因數據點（及其對應子組），重新計算管制界限⑤確認剩餘點全在界限內→建立正式管制界限⑥投入運作使用。重要原則：管制界限=製程數據決定（3σ），絕對不是規格界限；管制圖超限≠產品不合格（管制與規格完全分離）。"},
{"n":717,"q":"[基礎] 「製程流程圖」(Process Flow Diagram/Chart)中，「菱形」(Diamond)符號代表？","opts":["A. 操作步驟", "B. 決策/判斷（Yes/No分岔）", "C. 開始/結束", "D. 文件"],"ans":"B","expl":"流程圖標準符號（ANSI/ISO）：①橢圓/圓角矩形=開始/結束②矩形=操作步驟/過程活動③菱形=決策（判斷，有2個或多個輸出分支）④平行四邊形=輸入/輸出（資訊或材料）⑤矩形加雙線底=子流程⑥文件形=文件/報告⑦數據庫形=資料庫。流程圖是過程分析、SOP視覺化和稽核的基本工具。Swimlane流程圖（含部門分道）清楚顯示跨部門責任歸屬。"},
{"n":718,"q":"[進階] 「最終檢驗」(Final Inspection)的設計原則應基於？","opts":["A. 100%全數檢驗確保品質", "B. 基於前道製程能力、歷史數據和風險分析，設計具成本效益的抽樣計劃，高風險特性加強、低風險特性減量", "C. 隨機選擇抽樣方式", "D. 客戶要求多少就做多少"],"ans":"B","expl":"最終檢驗設計原則：①不應將品質保證依賴於最終檢驗（應在製程中建立品質）②根據製程能力（Cpk）決定檢驗頻率（Cpk高→可減量；Cpk低→加嚴）③區分特殊特性（CC/SC）和一般特性：CC可能需要100%檢驗④考慮失效模式（若遺漏某缺陷的影響=安全危害→加嚴）⑤整合SPC數據：若SPC顯示製程穩定→可減量抽檢。最終目標：逐步從「靠檢驗保證品質」→「製程保證品質，最終確認」。"},
{"n":719,"q":"[高難] 「ISO 56002:2019」(創新管理系統)與品質管理的關聯是？","opts":["A. 與品質管理無關", "B. 創新管理是品質4.0和持續改善的延伸，兩者共享組織學習、人員參與和持續改善等核心原則，可整合到IMS中", "C. 創新管理取代品質管理", "D. 只適用於科技公司"],"ans":"B","expl":"ISO 56002（創新管理系統）採用與ISO 9001/14001相同的高階結構(Annex SL)，可整合入IMS。核心概念：①創新生態系統（內部+合作夥伴）②創新組合管理（從漸進改善到突破性創新）③機會識別（VOC、PESTLE、場景規劃）④創新過程（構想→概念→開發→試驗→部署）。品質與創新的整合：品質提供穩定基礎（防錯、標準化），創新提供突破性改善；田口方法（設計強健性）和TRIZ（創新問題解決）是兩者的橋接工具。"},
{"n":720,"q":"[基礎] 「製程決定的不合格品」與「設計決定的不合格品」的處理方式差異是？","opts":["A. 完全相同", "B. 製程不合格=通常可通過製程調整/CA解決；設計不合格=需要工程變更（ECO），成本更高，且可能需要PPAP重新批准", "C. 都需要100%報廢", "D. 設計不合格不需要紀錄"],"ans":"B","expl":"不合格品分類處置：①製程原因（參數偏差、設備問題、操作失誤）：圍堵（隔離）→CA（製程調整/維修/訓練）→驗證有效性；②設計原因（設計容差過緊、選材不當、測試規格不合理）：需要正式ECO（工程變更令）→FMEA更新→可能需要新的PPAP（如影響到尺寸、材料、功能）→顧客批准（IATF 16949要求）。設計原因改善周期長，影響已生產庫存和在途品的處置。"},
{"n":721,"q":"[進階] 「量測系統」中，「解析度」(Resolution/Discrimination)不足的影響是？","opts":["A. 量測值散亂", "B. 量測值聚集成「階梯」形態，量測系統無法區分產品間的差異，使管制圖失去意義（所有點聚集在少數幾個數值）", "C. 量測系統偏差增加", "D. 校準困難"],"ans":"B","expl":"量測解析度要求：解析度應≤公差/10或≤製程標準差/10（GR&R中稱為NDC判斷）。解析度不足的後果：管制圖上只出現少數幾個離散值→無法偵測製程趨勢→用於製程控制的管制圖失效。例：公差=1.0mm，使用解析度0.5mm的量具→只能量到…0.5、1.0、1.5…，管制圖無法判斷製程是否在良好控制。解決：換用精度更高的量具（解析度應≤公差/10=0.1mm）。"},
{"n":722,"q":"[高難] 「組合容差」在GD&T疊加分析中，若4個尺寸鏈環公差各為±0.05mm，使用RSS方法的組合公差為？","opts":["A. ±0.20mm（直接疊加）", "B. ±0.10mm（RSS：√(4×0.05²)=√0.01=0.10mm）", "C. ±0.05mm", "D. ±0.14mm"],"ans":"B","expl":"RSS容差計算：若n個獨立環的公差各為δ，RSS組合公差=√(Σδᵢ²)=√(4×0.05²)=√(4×0.0025)=√0.01=0.10mm。對比最壞情況法：0.05×4=0.20mm。RSS允許的組合公差（±0.10mm）比最壞情況（±0.20mm）更寬，意味著各零件可以有更寬鬆的公差，降低製造成本。前提：假設各尺寸鏈環相互獨立且近似常態分布，可接受小概率（通常1/1000）的組裝失效。"},
{"n":723,"q":"[基礎] 「顧客導向的品質」中，KANO模型的「魅力品質要素」(Attractive Quality Elements)的特點是？","opts":["A. 顧客明確要求，且提供越多顧客越滿意", "B. 顧客未明確要求，提供了顧客驚喜滿意，但缺少了顧客也不會不滿", "C. 基本必須具備，缺少了顧客不滿意", "D. 對顧客滿意度無影響"],"ans":"B","expl":"KANO模型三大要素：①必要品質(Must-be/Basic Needs)：基本期望，有了不加分，沒有嚴重扣分（如手機能打電話）；②期望品質(One-dimensional/Performance)：越多越好，線性正相關（如電池續航）；③魅力品質(Attractive/Excitement)：超出期望的驚喜，有了大幅加分，沒有不扣分（如iPhone Face ID）。重要：魅力品質會隨時間降格→期望品質→必要品質（如汽車空調，曾是奢侈配備，現在是標配）。"},
{"n":724,"q":"[進階] 「量化風險評估」(QRA, Quantitative Risk Assessment)與「定性風險評估」(Qualitative RA)的選用原則是？","opts":["A. QRA始終優於定性評估", "B. QRA用於有充足數據和失效率資料的情況（航太、核能、化工），精度高但成本大；定性評估用於數據不足或初步篩選，快速識別高風險區域", "C. 定性評估始終足夠", "D. 兩者只適用於不同產業"],"ans":"B","expl":"QRA（FMEA與可靠度數字化）：需要可靠的失效率數據（如MIL-HDBK-217電子元件可靠度手冊）、事件概率數據庫（如CCPS化工事故數據）；輸出：失效概率的數字估計（如10⁻⁶/小時）；適用：設計安全系統（SIL評級）、核電廠PRA、飛機適航性分析。定性RA（風險矩陣/FMEA RPN）：不需要數字化失效率；適用：產品設計早期、製程改善、組織風險評估；快速但主觀性較強。選用標準：後果嚴重（生命安全/環境災難）→QRA；一般商業風險→定性即可。"},
{"n":725,"q":"[高難] 「人因工程」(Human Factors Engineering)在品質設計中的應用原則是？","opts":["A. 培訓操作員避免錯誤", "B. 設計系統使人不容易犯錯（防誤設計），減少認知負荷，符合人體工學，並在人-機-環境系統中考慮人的能力和限制", "C. 用自動化替代所有人工操作", "D. 增加警示標語"],"ans":"B","expl":"人因工程(HFE/Ergonomics)核心：人是系統的一部分，系統設計應適應人，而非讓人適應系統。品質設計應用：①防誤設計(Poka-Yoke)：物理不可能犯錯②信號可見性：界面清晰（是/否確認，顏色區分）③回饋：立即明確的操作反饋（成功/失敗）④減少記憶負荷：SOP視覺化、關鍵資訊就在作業點⑤疲勞管理：工作站高度適宜、輪崗降低重複動作。SHEL模型（軟體/硬體/環境/人員）用於分析人機界面。"},
{"n":726,"q":"[基礎] 「生命週期成本」(Life Cycle Cost, LCC)包含哪些主要成本？","opts":["A. 只有購置成本", "B. 研發/設計成本+採購/生產成本+運作/使用成本+維護/保養成本+廢棄/處置成本的全生命週期總和", "C. 只有運營成本", "D. 只有品質成本"],"ans":"B","expl":"LCC（Total Cost of Ownership, TCO）的冰山效應：採購成本（可見，通常15-25%）只是冰山一角；使用、維護、廢棄等（不可見，75-85%）才是主體。設備採購決策應用LCC：低採購價但高維護成本的設備，LCC可能遠高於高採購價但高可靠度的設備。ISO 55000（資產管理）要求以全生命週期成本最優化為目標。在品質領域，可靠設計降低LCC中的維護和失效成本。"},
{"n":727,"q":"[進階] 「抽樣計劃」中，「連續抽樣計劃」(CSP, Continuous Sampling Plan)適用於？","opts":["A. 批次生產", "B. 連續流生產（無明顯批次界限）的品質監控，如流水線、傳送帶生產", "C. 只用於化工", "D. 抽樣成本極低時"],"ans":"B","expl":"連續抽樣計劃(CSP-1, Dodge 1943)：適用於沒有明確批次的連續生產。運作方式：①在一段全數檢驗後，切換到抽樣（如每k件檢1件）②若發現不合格品→切回全數檢驗→再次滿足全數合格條件後→再切到抽樣。衍生版本：CSP-2（需連續兩件合格才切換）、MIL-STD-1235（標準化的連續抽樣）。相關指標：AOQ（平均出廠品質）、AOQL（AOQ上限）與批次抽樣相同概念。"},
{"n":728,"q":"[高難] 「製程優化」中，「響應曲面法」(RSM, Response Surface Methodology)的優點是？","opts":["A. 只需要少量試驗", "B. 通過數學模型（二次多項式）描述響應與因子的曲面關係，可識別交互作用和曲率效應，找到最佳化點（鞍點/山頂/山谷）", "C. 不需要DOE", "D. 只適用於線性系統"],"ans":"B","expl":"RSM（Myers & Montgomery）：RSM通常在全因子/部分因子DOE（識別顯著因子）後進行，使用中央複合設計(CCD)或Box-Behnken設計(BBD)。擬合二次模型：Y=β₀+Σβᵢxᵢ+Σβᵢᵢxᵢ²+Σβᵢⱼxᵢxⱼ。尋優：Desirability Function（多響應同時優化）、等高線圖和3D曲面圖視覺化。應用：化工反應條件優化（溫度、壓力、時間）、注射成型參數優化（熔溫、壓力、時間）、食品配方優化。"},
{"n":729,"q":"[基礎] 「供應商績效評鑑」常用的「PPAP」(生產件批准程序)要求供應商提交樣品量至少幾件？","opts":["A. 1件", "B. 5件", "C. 30件（Level 3通常30件或100件取樣結果）", "D. 100件"],"ans":"C","expl":"PPAP尺寸結果要求：通常需要至少30個零件的尺寸量測報告（有時客戶要求100件），用於計算初始製程能力(Ppk)。30件的樣品量使Ppk的計算更可靠（統計上30件可以對製程有基本了解，但100件更佳）。AIAG PPAP第4版：「製程研究的最小取樣量=30件（Ppk的可靠估計需要更多）」。特別要求：若Ppk<1.67，即使樣品合格，也需要100%檢驗或補充措施。"},
{"n":730,"q":"[進階] 「DFSS」(Design for Six Sigma)與標準「DMAIC」的差異是？","opts":["A. 完全相同", "B. DMAIC改善既有製程（重新設計）；DFSS（DMADV或IDOV）從零設計新產品/服務以達到6σ能力，預防缺陷發生", "C. DFSS只用於服務業", "D. DMAIC更複雜"],"ans":"B","expl":"DFSS框架（多種版本）：DMADV（Define→Measure→Analyze→Design→Verify）或IDOV（Identify→Design→Optimize→Verify）。核心工具：QFD（VOC轉技術規格）→DFMEA（設計風險）→Monte Carlo模擬（容差分析）→TRIZ（創新問題解決）→田口強健設計→設計驗證（DVT/DVP）。DFSS目標：新品上市即達Cpk≥2.0（短期），避免後期昂貴的設計變更。適用時機：全新產品開發或現有產品無法通過DMAIC達到6σ目標時。"},
{"n":731,"q":"[高難] 「全面品質管理」(TQM)的八大原則中，「基於事實的決策」(Evidence-based Decision Making)要求什麼？","opts":["A. 只依賴管理層直覺", "B. 收集並分析相關數據和信息作為決策的基礎，同時考量經驗和直覺，平衡定量分析和定性判斷", "C. 所有決策必須有統計顯著性", "D. 禁止使用主觀判斷"],"ans":"B","expl":"ISO 9001:2015的7個品質管理原則之一：「基於證據的決策」。實際做法：①KPI儀表板追蹤品質指標②統計方法（SPC、假設檢定）支持品質決策③根因分析（5-Why、魚骨圖）引導CA②趨勢分析（而非只看當前點）。平衡原則：數據是決策基礎，但不是唯一來源——還需考慮：組織知識（隱性知識）、利益相關者價值觀、倫理判斷、創新直覺。避免「分析麻痺」（過度分析導致無法決策）。"},
{"n":732,"q":"[基礎] 「作業指導書」(Work Instruction/SOP)的有效性最終應以什麼來判斷？","opts":["A. 文件格式是否符合模板", "B. 操作員能否按照指導書正確執行作業，且品質結果符合要求", "C. 是否有主管簽核", "D. 文件字數"],"ans":"B","expl":"SOP的有效性驗證：①工站確認：操作員試讀，確認看得懂且能照做②試生產：按新SOP生產，確認品質結果達標③稽核確認：定期確認操作員實際行為與SOP一致④定期審查：有效SOP應定期（如年度）審查是否仍符合最新製程狀態。「文件存在≠文件有效」是稽核中常見發現：SOP存在但操作員不知道、或操作員有做但沒按SOP。ISO 9001 7.5.1要求確定需要的文件化信息。"},
{"n":733,"q":"[進階] 「製程FMEA」(PFMEA)的「現行製程管制」欄位應區分哪兩類管制措施？","opts":["A. 機器管制和人工管制", "B. 預防管制（Preventive Controls，防止失效原因/失效模式的發生）和偵測管制（Detection Controls，偵測失效原因/失效模式的發生）", "C. 內部管制和外部管制", "D. 強制管制和可選管制"],"ans":"B","expl":"AIAG-VDA FMEA 2019版明確區分：預防管制(PC)=防止原因發生或降低其發生率（如防誤裝置、製程參數管制、標準化SOP、設備保養）→影響O（發生度）評分；偵測管制(DC)=偵測原因或失效模式（如CMM量測、目視檢驗、機能測試、SPC管制圖）→影響D（偵測度）評分。這一區分使FMEA分析更精確，並指引改善方向：強化預防管制通常比增加偵測管制更根本有效。"},
{"n":734,"q":"[高難] 「計量型管制圖」的「經濟子組大小」選擇，為何工業上常用n=4或n=5？","opts":["A. 計算方便", "B. 提供良好的統計效率（對均值偏移的偵測力），計算簡便（d₂係數接近2），且每組抽樣成本可接受", "C. 符合法規要求", "D. 電腦軟體預設值"],"ans":"B","expl":"子組大小n選擇的考量：①統計效率：n越大，X̄的變異越小（σ/√n），偵測小偏移能力越強②成本：n越大，抽樣和量測成本越高③常態性：子組均值在n=4-5時，即使母體輕微偏態，X̄已近似常態（CLT）④管制界限常數：n=4時d₂=2.059，n=5時d₂=2.326，是教科書中標準係數表中計算最簡便的值⑤典型做法：高成本量測用n=2-3；標準計量型用n=4-5；精度要求高用n=6-10。"},
{"n":735,"q":"[基礎] 「顧客投訴處理」的「8D問題解決」(Eight Disciplines)中，D3的任務是？","opts":["A. 識別根本原因", "B. 立即圍堵措施（Containment Actions）：採取臨時性措施阻止問題繼續流至顧客，如100%篩選、緊急替代供料", "C. 定義問題", "D. 驗證永久對策"],"ans":"B","expl":"8D各步驟：D0=準備和緊急措施（若需要立即行動）；D1=建立問題解決小組；D2=問題描述（5W2H，量化問題）；D3=即時圍堵行動（阻止問題繼續影響顧客，允許生產繼續）；D4=識別根本原因；D5=選擇和驗證永久糾正措施；D6=實施永久措施並驗證有效性；D7=預防再發（更新FMEA、控制計劃、SOP，水平展開）；D8=感謝小組並慶祝（關閉問題）。"},
{"n":736,"q":"[進階] 「六標準差綠帶」(Green Belt)的核心工作範圍是？","opts":["A. 全職改善項目", "B. 在本職工作外，兼職參與或領導部門內的改善項目，掌握基本DMAIC和統計工具，接受黑帶指導", "C. 培訓黑帶", "D. 只負責數據收集"],"ans":"B","expl":"六標準差角色體系詳解：①白帶(White Belt)=基礎認識，支持項目；②黃帶(Yellow Belt)=了解DMAIC，參與項目（非領導）；③綠帶(GB)=兼職，領導部門或跨部門小項目，掌握基本統計（管制圖、假設檢定、DOE基礎），通常1-2年工作經驗+培訓；④黑帶(BB)=全職，複雜跨部門項目，精通統計，培訓GB；⑤主黑帶(MBB)=策略方向，培訓BB，開發方法論。ASQ Green Belt認證需通過考試+具體項目經驗。"},
{"n":737,"q":"[高難] 「過程能力」分析中，若數據呈非常態分布（如韋伯分布），如何正確估計製程能力？","opts":["A. 直接使用Cpk公式，假設常態分布", "B. 使用分布擬合（確認分布類型）後，計算特定分位數作為等效製程界限（非常態製程能力分析），或進行數據轉換後使用Cpk", "C. 只用直方圖判斷", "D. 增加樣本量直到常態"],"ans":"B","expl":"非常態製程能力分析方法：①確認分布（韋伯、對數常態等，使用概率圖或Anderson-Darling檢定）②非常態Cpk（使用分位數法）：Pp.0.00135和P99.865作為等效製程界限（與常態±3σ等概率），Cp=(USL-LSL)/(P99.865-P0.00135)③Box-Cox轉換→轉換後數據擬合常態→計算Cpk→但解讀需注意轉換回原始單位。Minitab的Capability Analysis（Non-normal）提供多種分布的製程能力計算選項。"},
{"n":738,"q":"[基礎] 「顧客滿意度測量」中，NPS（淨推薦分數）的計算方式是？","opts":["A. 平均分", "B. 「推薦者%（9-10分）」減去「批評者%（0-6分）」，得到-100到+100的分數", "C. 所有滿意顧客比例", "D. 投訴解決率"],"ans":"B","expl":"NPS計算：問「您有多大可能推薦我們給朋友/同事？」（0-10分）→推薦者(Promoters)=9-10分；中立者(Passives)=7-8分；批評者(Detractors)=0-6分；NPS=推薦者%-批評者%。NPS範圍：-100（所有人都是批評者）到+100（所有人都是推薦者）；NPS>50=優秀；NPS>70=世界級。NPS的優點：簡單、預測性強（與業務增長相關）；缺點：無法解釋原因（需跟進問卷）、不同行業基準不同。"},
{"n":739,"q":"[進階] 「可持續供應鏈」(Sustainable Supply Chain Management)中，「ESG」(Environmental, Social, Governance)對品質管理的影響是？","opts":["A. ESG與品質管理無關", "B. ESG要求供應鏈管理延伸到環境（碳足跡、廢棄物）、社會（勞工條件、人權）和治理（反腐敗、透明度）維度，這些已成為供應商評鑑和品質管理的新要求", "C. ESG只是公關活動", "D. ESG只適用於大型跨國企業"],"ans":"B","expl":"ESG對供應商管理的實際影響：①E（環境）：供應商需提供碳排放數據（Scope 3排放溯源）、廢水廢氣合規性→稽核要求延伸至環境績效②S（社會）：勞工標準（禁止童工/強迫勞動）、職安衛→SA8000、RBA（電子業責任聯盟）等框架③G（治理）：反腐敗、信息透明度→供應商行為準則(Supplier Code of Conduct)。趨勢：歐盟CSRD（公司永續報告指令）和美國SEC氣候披露要求正將ESG供應鏈透明度法制化。"},
{"n":740,"q":"[高難] 「先進品質規劃」(APQP)中，「設計驗證計劃和報告」(DVP&R, Design Verification Plan and Report)的內容包含？","opts":["A. 只有尺寸測試", "B. 驗證項目清單（功能、可靠性、安全、法規符合）、各項測試的試驗方法標準、樣品數量、通過準則和計劃/實際完成日期", "C. 只有PPAP要求的測試", "D. 只有顧客指定的測試"],"ans":"B","expl":"DVP&R（設計驗證計劃與報告）是DFMEA和設計確認的配套文件：①驗證矩陣：每個設計要求→對應驗證測試方法（如壽命測試、衝擊測試、EMC測試）②完整性追蹤：每個設計要求都有至少一個驗證方法（無「空白」要求）③樣品計劃：每種測試的樣品數量（基於統計置信度）④通過準則：明確的合格標準（量化，如>50,000次循環無失效）⑤實際結果：測試完成後填入（用作設計確認證據）⑥PPAP提交文件之一（尺寸結果+材料測試+性能測試）。"}];
const CALC = [{"n": 71, "ch": "品質成本 PAF 分析", "q": "某公司月產量 10,000 件，品質成本：預防 NT$45,000、鑑定 NT$72,000、內部失敗 NT$105,000、外部失敗 NT$78,000。試計算：(1) 總品質成本 (2) 失敗成本占比 (3) 每件品質成本。", "given": "預防$45K, 鑑定$72K, 內部失敗$105K, 外部失敗$78K, 月產量10,000件", "steps": ["總品質成本 = 45,000 + 72,000 + 105,000 + 78,000 = NT$300,000", "失敗成本 = 105,000 + 78,000 = NT$183,000", "失敗成本占比 = 183,000 / 300,000 × 100% = 61.0%", "每件品質成本 = 300,000 / 10,000 = NT$30 / 件"], "ans": "總品質成本 NT$300,000；失敗成本占 61.0%；每件品質成本 NT$30"}, {"n": 72, "ch": "田口品質損失函數", "q": "田口損失函數 L(y)=k(y−m)²，修理費用 A=NT$800，功能界限 Δ=0.4mm，目標值 m=50.0mm，量測值 y=50.3mm。試計算：(1) k (2) L(y)。", "given": "A=NT$800, Δ=0.4mm, m=50.0mm, y=50.3mm", "steps": ["k = A / Δ² = 800 / (0.4)² = 800 / 0.16 = 5,000 NT$/mm²", "偏差量：y − m = 50.3 − 50.0 = 0.3 mm", "L(y) = k × (y−m)² = 5,000 × (0.3)² = 5,000 × 0.09 = NT$450"], "ans": "k = 5,000 NT$/mm²；L(y) = NT$450"}, {"n": 73, "ch": "品質改善 ROI", "q": "改善前月失敗成本 NT$240,000，投入預防成本 NT$50,000 後，失敗成本降至 NT$90,000。試計算：(1) 每月節省金額 (2) ROI（%）。", "given": "改善前失敗=$240K, 投入預防=$50K, 改善後失敗=$90K", "steps": ["每月節省 = 240,000 − 90,000 = NT$150,000", "淨效益 = 節省額 − 投入 = 150,000 − 50,000 = NT$100,000", "ROI = 100,000 / 50,000 × 100% = 200%"], "ans": "每月節省 NT$150,000；ROI = 200%"}, {"n": 74, "ch": "FMEA RPN 計算", "q": "三種失效模式：A(S=7,O=5,D=6)、B(S=9,O=4,D=7)、C(S=6,O=8,D=5)。計算各RPN、找出優先改善項，及B的D改善至3後的新RPN。", "given": "A: S=7,O=5,D=6；B: S=9,O=4,D=7；C: S=6,O=8,D=5", "steps": ["RPN_A = 7 × 5 × 6 = 210", "RPN_B = 9 × 4 × 7 = 252（最高，優先改善）", "RPN_C = 6 × 8 × 5 = 240", "改善後 B 的 D 降至 3：RPN_B_new = 9 × 4 × 3 = 108（降低 57%）"], "ans": "RPN: A=210, B=252（最高，優先）, C=240；改善後 B 的 RPN=108"}, {"n": 75, "ch": "GR&R 量測系統分析", "q": "MSA 研究：重複性 EV=0.15，再現性 AV=0.10，零件間變異 PV=0.35。計算：(1) GR&R (2) TV (3) %GR&R (4) 判斷結論。", "given": "EV=0.15, AV=0.10, PV=0.35（標準差單位）", "steps": ["GR&R = √(EV² + AV²) = √(0.0225+0.01) = √0.0325 ≈ 0.1803", "TV = √(GR&R² + PV²) = √(0.0325+0.1225) = √0.155 ≈ 0.3937", "%GR&R = (0.1803 / 0.3937) × 100% ≈ 45.8%", "判斷：%GR&R = 45.8% > 30% → 量測系統不合格，必須改善"], "ans": "GR&R≈0.180；%GR&R≈45.8% → 不合格（>30%），量測系統需改善"}, {"n": 76, "ch": "製程均值對準改善", "q": "製程 X~N(25.5, 1.0²)，USL=28, LSL=22。改善後 μ→25.0，σ不變。計算：(1) 改善前 Cpk (2) 改善前良率 (3) 改善後 Cpk (4) 改善後良率。（Φ(2.5)=0.9938, Φ(3.0)=0.9987）", "given": "改善前 μ=25.5, σ=1.0；改善後 μ=25.0；USL=28, LSL=22", "steps": ["改善前：CPU=(28−25.5)/3=0.833；CPL=(25.5−22)/3=1.167", "改善前 Cpk = min(0.833, 1.167) = 0.833", "改善前良率 = Φ(2.5)−Φ(−3.5) = 0.9938−0.0002 = 99.36%", "改善後：CPU=CPL=(28−25)/3=1.000；Cpk=1.000", "改善後良率 = Φ(3.0)−Φ(−3.0) = 0.9987−0.0013 = 99.74%"], "ans": "改善前 Cpk=0.833，良率99.36%；改善後 Cpk=1.000，良率99.74%"}, {"n": 77, "ch": "MSA 量具偏差分析", "q": "標準件參考值=50.00mm，5次量測：49.85, 50.10, 49.95, 50.05, 50.05，規格寬度 T=10mm。計算：(1) 量測均值 (2) Bias (3) %Bias (4) 判斷。", "given": "參考值=50.00mm, 量測值：49.85/50.10/49.95/50.05/50.05, T=10mm", "steps": ["X̄ = (49.85+50.10+49.95+50.05+50.05) / 5 = 250.00/5 = 50.00 mm", "Bias = X̄ − 參考值 = 50.00 − 50.00 = 0.00 mm", "%Bias = |0| / 10 × 100% = 0.0%", "判斷：Bias=0，量具無系統性偏差，量測準確性良好"], "ans": "X̄=50.00mm，Bias=0，%Bias=0%，量具無系統偏差"}, {"n": 78, "ch": "X̄-R 管制界限計算", "q": "n=5（A₂=0.577, D₃=0, D₄=2.114），X̄̄=25.40, R̄=1.20。計算 X̄ 圖與 R 圖的管制界限（UCL/LCL）。", "given": "n=5, A₂=0.577, D₃=0, D₄=2.114, X̄̄=25.40, R̄=1.20", "steps": ["UCL_X̄ = X̄̄ + A₂R̄ = 25.40 + 0.577×1.20 = 25.40 + 0.692 = 26.09", "LCL_X̄ = X̄̄ − A₂R̄ = 25.40 − 0.692 = 24.71", "UCL_R = D₄ × R̄ = 2.114 × 1.20 = 2.54", "LCL_R = D₃ × R̄ = 0 × 1.20 = 0（n≤6 時 D₃=0）"], "ans": "UCL_X̄=26.09，LCL_X̄=24.71，UCL_R=2.54，LCL_R=0"}, {"n": 79, "ch": "p 管制圖計算", "q": "10批，每批 n=200，總不良品=120件；某批不良12件。計算：(1) p̄ (2) σ_p (3) UCL_p (4) LCL_p (5) 判斷該批是否失控。", "given": "k=10批, n=200, 總不良=120件, 特定批不良=12件", "steps": ["p̄ = 120 / (10×200) = 0.060", "σ_p = √(0.06×0.94/200) = √0.000282 ≈ 0.01679", "UCL_p = 0.060 + 3×0.01679 = 0.110", "LCL_p = 0.060 − 0.050 = 0.010", "特定批 p=12/200=0.060，0.010<0.060<0.110 → 在管制內 ✓"], "ans": "p̄=0.060，UCL_p=0.110，LCL_p=0.010；特定批在管制內"}, {"n": 80, "ch": "c 管制圖計算", "q": "20片PCB缺點數：3,5,2,4,6,3,4,2,5,3,4,3,2,6,4,5,3,4,2,4。計算 c̄、UCL_c、LCL_c，判斷6個缺點是否失控。", "given": "20片PCB缺點數：3,5,2,4,6,3,4,2,5,3,4,3,2,6,4,5,3,4,2,4", "steps": ["總缺點數=3+5+2+4+6+3+4+2+5+3+4+3+2+6+4+5+3+4+2+4=74", "c̄ = 74/20 = 3.70", "UCL_c = 3.70 + 3√3.70 = 3.70 + 3×1.924 = 9.47", "LCL_c = 3.70 − 5.77 = −2.07 → 取 0", "c=6 < UCL=9.47 → 在管制內 ✓"], "ans": "c̄=3.70，UCL_c=9.47，LCL_c=0；c=6在管制內"}, {"n": 81, "ch": "柏拉圖累積百分比", "q": "缺陷次數：A=85, B=42, C=28, D=15, E=10, 其他=20。計算各項百分比、累積百分比，依80/20法則找出重點改善項目。", "given": "A=85, B=42, C=28, D=15, E=10, 其他=20次", "steps": ["總次數 = 85+42+28+15+10+20 = 200", "各項%：A=42.5%, B=21.0%, C=14.0%, D=7.5%, E=5.0%, 其他=10%", "累積%：A=42.5%，A+B=63.5%，A+B+C=77.5%，A+B+C+D=85.0%", "依80%法則，前三項（A+B+C）累積77.5%，為重點改善對象"], "ans": "重點改善：A（42.5%）、B（21.0%）、C（14.0%），合計77.5%"}, {"n": 82, "ch": "直方圖組距計算", "q": "n=100筆，最大值=52.8，最小值=44.2。計算：(1) 建議組數 (2) 組距，並列出10個組別範圍（起始值=44.0）。", "given": "n=100, Max=52.8, Min=44.2, 起始值=44.0", "steps": ["建議組數 ≈ √n = √100 = 10 組", "全距 = 52.8 − 44.2 = 8.6", "組距 = 8.6 / 10 = 0.86 → 取 0.9", "組別：[44.0,44.9), [44.9,45.8), ... [52.1,53.0)，共10組"], "ans": "10組，組距=0.9，組別範圍[44.0~53.0)"}, {"n": 83, "ch": "二項分配計算", "q": "不良率 p=0.05，抽取 n=10件。計算：(1) P(X=0) (2) P(X=1) (3) P(X≤1)。（0.95¹⁰≈0.5987, 0.95⁹≈0.6302）", "given": "p=0.05, n=10；0.95¹⁰=0.5987, 0.95⁹=0.6302", "steps": ["P(X=0) = C(10,0)×0.05⁰×0.95¹⁰ = 1×0.5987 ≈ 59.87%", "P(X=1) = C(10,1)×0.05¹×0.95⁹ = 10×0.05×0.6302 = 0.3151 ≈ 31.51%", "P(X≤1) = 0.5987 + 0.3151 = 0.9138 ≈ 91.38%"], "ans": "P(0件)≈59.87%，P(1件)≈31.51%，P(≤1件)≈91.38%"}, {"n": 84, "ch": "泊松分配計算", "q": "設備每小時平均故障 λ=0.5 次。計算：(1) P(X=0) (2) P(X=1) (3) P(X≥2)。（e⁻⁰·⁵≈0.6065）", "given": "X~Poisson(λ=0.5), e⁻⁰·⁵=0.6065", "steps": ["P(X=0) = e⁻⁰·⁵ = 0.6065 ≈ 60.65%", "P(X=1) = 0.5×e⁻⁰·⁵ = 0.5×0.6065 = 0.3033 ≈ 30.33%", "P(X≥2) = 1−0.6065−0.3033 = 0.0902 ≈ 9.02%"], "ans": "P(0次)≈60.65%，P(1次)≈30.33%，P(≥2次)≈9.02%"}, {"n": 85, "ch": "超幾何分配計算", "q": "N=20件中含 D=4件不良，無放回抽取 n=5件。計算：(1) P(X=0) (2) P(X≥1)。（C(16,5)=4368, C(20,5)=15504）", "given": "N=20, D=4, n=5；C(16,5)=4368, C(20,5)=15504", "steps": ["P(X=0) = C(4,0)×C(16,5)/C(20,5) = 1×4368/15504 = 4368/15504", "P(X=0) = 0.2817 ≈ 28.17%", "P(X≥1) = 1−0.2817 = 0.7183 ≈ 71.83%"], "ans": "P(0件不良)≈28.17%，P(至少1件不良)≈71.83%"}, {"n": 86, "ch": "常態分配良率計算", "q": "X~N(μ=100, σ=2)，USL=105, LSL=95。計算：(1) Z值 (2) 良率 (3) 不良率（PPM）。（Φ(2.5)=0.9938）", "given": "μ=100, σ=2, USL=105, LSL=95；Φ(2.5)=0.9938", "steps": ["Z_upper = (105−100)/2 = 2.5；Z_lower = (100−95)/2 = 2.5", "良率 = 2×Φ(2.5)−1 = 2×0.9938−1 = 0.9876 = 98.76%", "不良率 = 1−0.9876 = 0.0124 = 1.24% = 12,400 PPM"], "ans": "良率=98.76%，不良率=1.24%（12,400 PPM）"}, {"n": 87, "ch": "t 信賴區間計算", "q": "n=25件，X̄=48.2mm，s=1.5mm，求 95% CI。（t₀.₀₂₅,₂₄=2.064）", "given": "n=25, X̄=48.2mm, s=1.5mm, t₀.₀₂₅,₂₄=2.064", "steps": ["SE = s/√n = 1.5/5 = 0.300", "ME = t×SE = 2.064×0.300 = 0.619 mm", "下界 = 48.2−0.619 = 47.58 mm", "上界 = 48.2+0.619 = 48.82 mm"], "ans": "95% CI = (47.58, 48.82) mm"}, {"n": 88, "ch": "抽樣允收機率計算", "q": "抽樣計畫 n=50, c=2，p=0.04。使用泊松近似（λ=np）計算允收機率 Pa。（e⁻²≈0.1353）", "given": "n=50, c=2, p=0.04; λ=np=2.0; e⁻²=0.1353", "steps": ["λ = 50×0.04 = 2.0（泊松近似）", "P(X=0) = e⁻² = 0.1353", "P(X=1) = 2×e⁻² = 0.2707", "P(X=2) = (4/2)×e⁻² = 0.2707", "Pa = 0.1353+0.2707+0.2707 = 0.6767 ≈ 67.7%"], "ans": "允收機率 Pa ≈ 67.7%"}, {"n": 89, "ch": "ATI 平均全檢數計算", "q": "承接Q88：n=50, c=2, N=1000, Pa=0.677。計算 ATI 並解讀。", "given": "n=50, N=1000, Pa=0.677", "steps": ["ATI = n + (1−Pa)(N−n)", "ATI = 50 + (1−0.677)×(1000−50)", "ATI = 50 + 0.323×950 = 50 + 306.9", "ATI ≈ 357件（約佔批量35.7%）"], "ans": "ATI ≈ 357件"}, {"n": 90, "ch": "Cp 與 Cpk 計算", "q": "μ=50.2, σ=0.5, USL=52, LSL=48。計算 Cp、CPU、CPL、Cpk，並判斷製程等級。", "given": "μ=50.2, σ=0.5, USL=52, LSL=48", "steps": ["Cp = (52−48)/(6×0.5) = 4/3.0 = 1.333", "CPU = (52−50.2)/(3×0.5) = 1.8/1.5 = 1.200", "CPL = (50.2−48)/(3×0.5) = 2.2/1.5 = 1.467", "Cpk = min(1.200, 1.467) = 1.200", "1.0 < Cpk=1.200 < 1.33 → 有能力但不符 IATF 要求（需≥1.33）"], "ans": "Cp=1.333，Cpk=1.200；不符 IATF 16949 要求（需Cpk≥1.33）"}, {"n": 91, "ch": "R̄/d₂ 估算製程標準差", "q": "n=4（d₂=2.059, D₄=2.282, D₃=0），15組R值：2,3,1,4,2,3,2,1,3,2,4,3,2,1,3。計算 R̄、σ̂、UCL_R、LCL_R。", "given": "n=4, d₂=2.059, D₄=2.282, D₃=0；R值：2,3,1,4,2,3,2,1,3,2,4,3,2,1,3", "steps": ["ΣR = 2+3+1+4+2+3+2+1+3+2+4+3+2+1+3 = 36", "R̄ = 36/15 = 2.40", "σ̂ = R̄/d₂ = 2.40/2.059 ≈ 1.17", "UCL_R = D₄×R̄ = 2.282×2.40 = 5.48；LCL_R = 0"], "ans": "R̄=2.40，σ̂≈1.17，UCL_R≈5.48，LCL_R=0"}, {"n": 92, "ch": "Pp 與 Ppk 長期績效", "q": "長期 X̄=25.3，s=1.2，USL=29, LSL=22。計算 Pp、Ppu、Ppl、Ppk，並判斷。", "given": "X̄=25.3, s=1.2, USL=29, LSL=22", "steps": ["Pp = (29−22)/(6×1.2) = 7/7.2 = 0.972", "Ppu = (29−25.3)/(3×1.2) = 3.7/3.6 = 1.028", "Ppl = (25.3−22)/(3×1.2) = 3.3/3.6 = 0.917", "Ppk = min(1.028, 0.917) = 0.917", "Ppk=0.917 < 1.0 → 長期績效不足，需改善"], "ans": "Pp=0.972，Ppk=0.917；長期製程績效不符要求（Ppk<1.0）"}, {"n": 93, "ch": "EWMA 統計量計算", "q": "λ=0.3，z₀=50.0，前四個觀測值：51, 50, 52, 53。逐步計算 z₁～z₄ 並觀察趨勢。", "given": "λ=0.3, z₀=50.0；x₁=51, x₂=50, x₃=52, x₄=53", "steps": ["z₁ = 0.3×51 + 0.7×50.0 = 15.30+35.00 = 50.30", "z₂ = 0.3×50 + 0.7×50.30 = 15.00+35.21 = 50.21", "z₃ = 0.3×52 + 0.7×50.21 = 15.60+35.15 = 50.75", "z₄ = 0.3×53 + 0.7×50.75 = 15.90+35.53 = 51.43", "觀察：z₁~z₄呈上升趨勢，製程均值可能向上漂移"], "ans": "z₁=50.30, z₂=50.21, z₃=50.75, z₄=51.43（上升趨勢）"}, {"n": 94, "ch": "ndc 量具鑑別力計算", "q": "GR&R=0.20，PV=0.60。計算 ndc，判斷量測系統是否足夠。", "given": "GR&R=0.20, PV=0.60", "steps": ["ndc = 1.41 × (PV / GR&R) = 1.41 × (0.60/0.20) = 1.41 × 3.0 = 4.23", "ndc = 4.23 < 5 → 量具鑑別力不足", "ndc<5 代表量測系統無法有效分辨≥5個不同類別的零件差異", "改善建議：提升量具解析度或降低 GR&R"], "ans": "ndc ≈ 4.23 < 5 → 量具鑑別力不足，需改善"}, {"n": 95, "ch": "抽樣計畫查表應用", "q": "N=500，GIS II，AQL=2.5%，正常單次抽樣（ANSI Z1.4）。確定：(1) 樣本代字 (2) n (3) Ac (4) Re。", "given": "N=500, GIS II, AQL=2.5%, 正常單次抽樣", "steps": ["N=281~500，GIS II → 樣本代字 = H", "代字H，正常單次抽樣表 → n = 50", "AQL=2.5% → Ac=3, Re=4", "結論：抽50件，不良≤3→允收；≥4→拒收"], "ans": "樣本代字H，n=50，Ac=3，Re=4"}, {"n": 96, "ch": "製程偏移對良率的影響", "q": "σ=0.3, USL=10.0, LSL=8.0；原居中μ=9.0，後偏移至μ=9.45。計算原始良率與偏移後上方不良率。（Φ(3.33)=0.9996, Φ(1.83)=0.9664）", "given": "σ=0.3, USL=10.0, LSL=8.0；居中μ=9.0；偏移後μ=9.45", "steps": ["居中：Z=(10−9)/0.3=3.33；良率=2×0.9996−1=99.92%", "偏移後：Z_upper=(10.0−9.45)/0.3=1.833", "P(X>USL) = 1
